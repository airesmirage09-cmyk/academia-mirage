  /** Crea un elemento a partir de HTML (un solo nodo raíz). */
  ui.el = (html) => {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  };

  ui.shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  /** Mezcla garantizando que el resultado no quede en el orden original. */
  ui.shuffleNot = (arr) => {
    if (arr.length < 2) return arr.slice();
    let a;
    do { a = ui.shuffle(arr); } while (a.every((v, i) => v === arr[i]));
    return a;
  };

  ui.fmtDate = (iso) => {
    try { return new Date(iso).toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' }); }
    catch (e) { return iso; }
  };

  ui.letter = (i) => 'ABCDEFGHIJ'[i];

  ui.satColor = (v) => v >= 75 ? '#1E8E5A' : v >= 50 ? '#7DAA2E' : v >= 30 ? '#D69E2E' : '#C2453D';
  ui.moodFromSat = (v) => v >= 85 ? 4 : v >= 65 ? 3 : v >= 45 ? 2 : v >= 25 ? 1 : 0;
  ui.moodLabel = (m) => ['Muy molesto', 'Molesto', 'Neutral', 'Satisfecho', 'Encantado'][m];

  ui.levels = [
    { min: 0, name: 'Aprendiz de servicio' },
    { min: 400, name: 'Anfitrión Mirage' },
    { min: 900, name: 'Embajador del cliente' },
    { min: 1500, name: 'Creador de experiencias' },
    { min: 2100, name: 'Leyenda del servicio' }
  ];
  ui.levelFor = (xp) => {
    let lv = ui.levels[0], idx = 0;
    ui.levels.forEach((l, i) => { if (xp >= l.min) { lv = l; idx = i; } });
    return Object.assign({ index: idx + 1 }, lv);
  };

  /* ---------- Avisos ---------- */
  ui.toast = (msg, icon) => {
    const host = document.getElementById('toastHost');
    const t = ui.el(`<div class="toast" role="status"><span class="toast__ico">${SCM.icon(icon || 'star')}</span><span>${msg}</span></div>`);
    host.appendChild(t);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 400); }, 2600);
  };

  /* ---------- Modal accesible ---------- */
  ui.modal = (html, opts) => {
    opts = opts || {};
    const host = document.getElementById('modalHost');
    const prevFocus = document.activeElement;
    const m = ui.el(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal__box">${html}</div></div>`);
    host.appendChild(m);
    const close = () => {
      m.remove();
      document.removeEventListener('keydown', onKey);
      if (prevFocus && prevFocus.focus) prevFocus.focus();
      if (opts.onClose) opts.onClose();
    };
    const onKey = (e) => {
      if (e.key === 'Escape') close();
      if (e.key === 'Tab') {
        const f = m.querySelectorAll('button, [href], input, select, textarea');
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener('keydown', onKey);
    m.addEventListener('click', (e) => { if (e.target === m && opts.dismissable !== false) close(); });
    m.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
    const focusTarget = m.querySelector('[data-autofocus]') || m.querySelector('button, input');
    if (focusTarget) setTimeout(() => focusTarget.focus(), 50);
    return { el: m, close };
  };

  ui.confirm = (title, text, okLabel) => new Promise((resolve) => {
    let answered = false;
    const md = ui.modal(`<h2 id="modalTitle">${title}</h2><p>${text}</p><div class="btn-row"><button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" data-ok>${okLabel || 'Aceptar'}</button></div>`, { onClose: () => { if (!answered) resolve(false); } });
    md.el.querySelector('[data-ok]').addEventListener('click', () => { answered = true; md.close(); resolve(true); });
  });

  /* ---------- Confeti ---------- */
  ui.confetti = (n) => {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const colors = ['#EA0029', '#EA0029', '#EA0029', '#1E8E5A', '#C8C9CC', '#C8C9CC'];
    const box = ui.el('<div class="confetti" aria-hidden="true"></div>');
    for (let i = 0; i < (n || 90); i++) {
      const p = document.createElement('i');
      p.style.left = Math.random() * 100 + 'vw';
      p.style.background = colors[i % colors.length];
      p.style.animationDuration = (2 + Math.random() * 2.2) + 's';
      p.style.animationDelay = (Math.random() * .6) + 's';
      p.style.transform = `rotate(${Math.random() * 360}deg)`;
      if (i % 3 === 0) p.style.borderRadius = '50%';
      box.appendChild(p);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 5200);
  };

  /* ---------- Lista ordenable (mouse, táctil y teclado) ----------
     listEl: <ol> con <li class="sort-item" data-id>. onChange(ids[]) */
  ui.makeSortable = (listEl, onChange) => {
    let drag = null;
    const ids = () => Array.from(listEl.children).map(li => li.dataset.id);
    const renumber = () => {
      Array.from(listEl.children).forEach((li, i, arr) => {
        const n = li.querySelector('.sort-item__n'); if (n) n.textContent = i + 1;
        const up = li.querySelector('[data-move="up"]'), dn = li.querySelector('[data-move="down"]');
        if (up) up.disabled = i === 0 || listEl.classList.contains('locked');
        if (dn) dn.disabled = i === arr.length - 1 || listEl.classList.contains('locked');
      });
    };
    renumber();

    listEl.addEventListener('click', (e) => {
      const b = e.target.closest('[data-move]');
      if (!b || listEl.classList.contains('locked')) return;
      const li = b.closest('.sort-item');
      if (b.dataset.move === 'up' && li.previousElementSibling) listEl.insertBefore(li, li.previousElementSibling);
      if (b.dataset.move === 'down' && li.nextElementSibling) listEl.insertBefore(li.nextElementSibling, li);
      renumber();
      const again = li.querySelector(`[data-move="${b.dataset.move}"]`);
      (again && !again.disabled ? again : li.querySelector('[data-move]:not(:disabled)'))?.focus();
      onChange && onChange(ids());
    });

    listEl.addEventListener('pointerdown', (e) => {
      if (listEl.classList.contains('locked') || e.button > 0) return;
      const li = e.target.closest('.sort-item');
      if (!li || e.target.closest('button')) return;
      // En táctil, solo desde el asa para no bloquear el desplazamiento
      if (e.pointerType !== 'mouse' && !e.target.closest('.sort-item__grip')) return;
      e.preventDefault();
      drag = { li, startY: e.clientY, id: e.pointerId };
      li.setPointerCapture(e.pointerId);
      li.classList.add('dragging');
    });
    listEl.addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const li = drag.li;
      li.style.transform = `translateY(${e.clientY - drag.startY}px)`;
      const r = li.getBoundingClientRect();
      const center = r.top + r.height / 2;
      const next = li.nextElementSibling, prev = li.previousElementSibling;
      if (next) {
        const nr = next.getBoundingClientRect();
        if (center > nr.top + nr.height / 2) {
          const before = li.offsetTop; listEl.insertBefore(next, li); drag.startY += li.offsetTop - before;
          li.style.transform = `translateY(${e.clientY - drag.startY}px)`; renumber();
        }
      }
      if (prev) {
        const pr = prev.getBoundingClientRect();
        if (center < pr.top + pr.height / 2) {
          const before = li.offsetTop; listEl.insertBefore(li, prev); drag.startY += li.offsetTop - before;
          li.style.transform = `translateY(${e.clientY - drag.startY}px)`; renumber();
        }
      }
    });
    const end = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      drag.li.style.transform = '';
      drag.li.classList.remove('dragging');
      drag = null;
      renumber();
      onChange && onChange(ids());
    };
    listEl.addEventListener('pointerup', end);
    listEl.addEventListener('pointercancel', end);
    return { ids, renumber };
  };

  ui.sortItemHTML = (id, text) => `
    <li class="sort-item" data-id="${ui.esc(id)}">
      <span class="sort-item__grip" aria-hidden="true">${SCM.icon('grip')}</span>
      <span class="sort-item__n" aria-hidden="true"></span>
      <span class="sort-item__text">${text}</span>
      <span class="sort-item__btns">
        <button type="button" data-move="up" aria-label="Subir: ${ui.esc(String(text).replace(/<[^>]+>/g, ''))}">${SCM.icon('up')}</button>
        <button type="button" data-move="down" aria-label="Bajar: ${ui.esc(String(text).replace(/<[^>]+>/g, ''))}">${SCM.icon('down')}</button>
      </span>
    </li>`;

  /* ---------- Arrastrar a una zona (con alternativa de clic/teclado) ----------
     cards: elementos .dcard con data-id; zone: elemento destino; onDrop(id) */
  ui.dragToZone = (cards, zone, onDrop) => {
    cards.forEach(card => {
      card.addEventListener('click', () => { if (!card.disabled) onDrop(card.dataset.id); });
      card.addEventListener('pointerdown', (e) => {
        if (card.disabled || e.button > 0) return;
        const startX = e.clientX, startY = e.clientY;
        let ghost = null, moved = false;
        const move = (ev) => {
          if (!moved && Math.hypot(ev.clientX - startX, ev.clientY - startY) < 8) return;
          if (!moved) {
            moved = true;
            const r = card.getBoundingClientRect();
            ghost = card.cloneNode(true);
            ghost.classList.add('ghost');
            ghost.style.width = r.width + 'px';
            document.body.appendChild(ghost);
            card.classList.add('lifted');
          }
          ev.preventDefault();
          ghost.style.left = (ev.clientX - 30) + 'px';
          ghost.style.top = (ev.clientY - 24) + 'px';
          const zr = zone.getBoundingClientRect();
          const over = ev.clientX > zr.left && ev.clientX < zr.right && ev.clientY > zr.top && ev.clientY < zr.bottom;
          zone.classList.toggle('over', over);
        };
        const up = (ev) => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          window.removeEventListener('pointercancel', up);
          if (!moved) return; // fue un clic: lo maneja 'click'
          const zr = zone.getBoundingClientRect();
          const over = ev.clientX > zr.left && ev.clientX < zr.right && ev.clientY > zr.top && ev.clientY < zr.bottom;
          ghost && ghost.remove();
          card.classList.remove('lifted');
          zone.classList.remove('over');
          // Evita que el clic posterior al arrastre vuelva a disparar la acción
          const block = (ce) => { ce.stopPropagation(); ce.preventDefault(); };
          card.addEventListener('click', block, { capture: true, once: true });
          setTimeout(() => card.removeEventListener('click', block, { capture: true }), 50);
          if (over) onDrop(card.dataset.id);
        };
        window.addEventListener('pointermove', move, { passive: false });
        window.addEventListener('pointerup', up);
        window.addEventListener('pointercancel', up);
      });
    });
  };

  /** Carga una imagen local para dibujarla en canvas (null si falla). */
  ui.loadImage = (src) => new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });

  /* ---------- Texto en canvas con salto de línea ---------- */
  ui.wrapText = (ctx, text, x, y, maxW, lineH, maxLines) => {
    const words = String(text).split(/\s+/);
    let line = '', lines = [];
    words.forEach(w => {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
    });
    if (line) lines.push(line);
    if (maxLines && lines.length > maxLines) {
      lines = lines.slice(0, maxLines);
      lines[maxLines - 1] = lines[maxLines - 1].replace(/\s*\S*$/, '') + '…';
    }
    lines.forEach((l, i) => ctx.fillText(l, x, y + i * lineH));
    return lines.length;
  };

  /** Muestra una imagen en el área de impresión y abre el diálogo de impresión. */
  ui.printImage = (dataUrl) => {
    const area = document.getElementById('printArea');
    area.innerHTML = `<img src="${dataUrl}" alt="">`;
    document.body.classList.add('printing');
    const done = () => { document.body.classList.remove('printing'); area.innerHTML = ''; window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    const img = area.querySelector('img');
    const go = () => setTimeout(() => { window.print(); setTimeout(() => { if (document.body.classList.contains('printing')) done(); }, 1500); }, 60);
    if (img.complete) go(); else img.onload = go;
  };

  ui.download = (blobOrUrl, filename) => {
    const url = typeof blobOrUrl === 'string' ? blobOrUrl : URL.createObjectURL(blobOrUrl);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    if (typeof blobOrUrl !== 'string') setTimeout(() => URL.revokeObjectURL(url), 4000);
  };

  SCM.ui = ui;
})();

/* ==========================================================================
   Generador mínimo de PDF (sin librerías externas).
   Inserta una imagen JPEG a página completa (A4 horizontal por defecto).
   ========================================================================== */
(function () {
  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  /**
   * @param {HTMLCanvasElement} canvas
   * @param {{title?:string, pageW?:number, pageH?:number}} opts  medidas en puntos
   * @returns {Blob} application/pdf
   */
  function canvasToPdf(canvas, opts) {
    opts = opts || {};
    const pageW = opts.pageW || 841.89, pageH = opts.pageH || 595.28; // A4 horizontal
    const jpeg = b64ToBytes(canvas.toDataURL('image/jpeg', 0.92).split(',')[1]);
    const imgW = canvas.width, imgH = canvas.height;

    // Ajuste proporcional centrado
    const scale = Math.min(pageW / imgW, pageH / imgH);
    const dw = imgW * scale, dh = imgH * scale;
    const dx = (pageW - dw) / 2, dy = (pageH - dh) / 2;
    const content = `q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${dx.toFixed(2)} ${dy.toFixed(2)} cm /Im0 Do Q`;
    const title = (opts.title || 'Documento').replace(/[()\\]/g, '');
    // Título en UTF-16BE para admitir acentos en los metadatos
    let titleHex = 'FEFF';
    for (const ch of title) {
      const code = ch.codePointAt(0);
      if (code <= 0xFFFF) titleHex += code.toString(16).padStart(4, '0').toUpperCase();
    }

    const enc = new TextEncoder();
    const parts = [];
    const offsets = [];
    let length = 0;
    const push = (chunk) => {
      const bytes = typeof chunk === 'string' ? enc.encode(chunk) : chunk;
      parts.push(bytes); length += bytes.length;
    };
    const obj = (n, body) => { offsets[n] = length; push(`${n} 0 obj\n`); body(); push('\nendobj\n'); };

    push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
    obj(2, () => push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
    obj(3, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`));
    obj(4, () => {
      push(`<< /Type /XObject /Subtype /Image /Width ${imgW} /Height ${imgH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
      push(jpeg);
      push('\nendstream');
    });
    obj(5, () => push(`<< /Length ${enc.encode(content).length} >>\nstream\n${content}\nendstream`));
    obj(6, () => push(`<< /Title <${titleHex}> /Producer (Academia Mirage) /CreationDate (D:${new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14)}) >>`));

    const xref = length;
    let x = 'xref\n0 7\n0000000000 65535 f \n';
    for (let i = 1; i <= 6; i++) x += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
    push(x);
    push(`trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n${xref}\n%%EOF`);

    return new Blob(parts, { type: 'application/pdf' });
  }

  SCM.pdf = { canvasToPdf };
})();

</script>
  <script>
/* ==========================================================================
   Infografías interactivas: recorrido, tarjetas giratorias, método,
   ciclo y pirámide. Todas requieren explorar cada elemento para avanzar.
   ========================================================================== */
(function () {
  const { el, esc } = SCM.ui;
  const I = SCM.icon;

  function detailHTML(item, screen) {
    const labels = screen.labels || ['Qué espera el cliente', 'Cómo hacerlo extraordinario'];
    let body = '';
    if (item.expects) {
      body = `<div class="detail__cols">
        <div class="detail__box"><strong>${I('user')} ${labels[0]}</strong>${item.expects}</div>
        <div class="detail__box good"><strong>${I('sparkles')} ${labels[1]}</strong>${item.wow}</div>
      </div>`;
    } else {
      body = `<p style="margin:0">${item.text}</p>${item.example ? `<div class="detail__box good" style="margin-top:12px"><strong>${I('sparkles')} Ejemplo Mirage</strong>${item.example}</div>` : ''}`;
    }
    return `<div class="detail" aria-live="polite">
      <div class="detail__head"><span class="detail__ico">${I(item.icon || 'info')}</span><h3>${item.title}</h3></div>${body}</div>`;
  }

  function render(screen, ctx) {
    const items = screen.items;
    const root = el(`<div class="explore"></div>`);
    const seen = new Set(ctx.isDone ? items.map((_, i) => i) : (ctx.getData('seen') || []));
    const status = el(`<div class="explore-status"><span class="bar"><span></span></span><span class="explore-status__txt"></span></div>`);
    let active = -1;
    const visual = el('<div></div>');
    const detailWrap = el(`<div class="detail-wrap" style="margin-top:18px"><div class="detail__empty">${I('hand')} Selecciona un elemento para ver su detalle.</div></div>`);

    function updateStatus() {
      status.querySelector('.bar > span').style.width = (seen.size / items.length * 100) + '%';
      status.querySelector('.explore-status__txt').innerHTML = seen.size === items.length
        ? `<strong style="color:var(--ok)">${I('check')} ¡Exploraste todo!</strong>`
        : `Explorados: <strong>${seen.size} de ${items.length}</strong>`;
    }

    function select(i) {
      active = i;
      seen.add(i);
      ctx.setData('seen', Array.from(seen));
      paint();
      if (screen.variant !== 'flip') detailWrap.innerHTML = detailHTML(items[i], screen);
      updateStatus();
      if (seen.size === items.length) ctx.complete({ xp: 20, label: 'Infografía explorada' });
    }

    const v = screen.variant;
    if (v === 'journey') {
      visual.className = 'journey';
      visual.innerHTML = `<div class="journey__track"></div><div class="journey__fill"></div><div class="journey__nodes" role="list"></div>`;
      const nodes = visual.querySelector('.journey__nodes');
      items.forEach((it, i) => nodes.appendChild(el(`<button class="jnode" role="listitem" data-i="${i}" aria-label="${i + 1}. ${esc(it.label)}"><span class="jnode__dot">${I(it.icon)}<span class="jnode__n">${i + 1}</span></span><span class="jnode__label">${it.label}</span></button>`)));
    } else if (v === 'flip') {
      visual.className = 'flip-grid';
      items.forEach((it, i) => visual.appendChild(el(`
        <button class="flip" data-i="${i}" aria-pressed="false" aria-label="${esc(it.title)}: toca para ver la explicación">
          <span class="flip__inner">
            <span class="flip__face flip__front"><span class="big-ico">${I(it.icon)}</span><h3>${it.title}</h3><span class="hint">${I('refresh')} Toca para descubrir</span></span>
            <span class="flip__face flip__back"><strong>${it.title}</strong><span>${it.text}</span><span class="ex">${it.example}</span></span>
          </span>
        </button>`)));
    } else if (v === 'method') {
      visual.className = 'method';
      items.forEach((it, i) => visual.appendChild(el(`<button class="mletter" data-i="${i}" aria-label="${esc(it.letter)}: ${esc(it.title)}"><b>${it.letter}</b><span>${it.label}</span></button>`)));
    } else if (v === 'cycle') {
      visual.className = 'cycle';
      visual.innerHTML = `<div class="cycle__ring"></div><div class="cycle__center">${esc(screen.center || '')}<small>${esc(screen.centerSub || '')}</small></div>`;
      items.forEach((it, i) => {
        const a = -Math.PI / 2 + (i / items.length) * Math.PI * 2;
        const x = 50 + Math.cos(a) * 38, y = 50 + Math.sin(a) * 38;
        visual.appendChild(el(`<button class="cnode" data-i="${i}" style="left:${x}%;top:${y}%" aria-label="${esc(it.label)}"><span class="jnode__dot">${I(it.icon)}</span><span class="jnode__label">${it.label}</span></button>`));
      });
    } else if (v === 'pyramid') {
      visual.className = 'pyramid';
      const shades = ['#EA0029', '#76777A', '#222933', '#000000'];
      items.forEach((it, i) => {
        const w = 42 + i * (58 / Math.max(1, items.length - 1));
        visual.appendChild(el(`<button class="plevel" data-i="${i}" style="width:${w}%;background:${shades[i % shades.length]}" aria-label="${esc(it.title)}">${I(it.icon)}<span>${it.label}<small>${it.sub}</small></span></button>`));
      });
    }

    function paint() {
      visual.querySelectorAll('[data-i]').forEach(b => {
        const i = +b.dataset.i;
        b.classList.toggle('seen', seen.has(i));
        b.classList.toggle('active', i === active);
      });
      if (v === 'journey') {
        const max = seen.size ? Math.max(...seen) : 0;
        visual.querySelector('.journey__fill').style.width = (88 * (max / Math.max(1, items.length - 1))) + '%';
      }
    }

    visual.addEventListener('click', (e) => {
      const b = e.target.closest('[data-i]');
      if (!b) return;
      const i = +b.dataset.i;
      if (v === 'flip') {
        b.classList.toggle('flipped');
        b.setAttribute('aria-pressed', b.classList.contains('flipped'));
      }
      select(i);
    });

    root.appendChild(status);
    root.appendChild(visual);
    if (v !== 'flip') root.appendChild(detailWrap);
    paint();
    updateStatus();
    // Pista visual en el primer elemento sin explorar
    const first = visual.querySelector('[data-i]:not(.seen) .jnode__dot, [data-i]:not(.seen).mletter');
    if (first && !seen.size) first.classList.add('pulse');
    return root;
  }

  SCM.infographics = { render };
})();

  <script>
/* ==========================================================================
   Actividades y juegos interactivos.
   classify · match · branch · casesolve · route · commit
   Cada render(act, ctx) devuelve un elemento y llama ctx.complete() al terminar.
   ========================================================================== */
(function () {
  const { el, esc, shuffle, shuffleNot, letter } = SCM.ui;
  const I = SCM.icon;
  const A = {};

  function resultHTML(o) {
    return `<div class="result" tabindex="-1">
      ${o.art || `<span class="pill ${o.tone === 'bad' ? 'bad' : o.tone === 'mid' ? 'warn' : 'ok'}">${I(o.tone === 'ok' ? 'trophy' : 'refresh')} Resultado</span>`}
      <div class="result__score">${o.score}${o.suffix == null ? '%' : o.suffix}</div>
      <h3>${o.title}</h3><p>${o.text}</p>${o.extra || ''}
      <div class="btn-row"><button class="btn btn-ghost" data-retry>${I('refresh')} ${o.retryLabel || 'Jugar de nuevo'}</button></div>
    </div>`;
  }

  function doneBanner(ctx, act, onReplay) {
    const rec = SCM.store.getActivity(act.id);
    if (!ctx.isDone || !rec) return null;
    const b = el(`<div class="done-banner">${I('check')} <span>Ya completaste esta actividad. Mejor puntuación: <strong>${rec.best != null ? rec.best : rec.score}%</strong></span><button class="btn btn-sm btn-ghost">${I('refresh')} Jugar de nuevo</button></div>`);
    b.querySelector('button').addEventListener('click', onReplay);
    return b;
  }

  function saveResult(act, score, extra) {
    const prev = SCM.store.getActivity(act.id);
    const best = Math.max(score, prev && prev.best != null ? prev.best : 0);
    SCM.store.setActivity(act.id, Object.assign({ score, best, done: true, at: new Date().toISOString() }, extra || {}));
  }

  function finish(act, ctx, score, extra) {
    saveResult(act, score, extra);
    ctx.complete({ xp: Math.max(10, Math.round(act.xp * score / 100)), label: 'Actividad completada', score });
  }

  /* ======================= CLASIFICAR ======================= */
  A.classify = function (act, ctx) {
    const root = el('<div class="game"></div>');
    function start() {
      root.innerHTML = '';
      const items = shuffle(act.items);
      let idx = 0, correct = 0;
      const hud = el(`<div class="game-hud">
        <div class="hud">${I('layers')} Situación <strong data-n>1</strong>&nbsp;de ${items.length}</div>
        <div class="hud">${I('check')} Aciertos <strong data-ok>0</strong></div>
        <div class="hud grow">${I('gauge')}<div class="meter" aria-hidden="true"><span data-bar style="width:0;background:var(--blue)"></span></div></div>
      </div>`);
      const stage = el('<div class="deck"></div>');
      root.appendChild(hud); root.appendChild(stage);

      function show() {
        const it = items[idx];
        const p = SCM.illo.cast[it.who] || {};
        hud.querySelector('[data-n]').textContent = idx + 1;
        hud.querySelector('[data-bar]').style.width = (idx / items.length * 100) + '%';
        stage.innerHTML = '';
        const card = el(`<div class="scard">
          <div class="scard__who">${SCM.illo.avatar(it.who)}<div><strong>${esc(p.name || '')}</strong><small>${esc(p.role || '')}</small></div></div>
          <p class="scard__text">${it.text}</p>
          <div class="choice-row">
            <button class="choice-big excel" data-a="excelente">${I('thumb')} Servicio excelente</button>
            <button class="choice-big mejora" data-a="mejorar">${I('refresh')} Requiere mejorar</button>
          </div>
          <div data-fb></div>
        </div>`);
        stage.appendChild(card);
        card.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => answer(b, card, it)));
        card.querySelector('[data-a]').focus({ preventScroll: true });
      }

      function answer(btn, card, it) {
        const ok = btn.dataset.a === it.answer;
        if (ok) correct++;
        card.querySelectorAll('[data-a]').forEach(b => { b.disabled = true; });
        btn.classList.add('picked', ok ? 'right' : 'wrong');
        hud.querySelector('[data-ok]').textContent = correct;
        const label = it.answer === 'excelente' ? 'un servicio excelente' : 'una situación que requiere mejorar';
        const fb = el(`<div class="fb ${ok ? 'ok' : 'bad'}" role="status">${I(ok ? 'check' : 'x')}<div><p><strong>${ok ? '¡Correcto!' : 'No exactamente.'}</strong> Es ${label}.</p><p>${it.why}</p></div></div>`);
        const next = el(`<div class="btn-row" style="margin-top:14px;justify-content:flex-end"><button class="btn btn-primary">${idx < items.length - 1 ? 'Siguiente situación' : 'Ver resultado'} ${I('right')}</button></div>`);
        card.querySelector('[data-fb]').append(fb, next);
        next.querySelector('button').focus({ preventScroll: true });
        next.querySelector('button').addEventListener('click', () => { idx++; idx < items.length ? show() : end(); });
      }

      function end() {
        const score = Math.round(correct / items.length * 100);
        hud.querySelector('[data-bar]').style.width = '100%';
        stage.innerHTML = resultHTML({
          score, tone: score >= 75 ? 'ok' : 'mid',
          title: score === 100 ? '¡Ojo de experto!' : score >= 75 ? '¡Muy bien!' : 'Buen intento',
          text: `Identificaste correctamente ${correct} de ${items.length} situaciones. ${score >= 75 ? 'Reconoces con claridad lo que hace extraordinaria una experiencia.' : 'Repasa las explicaciones y vuelve a intentarlo.'}`
        });
        stage.querySelector('[data-retry]').addEventListener('click', start);
        stage.querySelector('.result').focus({ preventScroll: true });
        finish(act, ctx, score);
      }
      show();
    }
    const banner = doneBanner(ctx, act, () => { banner.remove(); start(); });
    if (banner) { root.appendChild(banner); root.appendChild(el(`<p class="muted">Puedes repetir la actividad para mejorar tu puntuación.</p>`)); }
    else start();
    return root;
  };

  /* ======================= RELACIONAR ======================= */
  A.match = function (act, ctx) {
    const root = el('<div class="game"></div>');
    const colors = ['#222933', '#76777A', '#000000', '#4B4D52', '#EA0029', '#5E6066'];
    function start() {
      root.innerHTML = '';
      let errors = 0, matched = 0, selTerm = null, selDef = null;
      const terms = act.pairs.map((p, i) => ({ i, text: p.term }));
      const defs = shuffleNot(act.pairs.map((p, i) => ({ i, text: p.def })));
      const hud = el(`<div class="game-hud"><div class="hud">${I('puzzle')} Pares <strong data-m>0</strong>&nbsp;de ${act.pairs.length}</div><div class="hud">${I('x')} Errores <strong data-e>0</strong></div></div>`);
      const board = el(`<div class="match">
        <div class="match__col" role="group" aria-label="Técnicas"><h4>Técnica</h4>${terms.map(t => `<button class="mitem term" data-side="t" data-i="${t.i}"><span class="tag">?</span>${esc(t.text)}</button>`).join('')}</div>
        <div class="match__col" role="group" aria-label="Ejemplos"><h4>Ejemplo</h4>${defs.map(d => `<button class="mitem" data-side="d" data-i="${d.i}"><span class="tag">?</span>${esc(d.text)}</button>`).join('')}</div>
      </div>`);
      const live = el('<p class="sr-only" aria-live="polite"></p>');
      root.append(hud, board, live);

      board.addEventListener('click', (e) => {
        const b = e.target.closest('.mitem');
        if (!b || b.disabled) return;
        const side = b.dataset.side;
        board.querySelectorAll(`.mitem[data-side="${side}"]`).forEach(x => x.classList.remove('sel'));
        b.classList.add('sel');
        if (side === 't') selTerm = b; else selDef = b;
        if (selTerm && selDef) check();
      });

      function check() {
        const a = selTerm, b = selDef;
        selTerm = selDef = null;
        if (a.dataset.i === b.dataset.i) {
          const c = colors[matched % colors.length];
          matched++;
          [a, b].forEach(x => {
            x.classList.remove('sel'); x.classList.add('matched'); x.disabled = true;
            x.style.borderColor = c; x.style.background = c + '14';
            const tg = x.querySelector('.tag'); tg.textContent = matched; tg.style.background = c;
          });
          hud.querySelector('[data-m]').textContent = matched;
          live.textContent = `Correcto: ${a.textContent.slice(1)} emparejado.`;
          if (matched === act.pairs.length) end();
        } else {
          errors++;
          hud.querySelector('[data-e]').textContent = errors;
          live.textContent = 'No corresponden. Intenta otra combinación.';
          [a, b].forEach(x => { x.classList.remove('sel'); x.classList.add('err'); setTimeout(() => x.classList.remove('err'), 450); });
        }
      }

      function end() {
        const score = Math.max(40, 100 - errors * 10);
        const res = el(resultHTML({
          score, tone: score >= 80 ? 'ok' : 'mid',
          title: errors === 0 ? '¡Perfecto, sin errores!' : '¡Relacionaste todas las técnicas!',
          text: `Completaste los ${act.pairs.length} pares con ${errors} error${errors === 1 ? '' : 'es'}. Estas técnicas son tu caja de herramientas en cada conversación.`
        }));
        res.style.marginTop = '18px';
        root.appendChild(res);
        res.querySelector('[data-retry]').addEventListener('click', start);
        res.focus({ preventScroll: false });
        finish(act, ctx, score);
      }
    }
    const banner = doneBanner(ctx, act, () => { banner.remove(); start(); });
    if (banner) root.appendChild(banner); else start();
    return root;
  };

  /* ======================= ESCENARIO RAMIFICADO ======================= */
  A.branch = function (act, ctx) {
    const root = el('<div class="game"></div>');
    const cust = SCM.illo.cast[act.customer];

    function start() {
      root.innerHTML = '';
      let sat = act.start, nodeId = 'n1', best = 0, decisions = 0;
      const flags = new Set();
      const sim = el(`<div class="sim">
        <aside class="sim__side card" aria-label="Estado del cliente">
          <div class="sim__face" data-face></div>
          <div>
            <div class="sim__name"><strong>${esc(cust.name)}</strong><small>${esc(cust.role)}</small></div>
            <div class="sim__mood" data-mood></div>
            <div class="sat"><div class="sat__row"><span>Satisfacción del cliente</span><span><strong data-satv></strong><span data-delta></span></span></div>
              <div class="meter" role="meter" aria-label="Satisfacción del cliente" aria-valuemin="0" aria-valuemax="100" data-meter><span data-satbar></span></div></div>
          </div>
          <ol class="sim__steps" aria-label="Etapas">${act.stages.map((s, i) => `<li data-st="${i}"><span class="dot">${i + 1}</span>${esc(s)}</li>`).join('')}</ol>
        </aside>
        <div class="sim__main">
          <div class="chat sim__log" aria-live="polite"><div class="chat__title">${I('phone')} Llamada en curso · ${esc(act.you)}</div></div>
          <div data-dec></div>
        </div>
      </div>`);
      root.appendChild(sim);
      const log = sim.querySelector('.sim__log');
      const dec = sim.querySelector('[data-dec]');

      function paintSat(delta) {
        const mood = SCM.ui.moodFromSat(sat);
        sim.querySelector('[data-face]').innerHTML = SCM.illo.avatar(act.customer, mood, '#F4F5F7');
        const moodEl = sim.querySelector('[data-mood]');
        moodEl.textContent = SCM.ui.moodLabel(mood);
        moodEl.style.color = SCM.ui.satColor(sat);
        sim.querySelector('[data-satv]').textContent = sat + '%';
        const bar = sim.querySelector('[data-satbar]');
        bar.style.width = sat + '%'; bar.style.background = SCM.ui.satColor(sat);
        sim.querySelector('[data-meter]').setAttribute('aria-valuenow', sat);
        const d = sim.querySelector('[data-delta]');
        d.innerHTML = delta ? `<span class="sat__delta ${delta > 0 ? 'up' : 'down'}">${delta > 0 ? '+' : ''}${delta}</span>` : '';
      }
      function paintSteps(stage, finished) {
        sim.querySelectorAll('[data-st]').forEach(li => {
          const i = +li.dataset.st;
          li.classList.toggle('done', finished || i < stage);
          li.classList.toggle('cur', !finished && i === stage);
          li.querySelector('.dot').innerHTML = (finished || i < stage) ? '✓' : String(i + 1);
        });
      }
      function bubble(cls, html, who) {
        const b = el(`<div class="bubble ${cls}"><small>${esc(who)}</small>${html}</div>`);
        log.appendChild(b);
        b.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        return b;
      }
      function typing(then) {
        const t = el('<div class="bubble them typing" aria-label="El cliente está escribiendo"><i></i><i></i><i></i></div>');
        log.appendChild(t);
        setTimeout(() => { t.remove(); then(); }, 750);
      }

      function showNode(id) {
        const node = act.nodes[id];
        paintSteps(node.stage, false);
        dec.innerHTML = '';
        typing(() => {
          bubble('them', esc(node.say), cust.name.split(' ').slice(-2).join(' '));
          const box = el(`<div class="card" style="padding:20px">
            <span class="sim__stage">Etapa ${node.stage + 1} · ${esc(act.stages[node.stage])}</span>
            <p class="sim__prompt">${esc(node.prompt)}</p>
            <div class="opts" role="group" aria-label="Opciones de respuesta"></div></div>`);
          const opts = box.querySelector('.opts');
          shuffle(node.options).forEach((o, i) => {
            const b = el(`<button class="opt"><span class="opt__key">${letter(i)}</span><span>${esc(o.text)}</span></button>`);
            b.addEventListener('click', () => choose(node, o, b, box));
            opts.appendChild(b);
          });
          dec.appendChild(box);
          opts.querySelector('.opt').focus({ preventScroll: true });
        });
      }

      function choose(node, o, btn, box) {
        decisions++;
        if (o.q === 'best') best++;
        if (o.flag) flags.add(o.flag);
        box.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (b !== btn) b.classList.add('dim'); });
        btn.classList.add(o.q === 'best' ? 'right' : o.q === 'bad' ? 'wrong' : 'selected');
        const prev = sat;
        sat = Math.max(0, Math.min(100, sat + o.delta));
        bubble('me ' + (o.q === 'best' ? 'ok' : o.q === 'bad' ? 'bad' : ''), esc(o.text), 'Tú');
        paintSat(sat - prev);
        const tone = o.q === 'best' ? 'ok' : o.q === 'bad' ? 'bad' : 'mid';
        const coach = el(`<div class="coach ${tone}" role="status"><span class="coach__av">${I(tone === 'ok' ? 'thumb' : tone === 'bad' ? 'alert' : 'info')}</span><div><strong>${tone === 'ok' ? 'Excelente decisión' : tone === 'bad' ? 'Cuidado' : 'Puede mejorar'}</strong><p>${esc(o.feedback)}</p></div></div>`);
        box.appendChild(coach);
        const go = () => {
          const cont = el(`<div class="btn-row" style="margin-top:14px;justify-content:flex-end"><button class="btn btn-primary">${o.next ? 'Continuar' : 'Ver desenlace'} ${I('right')}</button></div>`);
          box.appendChild(cont);
          const b = cont.querySelector('button');
          b.focus({ preventScroll: true });
          b.addEventListener('click', () => { o.next ? showNode(o.next) : end(o.end); });
        };
        if (o.reaction && !o.end) typing(() => { bubble('them', esc(o.reaction), cust.name.split(' ').slice(-2).join(' ')); go(); });
        else go();
      }

      function end(endId) {
        paintSteps(0, true);
        let ending = null;
        if (endId) ending = act.endings.find(e => e.id === endId);
        if (!ending) ending = act.endings.filter(e => e.min != null).sort((a, b) => b.min - a.min).find(e => sat >= e.min);
        const notes = Array.from(flags).map(f => act.flagNotes && act.flagNotes[f]).filter(Boolean);
        const score = endId ? Math.min(sat, 40) : sat;
        dec.innerHTML = '';
        const r = el(resultHTML({
          art: `<div class="result__emoji">${SCM.illo.avatar(act.customer, SCM.ui.moodFromSat(sat), '#fff')}</div>`,
          score: sat, suffix: '%', tone: ending.tone,
          title: ending.title,
          text: ending.text,
          extra: `<p><span class="pill ${ending.tone === 'ok' ? 'ok' : ending.tone === 'bad' ? 'bad' : 'warn'}">${I('gauge')} Satisfacción final</span> &nbsp;<span class="pill">${I('star')} Mejores decisiones: ${best} de ${decisions}</span></p>${notes.map(n => `<div class="fb mid" style="text-align:left">${I('alert')}<p>${esc(n)}</p></div>`).join('')}`,
          retryLabel: 'Repetir simulación'
        }));
        dec.appendChild(r);
        r.querySelector('[data-retry]').addEventListener('click', start);
        r.scrollIntoView({ behavior: 'smooth', block: 'start' });
        finish(act, ctx, score, { ending: ending.title });
      }

      paintSat(0);
      showNode(nodeId);
    }
    const banner = doneBanner(ctx, act, () => { banner.remove(); start(); });
    if (banner) root.appendChild(banner); else start();
    return root;
  };

  /* ======================= CASO: ORDENAR + ARRASTRAR RESPUESTA ======================= */
  A.casesolve = function (act, ctx) {
    const root = el('<div class="game"></div>');
    const cust = SCM.illo.cast[act.customer];

    function start() {
      root.innerHTML = '';
      let orderScore = 0, attempts = 0, respTries = 0;
      const head = el(`<div class="chat" style="margin-bottom:18px"><div class="chat__title">${I('phone')} Reporte entrante</div>
        <div style="display:flex;gap:12px;align-items:flex-start">${SCM.illo.avatar(act.customer, 1).replace('class="av"', 'class="av" style="width:52px;height:52px;flex:none"')}
        <div class="bubble them" style="max-width:100%"><small>${esc(cust.name)}</small>${esc(act.report)}</div></div></div>`);
      root.appendChild(head);

      /* Fase 1 */
      const p1 = el(`<div class="card" style="padding:22px">
        <span class="pill">${I('list')} Parte 1 de 2 · Ordena los pasos</span>
        <h3 style="margin-top:12px">¿En qué orden debes atender este reporte?</h3>
        <p class="muted" style="font-size:.9rem">Arrastra las tarjetas (o usa las flechas) y después comprueba tu respuesta.</p>
        <ol class="sortable" aria-label="Pasos de atención, en orden"></ol>
        <div data-fb></div>
        <div class="btn-row" style="margin-top:16px;justify-content:flex-end"><button class="btn btn-primary" data-check>${I('check')} Comprobar orden</button></div>
      </div>`);
      root.appendChild(p1);
      const list = p1.querySelector('.sortable');
      const order = shuffleNot(act.steps.map((_, i) => String(i)));
      list.innerHTML = order.map(i => SCM.ui.sortItemHTML(i, esc(act.steps[+i]))).join('');
      const sortable = SCM.ui.makeSortable(list);
      const checkBtn = p1.querySelector('[data-check]');
      const fbBox = p1.querySelector('[data-fb]');

      checkBtn.addEventListener('click', () => {
        if (list.classList.contains('locked')) {          // modo "intentar de nuevo"
          list.classList.remove('locked');
          list.querySelectorAll('.sort-item').forEach(li => li.classList.remove('right', 'wrong'));
          fbBox.innerHTML = '';
          checkBtn.innerHTML = `${I('check')} Comprobar orden`;
          sortable.renumber();
          return;
        }
        attempts++;
        const ids = sortable.ids();
        let ok = 0;
        list.querySelectorAll('.sort-item').forEach((li, pos) => {
          const right = li.dataset.id === String(pos);
          if (right) ok++;
          li.classList.toggle('right', right); li.classList.toggle('wrong', !right);
        });
        if (attempts === 1) orderScore = ok * 10;
        list.classList.add('locked');
        sortable.renumber();
        if (ok === ids.length) {
          fbBox.innerHTML = `<div class="fb ok" role="status">${I('check')}<div><p><strong>¡Orden correcto!</strong> Registrar, documentar, canalizar, informar, dar seguimiento y cerrar con el cliente.</p></div></div>`;
          checkBtn.remove();
          phase2();
        } else {
          fbBox.innerHTML = `<div class="fb mid" role="status">${I('info')}<div><p><strong>${ok} de ${ids.length} pasos en su lugar.</strong> Los pasos en rojo están fuera de lugar. Pista: no puedes canalizar un caso sin información, ni cerrarlo sin hablar con la clienta.</p></div></div>`;
          checkBtn.innerHTML = `${I('refresh')} Intentar de nuevo`;
          if (attempts >= 3 && !p1.querySelector('[data-show]')) {
            const sb = el(`<button class="btn btn-ghost" data-show>${I('eye')} Ver orden correcto</button>`);
            checkBtn.parentElement.prepend(sb);
            sb.addEventListener('click', () => {
              list.innerHTML = act.steps.map((s, i) => SCM.ui.sortItemHTML(String(i), esc(s))).join('');
              list.classList.add('locked');
              list.querySelectorAll('.sort-item').forEach(li => li.classList.add('right'));
              sortable.renumber();
              fbBox.innerHTML = `<div class="fb ok">${I('info')}<p>Este es el orden recomendado. Revísalo y continúa con la parte 2.</p></div>`;
              sb.remove(); checkBtn.remove();
              phase2();
            });
          }
        }
      });

      /* Fase 2 */
      function phase2() {
        if (root.querySelector('[data-p2]')) return;
        const p2 = el(`<div class="card" style="padding:22px;margin-top:18px" data-p2>
          <span class="pill">${I('message')} Parte 2 de 2 · Elige la mejor respuesta</span>
          <h3 style="margin-top:12px">¿Qué le respondes a ${esc(cust.name)}?</h3>
          <p class="muted" style="font-size:.9rem">Arrastra la respuesta a la zona de mensaje, o tócala para enviarla.</p>
          <div class="dz-wrap">
            <div class="dz-pool" role="group" aria-label="Respuestas posibles"></div>
            <div class="dz" aria-label="Zona de respuesta"><span class="dz__label">${I('message')} Tu respuesta</span><span class="dz__placeholder">Suelta aquí tu respuesta</span></div>
          </div>
          <div data-fb2></div>
        </div>`);
        root.appendChild(p2);
        p2.scrollIntoView({ behavior: 'smooth', block: 'start' });
        const pool = p2.querySelector('.dz-pool'), zone = p2.querySelector('.dz'), fb2 = p2.querySelector('[data-fb2]');
        const resp = shuffle(act.responses.map((r, i) => Object.assign({ i }, r)));
        resp.forEach(r => pool.appendChild(el(`<button class="dcard" data-id="${r.i}">${I('grip')}<span>${esc(r.text)}</span></button>`)));
        const cards = Array.from(pool.querySelectorAll('.dcard'));
        SCM.ui.dragToZone(cards, zone, (id) => {
          const r = act.responses[+id];
          const card = pool.querySelector(`[data-id="${id}"]`) || zone.querySelector(`[data-id="${id}"]`);
          if (!card || card.disabled) return;
          respTries++;
          if (r.correct) {
            cards.forEach(c => { c.disabled = true; });
            zone.querySelector('.dz__placeholder')?.remove();
            zone.querySelectorAll('.dcard').forEach(c => c.remove());
            card.classList.add('placed', 'right');
            zone.appendChild(card);
            fb2.innerHTML = `<div class="fb ok" role="status">${I('check')}<div><p><strong>¡Respuesta enviada!</strong> ${esc(r.feedback)}</p></div></div>`;
            const score = Math.min(100, orderScore + (respTries === 1 ? 40 : respTries === 2 ? 20 : 10));
            const res = el(resultHTML({ score, tone: score >= 70 ? 'ok' : 'mid', title: score >= 90 ? '¡Caso resuelto como experto!' : '¡Caso resuelto!', text: 'Atendiste el reporte con orden y sin prometer condiciones no confirmadas. Así se cuida la confianza en la posventa.', retryLabel: 'Repetir caso' }));
            res.style.marginTop = '18px';
            root.appendChild(res);
            res.querySelector('[data-retry]').addEventListener('click', start);
            finish(act, ctx, score);
          } else {
            card.disabled = true;
            card.classList.add('wrong');
            fb2.innerHTML = `<div class="fb bad" role="status">${I('x')}<div><p><strong>Esa respuesta no es la mejor.</strong> ${esc(r.feedback)}</p><p>Elige otra respuesta.</p></div></div>`;
          }
        });
      }
    }
    const banner = doneBanner(ctx, act, () => { banner.remove(); start(); });
    if (banner) root.appendChild(banner); else start();
    return root;
  };

  /* ======================= LA RUTA DEL CLIENTE ======================= */
  A.route = function (act, ctx) {
    const root = el('<div class="game"></div>');
    const PTS = { good: 100, mid: 40, bad: 0 };
    const SAT = { good: 8, mid: -5, bad: -15 };

    function start() {
      root.innerHTML = '';
      const n = act.stations.length;
      let cur = 0, points = 0, sat = act.start;
      const results = [];
      const hud = el(`<div class="game-hud">
        <div class="hud">${I('star')} Puntos <strong data-pts>0</strong></div>
        <div class="hud">${I('flag')} Etapas <strong data-st>0</strong>&nbsp;de ${n}</div>
        <div class="hud grow">${I('smile')} <span>Satisfacción</span><div class="meter" role="meter" aria-label="Satisfacción del cliente" aria-valuemin="0" aria-valuemax="100" data-meter><span data-sat></span></div><strong data-satv></strong></div>
      </div>`);
      const pos = (i) => 8 + (84 * (i + 0.5) / n);
      const track = el(`<div class="route card" style="padding:22px 10px 16px">
        <div class="route__line"></div><div class="route__fill"></div>
        <div class="truck" aria-hidden="true">${`<svg viewBox="0 0 160 80">${SCM.illo.truck(0, 0, 1)}</svg>`}</div>
        <div class="route__nodes" role="list">${act.stations.map((s, i) => `<button class="station" role="listitem" data-i="${i}" aria-label="Etapa ${i + 1}: ${esc(s.name)}"><span class="station__dot">${I(s.icon)}<span class="lockmini">${I('lock')}</span></span><span class="station__label">${esc(s.name)}</span></button>`).join('')}</div>
      </div>`);
      track.style.position = 'relative';
      const panel = el('<div style="margin-top:18px"></div>');
      root.append(hud, track, panel);

      function paint() {
        hud.querySelector('[data-pts]').textContent = points;
        hud.querySelector('[data-st]').textContent = results.length;
        const sb = hud.querySelector('[data-sat]');
        sb.style.width = sat + '%'; sb.style.background = SCM.ui.satColor(sat);
        hud.querySelector('[data-satv]').textContent = sat + '%';
        hud.querySelector('[data-meter]').setAttribute('aria-valuenow', sat);
        track.querySelectorAll('.station').forEach((b, i) => {
          const r = results[i];
          b.className = 'station' + (i === cur && !r ? ' cur' : '') + (r ? ' res-' + r : '');
          b.disabled = !r && i !== cur;
          b.querySelector('.lockmini').style.display = (!r && i > cur) ? '' : 'none';
        });
        const t = Math.min(cur, n - 1);
        track.querySelector('.truck').style.left = pos(t) + '%';
        track.querySelector('.route__fill').style.width = (84 * (results.length / n)) + '%';
      }

      function showStation(i) {
        const s = act.stations[i];
        const p = SCM.illo.cast[s.who];
        panel.innerHTML = '';
        const box = el(`<div class="card station-panel">
          <div class="station-panel__head"><span class="station-panel__ico">${I(s.icon)}</span><div><small>Etapa ${i + 1} de ${n}</small><h3 style="margin:0">${esc(s.name)}</h3></div>
            <div style="margin-left:auto;display:flex;align-items:center;gap:8px">${SCM.illo.avatar(s.who).replace('class="av"', 'class="av" style="width:40px;height:40px"')}<small class="muted" style="font-size:.8rem;line-height:1.2">${esc(p.name)}<br>${esc(p.role)}</small></div></div>
          <div class="incident">${I('alert')}<div><strong>Posible falla:</strong> ${esc(s.incident)}</div></div>
          <p class="sim__prompt" style="margin-top:16px">¿Qué decisión mejora la experiencia del cliente?</p>
          <div class="opts" role="group" aria-label="Decisiones"></div>
        </div>`);
        const opts = box.querySelector('.opts');
        s.options.forEach((o, k) => {
          const b = el(`<button class="opt"><span class="opt__key">${letter(k)}</span><span>${esc(o.text)}</span></button>`);
          b.addEventListener('click', () => decide(i, o, b, box));
          opts.appendChild(b);
        });
        panel.appendChild(box);
      }

      function decide(i, o, btn, box) {
        box.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (b !== btn) b.classList.add('dim'); });
        btn.classList.add(o.r === 'good' ? 'right' : o.r === 'bad' ? 'wrong' : 'selected');
        results[i] = o.r;
        points += PTS[o.r];
        sat = Math.max(0, Math.min(100, sat + SAT[o.r]));
        const tone = o.r === 'good' ? 'ok' : o.r === 'bad' ? 'bad' : 'mid';
        box.appendChild(el(`<div class="fb ${tone}" role="status">${I(tone === 'ok' ? 'check' : tone === 'bad' ? 'x' : 'info')}<div><p><strong>${tone === 'ok' ? `+${PTS.good} puntos · ¡Gran decisión!` : tone === 'bad' ? '0 puntos · Esto afecta al cliente' : `+${PTS.mid} puntos · Puede mejorar`}</strong></p><p>${esc(o.feedback)}</p></div></div>`));
        cur = i + 1;
        paint();
        const last = cur >= n;
        const cont = el(`<div class="btn-row" style="margin-top:14px;justify-content:flex-end"><button class="btn btn-primary">${last ? 'Ver resultados de la ruta' : 'Avanzar a ' + esc(act.stations[cur].name)} ${I('right')}</button></div>`);
        box.appendChild(cont);
        cont.querySelector('button').focus({ preventScroll: true });
        cont.querySelector('button').addEventListener('click', () => last ? end() : showStation(cur));
      }

      track.addEventListener('click', (e) => {
        const b = e.target.closest('.station');
        if (!b || b.disabled) return;
        const i = +b.dataset.i;
        if (i === cur && !results[i]) showStation(i);
      });

      function end() {
        const max = n * PTS.good;
        const score = Math.round(points / max * 100);
        const label = { good: 'Excelente', mid: 'Mejorable', bad: 'Falla' };
        panel.innerHTML = '';
        const r = el(resultHTML({
          score: points, suffix: ` / ${max}`, tone: score >= 75 ? 'ok' : score >= 50 ? 'mid' : 'bad',
          title: score >= 85 ? '¡Ruta extraordinaria!' : score >= 60 ? 'Ruta con áreas de oportunidad' : 'La clienta vivió una ruta difícil',
          text: `La satisfacción final de la clienta fue de ${sat}%. Cada área sumó o restó a la misma experiencia.`,
          extra: `<div class="route-sum">${act.stations.map((s, i) => `<div><strong style="color:${results[i] === 'good' ? 'var(--ok)' : results[i] === 'bad' ? 'var(--bad)' : 'var(--warn)'}">${esc(s.name)}</strong>${label[results[i]]}</div>`).join('')}</div>`,
          retryLabel: 'Recorrer la ruta de nuevo'
        }));
        panel.appendChild(r);
        r.querySelector('[data-retry]').addEventListener('click', start);
        r.focus({ preventScroll: true });
        finish(act, ctx, score, { sat });
      }

      paint();
      showStation(0);
    }
    const banner = doneBanner(ctx, act, () => { banner.remove(); start(); });
    if (banner) root.appendChild(banner); else start();
    return root;
  };

  /* ======================= MI COMPROMISO ======================= */
  A.commit = function (act, ctx) {
    const root = el('<div class="game"></div>');
    const st = SCM.store.get();
    const chosen = new Set(st.commitments ? st.commitments.items : []);
    const bar = el(`<div class="commit-count"><span>Elegidas: <strong data-c>0</strong> de ${act.pick}</span><span class="slots">${Array.from({ length: act.pick }, (_, i) => `<span>${i + 1}</span>`).join('')}</span><button class="btn btn-sm" style="background:#fff;color:var(--navy)" data-gen disabled>${I('sparkles')} Generar mi tarjeta</button></div>`);
    const grid = el(`<div class="commit-grid" role="group" aria-label="Acciones de compromiso">${act.options.map((o, i) => `
      <button class="commit-opt" data-i="${i}" aria-pressed="false"><span class="commit-opt__ico">${I(o.icon)}</span><span><small>${esc(o.cat)}</small><strong>${esc(o.title)}</strong>${esc(o.text)}</span></button>`).join('')}</div>`);
    const extras = el(`<div class="card" style="padding:20px;margin-top:16px;display:grid;gap:12px">
      <label style="display:grid;gap:6px;font-weight:600;font-size:.9rem">Tu nombre (aparecerá en la tarjeta)
        <input class="input" data-name maxlength="80" autocomplete="name" value="${esc(st.learner.name || '')}"></label>
      <label style="display:grid;gap:6px;font-weight:600;font-size:.9rem">Una frase personal (opcional)
        <input class="input" data-note maxlength="110" placeholder="Ej.: Quiero que cada cliente quiera volver a Mirage." value="${esc(st.commitments && st.commitments.note || '')}"></label>
    </div>`);
    const preview = el('<div class="commit-preview"></div>');
    root.append(bar, grid, extras, preview);

    function paint() {
      bar.querySelector('[data-c]').textContent = chosen.size;
      bar.querySelectorAll('.slots span').forEach((s, i) => s.classList.toggle('on', i < chosen.size));
      grid.querySelectorAll('.commit-opt').forEach(b => {
        const on = chosen.has(+b.dataset.i);
        b.setAttribute('aria-pressed', on);
        b.disabled = !on && chosen.size >= act.pick;
      });
      bar.querySelector('[data-gen]').disabled = chosen.size !== act.pick;
    }
    grid.addEventListener('click', (e) => {
      const b = e.target.closest('.commit-opt');
      if (!b || b.disabled) return;
      const i = +b.dataset.i;
      chosen.has(i) ? chosen.delete(i) : chosen.add(i);
      paint();
    });
    bar.querySelector('[data-gen]').addEventListener('click', generate);

    async function generate() {
      const name = extras.querySelector('[data-name]').value.trim();
      if (!name) {
        extras.querySelector('[data-name]').focus();
        SCM.ui.toast('Escribe tu nombre para tu tarjeta', 'user');
        return;
      }
      if (name !== st.learner.name) SCM.store.setLearner({ name });
      const note = extras.querySelector('[data-note]').value.trim();
      const items = Array.from(chosen).sort((a, b) => a - b);
      st.commitments = { items, note, date: new Date().toISOString() };
      SCM.store.save();
      const canvas = await drawCard(name, items.map(i => act.options[i]), note);
      preview.innerHTML = '';
      const wrap = el(`<div class="card" style="padding:20px">
        <div class="fb ok" style="margin:0 0 16px">${I('check')}<p><strong>¡Tu tarjeta de compromiso está lista!</strong> Descárgala o imprímela y tenla a la vista en tu lugar de trabajo.</p></div>
        <div class="cert-actions">
          <button class="btn btn-primary" data-png>${I('download')} Descargar imagen</button>
          <button class="btn btn-ghost" data-pdf>${I('file')} Descargar PDF</button>
          <button class="btn btn-ghost" data-print>${I('printer')} Imprimir</button>
        </div>
        <div style="max-width:440px;margin:0 auto" data-cv></div>
      </div>`);
      canvas.setAttribute('role', 'img');
      canvas.setAttribute('aria-label', `Tarjeta de compromiso de ${name}: ${items.map(i => act.options[i].title).join(', ')}`);
      wrap.querySelector('[data-cv]').appendChild(canvas);
      preview.appendChild(wrap);
      const file = 'compromiso-mirage-' + name.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      wrap.querySelector('[data-png]').addEventListener('click', () => canvas.toBlob(b => SCM.ui.download(b, file + '.png')));
      wrap.querySelector('[data-pdf]').addEventListener('click', () => SCM.ui.download(SCM.pdf.canvasToPdf(canvas, { title: 'Mi compromiso con el cliente', pageW: 595.28, pageH: 841.89 }), file + '.pdf'));
      wrap.querySelector('[data-print]').addEventListener('click', () => SCM.ui.printImage(canvas.toDataURL('image/png')));
      wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
      finish(act, ctx, 100);
    }

    paint();
    if (st.commitments && chosen.size === act.pick) setTimeout(generate, 0);
    return root;
  };

  /* ---------- Dibujo de la tarjeta de compromiso (canvas) ---------- */
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  }

  SCM.activities = A;
})();

  <script>
/* ==========================================================================
   Renderizadores de pantallas de módulo:
   intro · objectives · learn · infographic · activity · case · quiz · conclusion
   ========================================================================== */
(function () {
  const { el, esc, shuffle, letter } = SCM.ui;
  const I = SCM.icon;
  const R = {};

  R.typeLabel = {
    intro: ['play', 'Introducción'], objectives: ['target', 'Objetivos de aprendizaje'], learn: ['book', 'Aprende'],
    infographic: ['layers', 'Infografía interactiva'], activity: ['puzzle', 'Actividad práctica'], case: ['building', 'Caso Mirage'],

  /* ---------- Introducción ---------- */
  R.intro = (s, ctx) => {

  const B = {

    callout: (b) => `<div class="callout">${I(b.icon || 'bulb')}<p>${b.html}</p></div>`,
    notice: (b) => `<div class="notice warn">${I('info')}<div>${b.html}</div></div>`,
    cards: (b) => `<div class="cards-grid">${b.items.map((c, i) => `<div class="card icard" style="animation-delay:${i * 70}ms"><span class="icard__ico">${I(c.icon)}</span><h3>${esc(c.title)}</h3><p>${c.text}</p></div>`).join('')}</div>`,
    split: (b) => `<div class="split">${b.items.map(c => `<div class="card"><span class="pill ${c.tone === 'gold' ? 'gold' : ''} split__tag">${esc(c.tag)}</span><h3>${esc(c.title)}</h3><ul>${c.points.map(p => `<li>${I('check')}<span>${esc(p)}</span></li>`).join('')}</ul></div>`).join('')}</div>`,
    chips: (b) => `<div class="chips">${b.items.map(c => `<span>${esc(c)}</span>`).join('')}</div>`,
    steps: (b) => `<div class="cards-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">${b.items.map((c, i) => `<div class="card icard" style="animation-delay:${i * 70}ms;position:relative"><span class="pill" style="position:absolute;top:16px;right:16px">${i + 1}</span><span class="icard__ico">${I(c.icon)}</span><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p></div>`).join('')}</div>`,
    dialog: (b) => `<div class="chat"><div class="chat__title">${I('chat')} ${esc(b.title)}</div>${b.lines.map((l, i) => `<div class="bubble ${l.who}" style="animation-delay:${i * 250}ms"><small>${esc(l.name)}</small>${esc(l.text)}</div>`).join('')}</div>`
  };

  function compareBlock(b) {
    const t = b.titles || ['Evita', 'Mejor di'];
    const node = el(`<div class="compare">
      <div class="compare__col bad"><h3>${I('x')} ${esc(t[0])}</h3><ul>${b.bad.map(x => `<li>${I('x')}<span>${esc(x)}</span></li>`).join('')}</ul></div>
      <div class="compare__col good" ${b.reveal ? 'hidden' : ''}><h3>${I('check')} ${esc(t[1])}</h3><ul>${b.good.map(x => `<li>${I('check')}<span>${esc(x)}</span></li>`).join('')}</ul></div>
      ${b.reveal ? `<div class="compare__col good" data-placeholder style="display:grid;place-items:center;text-align:center;border-style:dashed"><div><p style="margin-bottom:12px;color:var(--ink-soft)">¿Cómo lo diría un colaborador Mirage?</p><button class="btn btn-ok">${I('sparkles')} Ver la versión Mirage</button></div></div>` : ''}
    </div>`);
    if (b.reveal) {
      node.querySelector('[data-placeholder] button').addEventListener('click', () => {
        node.querySelector('[data-placeholder]').remove();
        const g = node.querySelector('.compare__col.good[hidden]');
        g.hidden = false; g.style.animation = 'enter .5s var(--ease) both';
        g.setAttribute('tabindex', '-1'); g.focus();
      });
    }
    return node;
  }

  function tabsBlock(b) {
    const uid = 't' + Math.random().toString(36).slice(2, 7);
    const node = el(`<div class="tabs"><div class="tabs__list" role="tablist">${b.tabs.map((t, i) => `<button role="tab" id="${uid}-${i}" aria-selected="${i === 0}" aria-controls="${uid}-p" tabindex="${i === 0 ? 0 : -1}">${I(t.icon || 'info')} ${esc(t.label)}</button>`).join('')}</div><div class="tabs__panel" role="tabpanel" id="${uid}-p" aria-labelledby="${uid}-0" tabindex="0">${b.tabs[0].html}</div></div>`);
    const btns = Array.from(node.querySelectorAll('[role="tab"]'));
    const sel = (i) => {
      btns.forEach((x, k) => { x.setAttribute('aria-selected', k === i); x.tabIndex = k === i ? 0 : -1; });
      const p = node.querySelector('.tabs__panel');
      p.innerHTML = b.tabs[i].html; p.setAttribute('aria-labelledby', `${uid}-${i}`);
      p.style.animation = 'none'; void p.offsetWidth; p.style.animation = '';
    };
    btns.forEach((x, i) => {
      x.addEventListener('click', () => sel(i));
      x.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
          const n = (i + (e.key === 'ArrowRight' ? 1 : -1) + btns.length) % btns.length;
          sel(n); btns[n].focus();
        }
      });
    });
    return node;
  }

  function accordionBlock(b) {
    const node = el(`<div class="accordion">${b.items.map((it, i) => `
      <div class="acc-item"><button aria-expanded="false" aria-controls="acc-${i}-${b.items.length}"><span class="acc-ico">${I(it.icon || 'info')}</span>${esc(it.title)}<span class="chev">${I('down')}</span></button>
      <div class="acc-panel" id="acc-${i}-${b.items.length}" hidden>${it.html}</div></div>`).join('')}</div>`);
    node.querySelectorAll('.acc-item > button').forEach(btn => btn.addEventListener('click', () => {
      const open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', !open);
      btn.nextElementSibling.hidden = open;
    }));
    return node;
  }

  R.learn = (s, ctx) => {
    ctx.complete({ xp: 5, silent: true });
    const root = el(`<div><h2 class="screen-title">${esc(s.title)}</h2>${s.lead ? `<p class="lead">${s.lead}</p>` : ''}<div class="blocks"></div></div>`);
    const wrap = root.querySelector('.blocks');
    s.blocks.forEach(b => {
      if (b.kind === 'compare') wrap.appendChild(compareBlock(b));
      else if (b.kind === 'tabs') wrap.appendChild(tabsBlock(b));
      else if (b.kind === 'accordion') wrap.appendChild(accordionBlock(b));
      else if (B[b.kind]) wrap.appendChild(el(B[b.kind](b)));
    });
    return root;
  };

  /* ---------- Infografía ---------- */
  R.infographic = (s, ctx) => {
    const root = el(`<div><h2 class="screen-title">${esc(s.title)}</h2><p class="lead">${s.lead}</p></div>`);
    root.appendChild(SCM.infographics.render(s, ctx));
    return root;
  };

  /* ---------- Actividad ---------- */
  R.activity = (s, ctx) => {
    const root = el(`<div>
      <div class="activity-head"><span class="activity-head__ico">${I(s.activity.kind === 'branch' ? 'chat' : s.activity.kind === 'route' ? 'route' : s.activity.kind === 'commit' ? 'pen' : 'puzzle')}</span>
      <div><span class="pill gold">${I('star')} Hasta ${s.activity.xp} XP</span><h2 class="screen-title" style="margin-top:6px">${esc(s.title)}</h2></div></div>
      <p class="lead">${s.lead}</p></div>`);
    const fn = SCM.activities[s.activity.kind];
    root.appendChild(fn(s.activity, ctx));
    return root;
  };

  /* ---------- Caso ---------- */
  R.case = (s, ctx) => {
    const root = el(`<div><h2 class="screen-title">${esc(s.title)}</h2>
      <div class="case" style="margin-top:16px">
        <div class="card case__story">
          <div class="case__cast">${s.cast.map(c => { const p = SCM.illo.cast[c]; return `<div class="cast">${SCM.illo.avatar(c)}<div><strong>${esc(p.name)}</strong><small>${esc(p.role)}</small></div></div>`; }).join('')}</div>
          ${s.story.map(p => `<p>${p}</p>`).join('')}
        </div>
        <div class="card case__q"><span class="pill">${I('target')} Decide</span><h3 style="margin-top:12px">${esc(s.question)}</h3><div class="opts" role="group" aria-label="Opciones"></div><div data-fb aria-live="polite"></div></div>
      </div></div>`);
    const opts = root.querySelector('.opts'), fb = root.querySelector('[data-fb]');
    let tries = 0;
    const order = shuffle(s.options.map((o, i) => i));
    order.forEach((oi, k) => {
      const o = s.options[oi];
      const b = el(`<button class="opt"><span class="opt__key">${letter(k)}</span><span>${o.text}</span></button>`);
      b.addEventListener('click', () => {
        tries++;
        if (o.correct) {
          opts.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x !== b) x.classList.add('dim'); });
          b.classList.add('right');
          fb.innerHTML = `<div class="fb ok">${I('check')}<div><p><strong>¡Bien resuelto!</strong> ${o.feedback}</p></div></div>`;
          ctx.complete({ xp: tries === 1 ? 40 : 20, label: 'Caso resuelto' });
        } else {
          b.disabled = true; b.classList.add('wrong');
          fb.innerHTML = `<div class="fb bad">${I('x')}<div><p><strong>Analicémoslo.</strong> ${o.feedback}</p><p>Intenta con otra opción.</p></div></div>`;
        }
      });
      opts.appendChild(b);
      if (ctx.isDone && o.correct) { b.classList.add('right'); }
    });
    if (ctx.isDone) {
      opts.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (!x.classList.contains('right')) x.classList.add('dim'); });
      const c = s.options.find(o => o.correct);
      fb.innerHTML = `<div class="fb ok">${I('check')}<div><p><strong>Caso resuelto.</strong> ${c.feedback}</p></div></div>`;
    }
    return root;
  };

  /* ---------- Evaluación corta del módulo (3 preguntas) ---------- */
  R.quiz = (s, ctx) => {
    const root = el(`<div><h2 class="screen-title">Evaluación del módulo</h2><p class="lead">Tres preguntas para comprobar lo aprendido. Recibirás retroalimentación inmediata.</p><div data-q style="margin-top:16px"></div></div>`);
    const host = root.querySelector('[data-q]');
    const mid = ctx.module.id;

    function start() {
      let i = 0, correct = 0;
      const marks = [];
      function show() {
        const q = s.questions[i];
        const order = shuffle(q.options.map((_, k) => k));
        host.innerHTML = '';
        const card = el(`<div class="card quiz-card">
          <div class="quiz-top"><span class="pill">${I('clipboard')} Pregunta ${i + 1} de ${s.questions.length}</span>

          <p class="quiz-q" id="qq-${mid}-${i}">${esc(q.q)}</p>
          <div class="opts" role="group" aria-labelledby="qq-${mid}-${i}">${order.map((k, n) => `<button class="opt" data-k="${k}"><span class="opt__key">${letter(n)}</span><span>${esc(q.options[k])}</span></button>`).join('')}</div>
          <div data-fb aria-live="polite"></div>
        </div>`);
        host.appendChild(card);
        card.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
          const k = +b.dataset.k, ok = k === q.answer;
          if (ok) correct++;
          marks[i] = ok;
          card.querySelectorAll('.opt').forEach(x => {
            x.disabled = true;
            if (+x.dataset.k === q.answer) x.classList.add('right');
            else if (x === b) x.classList.add('wrong'); else x.classList.add('dim');
          });
          card.querySelectorAll('.qdots span')[i].className = ok ? 'ok' : 'bad';
          const fb = card.querySelector('[data-fb]');
          fb.innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}">${I(ok ? 'check' : 'x')}<div><p><strong>${ok ? '¡Correcto!' : 'Incorrecto.'}</strong> ${esc(q.explain)}</p></div></div>
            <div class="btn-row" style="margin-top:14px;justify-content:flex-end"><button class="btn btn-primary">${i < s.questions.length - 1 ? 'Siguiente pregunta' : 'Ver resultado'} ${I('right')}</button></div>`;
          const nb = fb.querySelector('button'); nb.focus({ preventScroll: true });
          nb.addEventListener('click', () => { i++; i < s.questions.length ? show() : end(); });
        }));
      }
      function end() {
        const st = SCM.store.get();
        const prev = st.quizzes[mid];
        st.quizzes[mid] = { correct, total: s.questions.length, best: Math.max(correct, prev ? prev.best || prev.correct : 0), at: new Date().toISOString() };
        SCM.store.save();
        SCM.lms.emit('quiz_completed', { module: mid, correct, total: s.questions.length });
        const pct = Math.round(correct / s.questions.length * 100);
        host.innerHTML = '';
        const r = el(`<div class="result" tabindex="-1">
          <span class="pill ${correct === s.questions.length ? 'ok' : 'warn'}">${I('clipboard')} Resultado</span>
          <div class="result__score">${correct}/${s.questions.length}</div>
          <h3>${correct === s.questions.length ? '¡Dominas este módulo!' : correct >= 2 ? '¡Bien hecho!' : 'Vale la pena repasar'}</h3>
          <p>${correct === s.questions.length ? 'Respondiste todo correctamente.' : 'Revisa las explicaciones; puedes repetir la evaluación para reforzar lo aprendido.'}</p>
          <div class="btn-row"><button class="btn btn-ghost" data-retry>${I('refresh')} Repetir evaluación</button></div></div>`);
        host.appendChild(r);
        r.querySelector('[data-retry]').addEventListener('click', start);
        r.focus({ preventScroll: true });
        ctx.complete({ xp: correct * 20, label: `Evaluación: ${correct}/${s.questions.length}`, score: pct });
      }
      show();
    }

    const prev = SCM.store.get().quizzes[mid];
    if (ctx.isDone && prev) {
      host.appendChild(el(`<div class="done-banner">${I('check')} <span>Ya respondiste esta evaluación: <strong>${prev.correct}/${prev.total}</strong> (mejor: ${prev.best != null ? prev.best : prev.correct}/${prev.total}).</span><button class="btn btn-sm btn-ghost">${I('refresh')} Repetir</button></div>`));
      host.querySelector('button').addEventListener('click', () => { host.innerHTML = ''; start(); });
    } else start();
    return root;
  };

  /* ---------- Conclusión ---------- */
  R.conclusion = (s, ctx) => {
    const m = ctx.module;
    const st = SCM.store.get();
    const q = st.quizzes[m.id];
    const next = SCM.modules[m.number]; // siguiente módulo (índice = number)
    const root = el(`<div class="card concl">
      <div class="badge-big">${SCM.illo.badge(m.badge.icon, m.badge.color, m.badge.name)}</div>
      <span class="pill gold">${I('award')} Insignia obtenida: ${esc(m.badge.name)}</span>
      <h2 style="margin-top:14px">${esc(s.title)}</h2>
      <div class="concl__stats">
        <span class="pill">${I('check')} Módulo ${m.number} completado</span>
        ${q ? `<span class="pill ok">${I('clipboard')} Evaluación: ${q.correct}/${q.total}</span>` : ''}
        <span class="pill gold">${I('star')} ${st.xp} XP acumulados</span>
      </div>
      <h3 style="text-align:left;margin-bottom:0">Lo que te llevas</h3>
      <div class="takeaways">${s.takeaways.map(t => `<div class="takeaway">${I('check')}<span>${esc(t)}</span></div>`).join('')}</div>
      <div class="btn-row" style="justify-content:center">
        ${next ? `<a class="btn btn-primary btn-lg" href="#/m/${next.number}/1">Continuar al módulo ${next.number} ${I('right')}</a>`
               : `<a class="btn btn-primary btn-lg" href="#/examen">${I('clipboard')} Ir a la evaluación final</a>`}
        <a class="btn btn-ghost" href="#/resultados">${I('trophy')} Ver mis logros</a>
      </div>
    </div>`);
    ctx.complete({ xp: 0, silent: true });
    ctx.completeModule();
    return root;
  };

  SCM.screens = R;
})();
