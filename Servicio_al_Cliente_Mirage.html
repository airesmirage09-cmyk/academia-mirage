  <style>
/* ==========================================================================
   SERVICIO AL CLIENTE MIRAGE — Academia Mirage
   Hoja de estilos única. Colores y medidas en :root.
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

:root {
  color-scheme: light;
  --navy: #222933;
  --navy-2: #2F3742;
  --blue: #EA0029;
  --blue-2: #EA0029;
  --blue-soft: #FDECEF;
  --white: #FFFFFF;
  --bg: #F4F5F7;
  --ink: #000000;
  --ink-soft: #4B4D52;
  --ink-faint: #76777A;
  --line: #E2E3E6;
  --line-strong: #C8C9CC;

  --ok: #1E8E5A;
  --ok-soft: #E3F5EC;
  --ok-line: #9ED7BA;
  --bad: #C2453D;
  --bad-soft: #FDECEA;
  --bad-line: #F2B8B3;
  --warn: #B7791F;
  --warn-soft: #FFF6E3;
  --gold: #EA0029;
  --gold-soft: #FDECEF;

  --radius-xl: 28px;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --shadow-1: 0 1px 2px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.06);
  --shadow-2: 0 10px 30px rgba(0,0,0,.12);
  --shadow-3: 0 24px 60px rgba(0,0,0,.22);
  --font-display: 'Montserrat', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-body: 'Inter', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  --topbar-h: 64px;
  --sidebar-w: 300px;
  --ease: cubic-bezier(.2,.8,.2,1);
}

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  color: var(--ink);
  background: var(--bg);
  min-height: 100vh;
  overflow-x: hidden;
}
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; margin: 0 0 .5em; letter-spacing: -.01em; color: var(--navy); }
h1 { font-size: clamp(1.9rem, 4vw, 2.9rem); font-weight: 800; }
h2 { font-size: clamp(1.45rem, 2.6vw, 2rem); font-weight: 800; }
h3 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0 0 1em; }
img, svg { max-width: 100%; }
button { font: inherit; color: inherit; }
a { color: var(--blue); }

:focus-visible { outline: 3px solid var(--blue-2); outline-offset: 3px; border-radius: 6px; }
.skip-link { position: absolute; left: 12px; top: -60px; background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 1000; text-decoration: none; }
.skip-link:focus { top: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.ico { width: 1.25em; height: 1.25em; flex: none; vertical-align: -0.22em; }

/* ---------- Topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  height: var(--topbar-h);
  display: flex; align-items: center; gap: 16px;
  padding: 0 20px;
  background: #000000;
  color: #fff;
  box-shadow: 0 2px 16px rgba(0,0,0,.25);
}
.brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; flex: none; }
.brand__logo { height: 58px; width: auto; display: block; margin: -6px -12px -6px -18px; }
.brand__text { padding-left: 10px; border-left: 1px solid rgba(255,255,255,.25); font-weight: 700; }
.brand__text { font-family: var(--font-display); font-size: 1.02rem; letter-spacing: .01em; white-space: nowrap; }
.brand__text strong { font-weight: 800; }
.topbar__course { flex: 1; min-width: 0; font-size: .9rem; color: #B9BABD; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 16px; border-left: 1px solid rgba(255,255,255,.18); }
.topbar__stats { display: flex; align-items: center; gap: 10px; }
.xp-chip { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16); border-radius: 999px; padding: 5px 12px 5px 6px; font-size: .85rem; white-space: nowrap; }
.xp-chip__star { width: 26px; height: 26px; border-radius: 50%; background: var(--gold); color: #fff; display: grid; place-items: center; }
.xp-chip__star .ico { width: 16px; height: 16px; }
.xp-chip strong { font-family: var(--font-display); font-size: .98rem; }
.xp-chip small { color: #B9BABD; font-size: .76rem; }
.xp-chip.bump { animation: bump .6s var(--ease); }
@keyframes bump { 0%{transform:scale(1)} 35%{transform:scale(1.14)} 100%{transform:scale(1)} }
.topbar__progress { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.1); }
.topbar__progress span { display: block; height: 100%; width: 0; background: #EA0029; transition: width .8s var(--ease); }
.icon-btn { width: 42px; height: 42px; border-radius: 12px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: inherit; }
.icon-btn:hover { background: rgba(255,255,255,.1); }
.topbar__menu { display: none; }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: var(--sidebar-w) minmax(0,1fr); min-height: calc(100vh - var(--topbar-h)); }
.shell.no-sidebar { grid-template-columns: minmax(0,1fr); }
.shell.no-sidebar .sidebar { display: none; }
.main { min-width: 0; outline: none; }

/* ---------- Sidebar ---------- */
.sidebar {
  position: sticky; top: var(--topbar-h);
  height: calc(100vh - var(--topbar-h));
  overflow-y: auto;
  background: var(--white);
  border-right: 1px solid var(--line);
  padding: 20px 14px 32px;
}
.side-head { padding: 4px 8px 16px; }
.side-head__label { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
.side-head__pct { display: flex; align-items: baseline; justify-content: space-between; margin-top: 6px; }
.side-head__pct strong { font-family: var(--font-display); font-size: 1.6rem; }
.side-head__pct span { font-size: .82rem; color: var(--ink-soft); }
.bar { height: 8px; background: var(--blue-soft); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; width: 0; background: var(--blue); border-radius: inherit; transition: width .7s var(--ease); }
.bar.ok > span { background: linear-gradient(90deg, var(--ok), #3CB57E); }

.side-mod { margin-bottom: 6px; border-radius: var(--radius-md); }
.side-mod__btn {
  width: 100%; display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px;
  text-align: left; padding: 10px; border: 0; background: transparent; border-radius: var(--radius-md); cursor: pointer;
}
.side-mod__btn:hover:not(:disabled) { background: var(--bg); }
.side-mod__btn:disabled { cursor: not-allowed; opacity: .55; }
.side-mod.is-current > .side-mod__btn { background: var(--blue-soft); }
.side-mod__num { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; background: var(--bg); color: var(--navy); border: 1px solid var(--line); }
.side-mod.is-current .side-mod__num { background: var(--blue); color: #fff; border-color: var(--blue); }
.side-mod.is-done .side-mod__num { background: var(--ok); color: #fff; border-color: var(--ok); }
.side-mod__title { font-size: .88rem; font-weight: 600; line-height: 1.3; }
.side-mod__meta { font-size: .74rem; color: var(--ink-faint); display: block; margin-top: 3px; }
.side-mod__bar { margin-top: 6px; height: 4px; }
.side-mod__state { color: var(--ink-faint); }
.side-steps { list-style: none; margin: 4px 0 10px 30px; padding: 0 0 0 18px; border-left: 2px solid var(--line); }
.side-steps li button {
  width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; border: 0; background: transparent;
  padding: 6px 8px; border-radius: 8px; font-size: .82rem; color: var(--ink-soft); cursor: pointer;
}
.side-steps li button:hover:not(:disabled) { background: var(--bg); color: var(--ink); }
.side-steps li button:disabled { cursor: not-allowed; opacity: .5; }
.side-steps li button[aria-current="step"] { color: var(--blue); font-weight: 700; background: var(--blue-soft); }
.side-steps .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; flex: none; background: #fff; }
.side-steps .dot.done { background: var(--ok); border-color: var(--ok); color: #fff; }
.side-steps .dot .ico { width: 12px; height: 12px; }
.side-sep { height: 1px; background: var(--line); margin: 14px 8px; }
.side-link { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--radius-md); border: 0; background: transparent; width: 100%; text-align: left; cursor: pointer; font-size: .9rem; font-weight: 600; }
.side-link:hover:not(:disabled) { background: var(--bg); }
.side-link:disabled { opacity: .5; cursor: not-allowed; }
.side-link.is-current { background: var(--blue-soft); color: var(--blue); }
.side-link__ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--bg); border: 1px solid var(--line); }
.side-link small { display: block; font-weight: 500; color: var(--ink-faint); font-size: .74rem; }
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 60; }

/* ---------- Generic UI ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 10px 20px; border-radius: 12px; border: 1.5px solid transparent;
  font-family: var(--font-display); font-weight: 700; font-size: .95rem; cursor: pointer; text-decoration: none;
  transition: transform .15s var(--ease), box-shadow .2s, background .2s, color .2s, border-color .2s;
}
.btn:active:not(:disabled) { transform: translateY(1px) scale(.99); }
.btn:disabled { cursor: not-allowed; opacity: .5; }
.btn-primary { background: var(--blue); color: #fff; box-shadow: 0 6px 16px rgba(234,0,41,.28); }
.btn-primary:hover:not(:disabled) { background: #C40022; box-shadow: 0 10px 22px rgba(234,0,41,.32); }
.btn-dark { background: var(--navy); color: #fff; }
.btn-dark:hover:not(:disabled) { background: var(--navy-2); }
.btn-ghost { background: #fff; color: var(--navy); border-color: var(--line-strong); }
.btn-ghost:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
.btn-ok { background: var(--ok); color: #fff; }
.btn-lg { min-height: 56px; padding: 14px 28px; font-size: 1.05rem; border-radius: 14px; }
.btn-sm { min-height: 38px; padding: 6px 14px; font-size: .85rem; border-radius: 10px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

.card { background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); border: 1px solid var(--line); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: .78rem; font-weight: 700; letter-spacing: .02em; background: var(--blue-soft); color: var(--blue); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.gold { background: var(--gold-soft); color: #EA0029; }
.kicker { font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin-bottom: 8px; display: block; }
.lead { font-size: 1.08rem; color: var(--ink-soft); max-width: 68ch; }
.muted { color: var(--ink-faint); }

/* ---------- Home ---------- */
.home { padding: 0 0 64px; }
.hero {
  position: relative; overflow: hidden;
  background: #000000;
  color: #fff;
  padding: clamp(40px, 6vw, 80px) clamp(16px, 5vw, 64px) clamp(56px, 7vw, 96px);
}
.hero::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 60px; background: var(--bg); clip-path: ellipse(70% 100% at 50% 100%); }
.hero__inner { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 1.05fr .95fr; gap: 40px; align-items: center; }
.hero h1 { color: #fff; margin-bottom: 16px; }
.hero h1 span { display: block; font-size: .5em; letter-spacing: .14em; text-transform: uppercase; color: var(--blue); margin-bottom: 12px; font-weight: 800; }
.hero p.lead { color: #E2E3E6; }
.hero .pill { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.2); }
.hero__facts { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 28px; }
.hero__fact { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); border-radius: 14px; padding: 10px 14px; }
.hero__fact .ico { color: #C8C9CC; }
.hero__fact strong { display: block; font-family: var(--font-display); font-size: 1.05rem; line-height: 1.1; }
.hero__fact small { color: #B9BABD; font-size: .78rem; }
.hero__art { position: relative; }
.hero__art svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 30px 50px rgba(0,0,0,.25)); }
.hero__cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.hero .btn-ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.4); }
.hero .btn-ghost:hover { border-color: #fff; color: #fff; background: rgba(255,255,255,.08); }
.name-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; max-width: 420px; }
.name-field label { font-size: .85rem; color: #B9BABD; font-weight: 600; }
.name-field input, .input {
  min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line-strong); padding: 10px 14px; font: inherit; color: var(--ink); background: #fff; width: 100%;
}
.name-field input { border-color: rgba(255,255,255,.3); background: rgba(255,255,255,.95); }
.input:focus, .name-field input:focus { outline: none; border-color: var(--blue-2); box-shadow: 0 0 0 4px rgba(234,0,41,.25); }

.home-section { max-width: 1180px; margin: 0 auto; padding: 40px clamp(16px, 5vw, 64px) 0; }
.home-section > h2 { margin-bottom: 6px; }
.comp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 22px; }
.comp { padding: 22px; }
.comp__ico { width: 48px; height: 48px; border-radius: 14px; background: var(--bg); color: var(--navy); display: grid; place-items: center; margin-bottom: 14px; }
.comp h3 { margin-bottom: 6px; font-size: 1.02rem; }
.comp p { margin: 0; color: var(--ink-soft); font-size: .92rem; }
.mod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; margin-top: 22px; }
.mod-card { overflow: hidden; display: flex; flex-direction: column; transition: transform .25s var(--ease), box-shadow .25s; }
.mod-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); }
.mod-card__art { background: #EDEEF0; height: 150px; display: grid; place-items: center; position: relative; }
.mod-card__art svg { height: 140px; width: auto; }
.mod-card__num { position: absolute; top: 14px; left: 14px; }
.mod-card__lock { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; background: #fff; display: grid; place-items: center; color: var(--ink-faint); box-shadow: var(--shadow-1); }
.mod-card__lock.done { background: var(--ok); color: #fff; }
.mod-card__body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.mod-card__body h3 { margin: 0; }
.mod-card__body p { margin: 0; font-size: .9rem; color: var(--ink-soft); }
.mod-card__foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 8px; }
.mod-card__foot .bar { flex: 1; }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radius-md); background: var(--blue-soft); color: var(--navy); font-size: .88rem; }
.notice .ico { color: var(--blue); margin-top: 2px; }
.notice.warn { background: var(--warn-soft); }
.notice.warn .ico { color: var(--warn); }

/* ---------- Screen frame ---------- */
.screen { max-width: 1040px; margin: 0 auto; padding: 28px clamp(16px, 4vw, 44px) 120px; }
.screen-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
.screen-head__mod { display: flex; align-items: center; gap: 12px; }
.screen-head__mod .num { width: 38px; height: 38px; border-radius: 11px; background: var(--navy); color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; }
.screen-head__mod small { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
.screen-head__mod strong { font-size: .95rem; }
.steps-dots { display: flex; gap: 6px; align-items: center; }
.steps-dots span { width: 26px; height: 6px; border-radius: 99px; background: var(--line); transition: background .3s; }
.steps-dots span.done { background: var(--ok); }
.steps-dots span.current { background: var(--blue); }
.screen-body { animation: enter .5s var(--ease) both; }
@keyframes enter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.screen-title { margin-bottom: 8px; }
.screen-type { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 10px; }

.navbar {
  position: fixed; bottom: 0; right: 0; left: var(--sidebar-w); z-index: 40;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px clamp(16px, 4vw, 44px);
  background: rgba(255,255,255,.94); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
}
.navbar__info { flex: 1; text-align: center; font-size: .85rem; color: var(--ink-soft); min-width: 0; }
.navbar__info strong { color: var(--ink); }
.navbar__hint { display: block; font-size: .78rem; color: var(--warn); }
.navbar__hint.ok { color: var(--ok); }

/* ---------- Intro ---------- */
.intro {
  display: grid; grid-template-columns: 1.1fr .9fr; gap: 32px; align-items: center;
  background: #222933;
  color: #fff; border-radius: var(--radius-xl); padding: clamp(28px, 4vw, 52px); overflow: hidden; position: relative;
}
.intro::before { content: ''; position: absolute; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.05), transparent 70%); right: -120px; top: -160px; }
.intro h2 { color: #fff; font-size: clamp(1.8rem, 3.4vw, 2.6rem); }
.intro .kicker { color: var(--blue); }
.intro p { color: #E2E3E6; font-size: 1.05rem; }
.intro__meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.intro__meta .pill { background: rgba(255,255,255,.12); color: #fff; }
.intro__art { position: relative; z-index: 1; }
.intro__art svg { width: 100%; height: auto; }
.intro__topics { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.intro__topics span { font-size: .8rem; padding: 5px 10px; border-radius: 8px; background: rgba(255,255,255,.1); color: #EDEEF0; }

/* ---------- Objectives ---------- */
.obj-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 18px; }
.obj { padding: 22px; position: relative; animation: enter .5s var(--ease) both; }
.obj__n { font-family: var(--font-display); font-size: 2.4rem; font-weight: 800; color: var(--blue-soft); line-height: 1; position: absolute; right: 18px; top: 14px; -webkit-text-stroke: 1px #E2E3E6; }
.obj__ico { width: 46px; height: 46px; border-radius: 14px; background: var(--navy); color: #fff; display: grid; place-items: center; margin-bottom: 14px; }
.obj p { margin: 0; font-weight: 600; font-size: .98rem; }

/* ---------- Learn blocks ---------- */
.blocks { display: flex; flex-direction: column; gap: 22px; margin-top: 18px; }
.cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
.icard { padding: 20px; animation: enter .5s var(--ease) both; }
.icard__ico { width: 44px; height: 44px; border-radius: 13px; background: var(--bg); color: var(--navy); display: grid; place-items: center; margin-bottom: 12px; }
.icard h3 { font-size: 1rem; margin-bottom: 6px; }
.icard p { margin: 0; font-size: .92rem; color: var(--ink-soft); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.split .card { padding: 24px; }
.split__tag { display: inline-flex; margin-bottom: 10px; }
.split h3 { margin-bottom: 8px; }
.split ul, .compare ul { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.split li, .compare li { display: flex; gap: 10px; font-size: .93rem; }
.split li .ico, .compare li .ico { margin-top: 3px; color: var(--blue); }
.callout { display: flex; gap: 16px; align-items: flex-start; padding: 20px 22px; border-radius: var(--radius-lg); background: #000000; color: #fff; }
.callout .ico { width: 28px; height: 28px; color: var(--gold); flex: none; }
.callout p { margin: 0; font-size: 1.02rem; font-weight: 500; }
.callout strong { color: #C8C9CC; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.compare__col { padding: 22px; border-radius: var(--radius-lg); border: 1.5px solid; }
.compare__col.bad { background: var(--bad-soft); border-color: var(--bad-line); }
.compare__col.good { background: var(--ok-soft); border-color: var(--ok-line); }
.compare__col h3 { display: flex; align-items: center; gap: 8px; font-size: 1rem; }
.compare__col.bad h3, .compare__col.bad li .ico { color: var(--bad); }
.compare__col.good h3, .compare__col.good li .ico { color: var(--ok); }
.compare__toggle { grid-column: 1 / -1; }
.chat { display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: var(--radius-lg); background: var(--white); border: 1px solid var(--line); }
.chat__title { font-size: .8rem; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .08em; }
.bubble { max-width: 82%; padding: 11px 15px; border-radius: 18px; font-size: .94rem; animation: pop .35s var(--ease) both; position: relative; }
.bubble small { display: block; font-size: .72rem; font-weight: 700; opacity: .75; margin-bottom: 2px; }
.bubble.them { background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 6px; align-self: flex-start; }
.bubble.me { background: var(--blue); color: #fff; border-bottom-right-radius: 6px; align-self: flex-end; }
.bubble.me.bad { background: #FBE3E0; color: #7E241E; border: 1px solid var(--bad-line); }
.bubble.me.ok { background: #DDF2E7; color: #0F5132; border: 1px solid var(--ok-line); }
.bubble.typing { display: inline-flex; gap: 4px; padding: 14px 16px; }
.bubble.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); animation: blink 1s infinite; }
.bubble.typing i:nth-child(2) { animation-delay: .15s; }
.bubble.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%,80%,100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
.accordion { display: flex; flex-direction: column; gap: 10px; }
.acc-item { border-radius: var(--radius-md); background: #fff; border: 1px solid var(--line); overflow: hidden; }
.acc-item button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 16px 18px; border: 0; background: transparent; cursor: pointer; text-align: left; font-weight: 700; font-family: var(--font-display); }
.acc-item button .chev { margin-left: auto; transition: transform .25s; color: var(--ink-faint); }
.acc-item button[aria-expanded="true"] .chev { transform: rotate(180deg); }
.acc-item .acc-ico { width: 36px; height: 36px; border-radius: 10px; background: var(--bg); color: var(--navy); display: grid; place-items: center; flex: none; }
.acc-panel { padding: 0 18px 18px 66px; color: var(--ink-soft); font-size: .94rem; }
.acc-panel p:last-child { margin-bottom: 0; }
.tabs { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
.tabs__list { display: flex; gap: 4px; padding: 8px; background: var(--bg); border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs__list button { border: 0; background: transparent; padding: 10px 16px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: .9rem; color: var(--ink-soft); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.tabs__list button[aria-selected="true"] { background: #fff; color: var(--blue); box-shadow: var(--shadow-1); }
.tabs__panel { padding: 22px; animation: enter .35s var(--ease) both; }
.tabs__panel p:last-child { margin-bottom: 0; }
.tabs__panel ul { margin: 0; padding-left: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips span { padding: 8px 14px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font-size: .88rem; font-weight: 600; }
.figure { border-radius: var(--radius-lg); overflow: hidden; background: #EDEEF0; display: grid; place-items: center; padding: 16px; }
.figure svg { max-height: 260px; width: auto; }
.text-block p { color: var(--ink-soft); font-size: 1rem; max-width: 72ch; }

/* ---------- Explore (infographics) ---------- */
.explore-status { display: flex; align-items: center; gap: 10px; font-size: .86rem; color: var(--ink-soft); margin: 4px 0 16px; }
.explore-status .bar { width: 160px; }
.detail { padding: 22px; border-radius: var(--radius-lg); background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow-1); animation: enter .35s var(--ease) both; }
.detail__head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.detail__ico { width: 48px; height: 48px; border-radius: 14px; background: var(--navy); color: #fff; display: grid; place-items: center; flex: none; }
.detail h3 { margin: 0; }
.detail__cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
.detail__box { padding: 14px 16px; border-radius: var(--radius-md); background: var(--bg); font-size: .92rem; }
.detail__box strong { display: flex; align-items: center; gap: 6px; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); margin-bottom: 4px; }
.detail__box.good { background: var(--ok-soft); }
.detail__box.good strong { color: var(--ok); }
.detail__empty { display: flex; align-items: center; gap: 12px; color: var(--ink-faint); font-size: .95rem; padding: 26px; border: 2px dashed var(--line-strong); border-radius: var(--radius-lg); justify-content: center; text-align: center; }

/* journey */
.journey { position: relative; padding: 26px 8px 8px; }
.journey__track { position: absolute; left: 6%; right: 6%; top: 58px; height: 6px; border-radius: 99px; background: repeating-linear-gradient(90deg, var(--line-strong) 0 12px, transparent 12px 20px); }
.journey__fill { position: absolute; left: 6%; top: 58px; height: 6px; border-radius: 99px; background: var(--blue); transition: width .6s var(--ease); }
.journey__nodes { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.jnode { display: flex; flex-direction: column; align-items: center; gap: 10px; border: 0; background: transparent; cursor: pointer; padding: 4px; border-radius: 14px; }
.jnode__dot { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 3px solid var(--line-strong); color: var(--ink-soft); box-shadow: var(--shadow-1); transition: all .3s var(--ease); position: relative; }
.jnode__dot .ico { width: 26px; height: 26px; }
.jnode__n { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%; background: var(--navy); color: #fff; font-size: .72rem; font-weight: 800; display: grid; place-items: center; }
.jnode__label { font-size: .8rem; font-weight: 700; text-align: center; line-height: 1.25; color: var(--ink-soft); }
.jnode:hover .jnode__dot { transform: translateY(-3px); border-color: var(--blue-2); }
.jnode.seen .jnode__dot { border-color: var(--ok); color: var(--ok); }
.jnode.active .jnode__dot { background: var(--blue); border-color: var(--blue); color: #fff; transform: scale(1.08); box-shadow: 0 0 0 8px rgba(234,0,41,.15); }
.jnode.active .jnode__label { color: var(--blue); }
.journey + .detail, .journey ~ .detail-wrap { margin-top: 18px; }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(234,0,41,.35);} 70% { box-shadow: 0 0 0 14px rgba(234,0,41,0);} 100% { box-shadow: 0 0 0 0 rgba(234,0,41,0);} }

/* flip */
.flip-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.flip { perspective: 1200px; border: 0; background: transparent; padding: 0; cursor: pointer; min-height: 230px; text-align: left; }
.flip__inner { position: relative; width: 100%; height: 100%; min-height: 230px; transition: transform .6s var(--ease); transform-style: preserve-3d; }
.flip.flipped .flip__inner { transform: rotateY(180deg); }
.flip__face { position: absolute; inset: 0; border-radius: var(--radius-lg); padding: 20px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; gap: 10px; }
.flip__front { background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow-1); }
.flip__front .big-ico { width: 56px; height: 56px; border-radius: 16px; background: var(--navy); color: #fff; display: grid; place-items: center; }
.flip__front h3 { margin: 0; font-size: 1.05rem; }
.flip__front .hint { margin-top: auto; font-size: .78rem; color: var(--blue); font-weight: 700; display: flex; align-items: center; gap: 6px; }
.flip__back { background: var(--navy); color: #EDEEF0; transform: rotateY(180deg); font-size: .9rem; }
.flip__back strong { color: #fff; font-family: var(--font-display); }
.flip__back .ex { margin-top: auto; padding: 10px 12px; background: rgba(255,255,255,.08); border-radius: 10px; font-style: italic; font-size: .85rem; }
.flip.seen .flip__front { border-color: var(--ok-line); }
.flip.seen .flip__front::after { content: '✓'; position: absolute; top: 14px; right: 16px; width: 26px; height: 26px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: .8rem; font-weight: 800; }

/* method (acronym) */
.method { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.mletter { border: 0; cursor: pointer; border-radius: var(--radius-lg); padding: 18px 10px; background: #fff; border: 1.5px solid var(--line); box-shadow: var(--shadow-1); display: flex; flex-direction: column; align-items: center; gap: 6px; transition: all .3s var(--ease); }
.mletter b { font-family: var(--font-display); font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1; color: var(--blue); }
.mletter span { font-size: .82rem; font-weight: 700; color: var(--ink-soft); text-align: center; }
.mletter:hover { transform: translateY(-3px); }
.mletter.seen { border-color: var(--ok-line); }
.mletter.active { background: var(--navy); border-color: var(--navy); }
.mletter.active b { color: #C8C9CC; }
.mletter.active span { color: #fff; }

/* cycle */
.cycle { position: relative; width: min(520px, 100%); aspect-ratio: 1; margin: 0 auto; }
.cycle__ring { position: absolute; inset: 14%; border-radius: 50%; border: 3px dashed var(--line-strong); animation: spin 60s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.cycle__center { position: absolute; inset: 31%; border-radius: 50%; background: #000000; border: 4px solid var(--blue); color: #fff; display: grid; place-items: center; text-align: center; padding: 12px; font-family: var(--font-display); font-weight: 800; font-size: clamp(.8rem, 2.2vw, 1.05rem); line-height: 1.25; box-shadow: var(--shadow-2); }
.cycle__center small { display: block; font-weight: 600; font-size: .75em; color: #B9BABD; margin-top: 4px; font-family: var(--font-body); }
.cnode { position: absolute; width: 26%; transform: translate(-50%, -50%); border: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; }
.cnode .jnode__dot { width: clamp(50px, 11vw, 66px); height: clamp(50px, 11vw, 66px); }
.cnode.seen .jnode__dot { border-color: var(--ok); color: var(--ok); }
.cnode.active .jnode__dot { background: var(--blue); border-color: var(--blue); color: #fff; transform: scale(1.08); }
.cnode .jnode__label { font-size: clamp(.68rem, 1.6vw, .8rem); }

/* pyramid */
.pyramid { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.plevel { border: 0; cursor: pointer; color: #fff; font-family: var(--font-display); font-weight: 800; padding: 16px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform .25s var(--ease), filter .25s; clip-path: polygon(6% 0, 94% 0, 100% 100%, 0 100%); font-size: clamp(.85rem, 2vw, 1rem); }
.plevel:hover { transform: scale(1.02); filter: brightness(1.08); }
.plevel.active { filter: brightness(1.15); outline: 3px solid var(--gold); outline-offset: 2px; }
.plevel.seen::after { content: '✓'; width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.25); display: inline-grid; place-items: center; font-size: .75rem; }
.plevel small { display: block; font-weight: 600; font-size: .72em; opacity: .85; font-family: var(--font-body); }

/* ---------- Activities ---------- */
.activity-head { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
.activity-head__ico { width: 52px; height: 52px; border-radius: 16px; background: var(--blue); color: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 8px 18px rgba(234,0,41,.35); }
.activity-head__ico .ico { width: 28px; height: 28px; }
.game { margin-top: 18px; }
.game-hud { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.hud { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow-1); font-size: .85rem; }
.hud strong { font-family: var(--font-display); font-size: 1.1rem; }
.hud .ico { color: var(--blue); }
.hud.grow { flex: 1; min-width: 220px; }
.meter { position: relative; height: 12px; border-radius: 99px; background: var(--line); overflow: hidden; flex: 1; min-width: 100px; }
.meter > span { position: absolute; inset: 0 auto 0 0; border-radius: inherit; transition: width .8s var(--ease), background .8s; }
.fb { margin-top: 14px; padding: 16px 18px; border-radius: var(--radius-md); border: 1.5px solid; display: flex; gap: 12px; animation: pop .35s var(--ease) both; font-size: .94rem; }
.fb .ico { width: 24px; height: 24px; flex: none; margin-top: 1px; }
.fb.ok { background: var(--ok-soft); border-color: var(--ok-line); }
.fb.ok .ico, .fb.ok strong { color: var(--ok); }
.fb.bad { background: var(--bad-soft); border-color: var(--bad-line); }
.fb.bad .ico, .fb.bad strong { color: var(--bad); }
.fb.mid { background: var(--warn-soft); border-color: #F0D49B; }
.fb.mid .ico, .fb.mid strong { color: var(--warn); }
.fb p { margin: 0; }
.fb p + p { margin-top: 6px; }
.result { text-align: center; padding: 32px 24px; border-radius: var(--radius-xl); background: #fff; border: 1px solid var(--line); animation: pop .45s var(--ease) both; }
.result__score { font-family: var(--font-display); font-weight: 800; font-size: 3rem; line-height: 1; color: var(--blue); margin: 10px 0; }
.result h3 { font-size: 1.4rem; }
.result p { color: var(--ink-soft); max-width: 60ch; margin-left: auto; margin-right: auto; }
.result .btn-row { justify-content: center; margin-top: 10px; }
.result__emoji { width: 80px; height: 80px; margin: 0 auto; }
.done-banner { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); background: var(--ok-soft); border: 1px solid var(--ok-line); color: #0F5132; font-size: .9rem; margin-bottom: 16px; flex-wrap: wrap; }
.done-banner .ico { color: var(--ok); }
.done-banner .btn { margin-left: auto; }

/* classify */
.deck { position: relative; }
.scard { padding: 26px; border-radius: var(--radius-xl); background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow-2); animation: deal .45s var(--ease) both; }
@keyframes deal { from { opacity: 0; transform: translateX(40px) rotate(2deg); } to { opacity: 1; transform: none; } }
.scard.out-left { animation: outL .35s var(--ease) forwards; }
.scard__who { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.scard__who .av { width: 48px; height: 48px; flex: none; }
.scard__who strong { display: block; font-size: .95rem; }
.scard__who small { color: var(--ink-faint); font-size: .8rem; }
.scard__text { font-size: 1.08rem; font-weight: 500; }
.choice-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
.choice-big { min-height: 64px; border-radius: 16px; border: 2px solid var(--line-strong); background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 1rem; transition: all .2s var(--ease); padding: 10px; }
.choice-big.excel { color: var(--ok); }
.choice-big.excel:hover:not(:disabled) { background: var(--ok-soft); border-color: var(--ok); }
.choice-big.mejora { color: var(--bad); }
.choice-big.mejora:hover:not(:disabled) { background: var(--bad-soft); border-color: var(--bad); }
.choice-big:disabled { cursor: default; }
.choice-big.picked.right { background: var(--ok); border-color: var(--ok); color: #fff; }
.choice-big.picked.wrong { background: var(--bad); border-color: var(--bad); color: #fff; }
.choice-big .ico { width: 24px; height: 24px; }

/* options (quiz, case, branch) */
.opts { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.opt {
  display: flex; align-items: flex-start; gap: 12px; text-align: left; width: 100%;
  padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line-strong); background: #fff; cursor: pointer;
  font-size: .96rem; transition: border-color .2s, background .2s, transform .15s; line-height: 1.45;
}
.opt:hover:not(:disabled) { border-color: var(--blue); background: var(--blue-soft); }
.opt:disabled { cursor: default; }
.opt__key { width: 28px; height: 28px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 800; font-size: .8rem; flex: none; color: var(--ink-soft); }
.opt.selected { border-color: var(--blue); background: var(--blue-soft); }
.opt.selected .opt__key { background: var(--blue); color: #fff; border-color: var(--blue); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .opt__key { background: var(--ok); color: #fff; border-color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .opt__key { background: var(--bad); color: #fff; border-color: var(--bad); }
.opt.dim { opacity: .55; }
.opt .check { margin-left: auto; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line-strong); flex: none; display: grid; place-items: center; }
.opt.selected .check { background: var(--blue); border-color: var(--blue); color: #fff; }

/* quiz */
.quiz-card { padding: 26px; }
.quiz-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.quiz-q { font-size: 1.12rem; font-weight: 700; font-family: var(--font-display); margin: 0; }
.qdots { display: flex; gap: 6px; }
.qdots span { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.qdots span.cur { background: var(--blue); }
.qdots span.ok { background: var(--ok); }
.qdots span.bad { background: var(--bad); }

/* branching sim */
.sim { display: grid; grid-template-columns: 280px minmax(0,1fr); gap: 18px; align-items: start; }
.sim__side { padding: 20px; position: sticky; top: calc(var(--topbar-h) + 16px); }
.sim__face { width: 120px; height: 120px; margin: 0 auto 10px; display: block; }
.sim__face svg { width: 100%; height: 100%; }
.sim__name { text-align: center; }
.sim__name strong { display: block; font-family: var(--font-display); }
.sim__name small { color: var(--ink-faint); font-size: .8rem; }
.sim__mood { text-align: center; font-weight: 800; font-size: .85rem; margin: 10px 0 4px; }
.sat { margin-top: 14px; }
.sat__row { display: flex; justify-content: space-between; font-size: .8rem; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
.sat__row strong { font-family: var(--font-display); font-size: 1rem; color: var(--ink); }
.sat .meter { height: 14px; }
.sat__delta { display: inline-block; font-weight: 800; font-size: .85rem; margin-left: 6px; animation: floatUp 1.4s var(--ease) both; }
.sat__delta.up { color: var(--ok); }
.sat__delta.down { color: var(--bad); }
@keyframes floatUp { 0% { opacity: 0; transform: translateY(6px);} 20% { opacity: 1; transform: none;} 80% {opacity: 1;} 100% { opacity: 0; transform: translateY(-8px);} }
.sim__steps { list-style: none; padding: 0; margin: 16px 0 0; display: flex; flex-direction: column; gap: 6px; }
.sim__steps li { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--ink-faint); }
.sim__steps li .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; font-size: .65rem; font-weight: 800; flex: none; }
.sim__steps li.cur { color: var(--blue); font-weight: 700; }
.sim__steps li.cur .dot { border-color: var(--blue); background: var(--blue); color: #fff; }
.sim__steps li.done { color: var(--ink-soft); }
.sim__steps li.done .dot { border-color: var(--ok); background: var(--ok); color: #fff; }
.sim__main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.sim__log { min-height: 160px; }
.sim__stage { font-size: .78rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); }
.sim__prompt { font-weight: 700; margin: 4px 0 0; font-family: var(--font-display); }
.coach { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--radius-md); font-size: .92rem; animation: pop .35s var(--ease) both; border: 1.5px solid; }
.coach__av { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; color: #fff; }
.coach.ok { background: var(--ok-soft); border-color: var(--ok-line); }
.coach.ok .coach__av { background: var(--ok); }
.coach.mid { background: var(--warn-soft); border-color: #F0D49B; }
.coach.mid .coach__av { background: var(--warn); }
.coach.bad { background: var(--bad-soft); border-color: var(--bad-line); }
.coach.bad .coach__av { background: var(--bad); }
.coach strong { display: block; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; }
.coach p { margin: 0; }

/* match */
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.match__col { display: flex; flex-direction: column; gap: 10px; }
.match__col h4 { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 4px; }
.mitem { padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line-strong); background: #fff; cursor: pointer; text-align: left; font-size: .92rem; transition: all .2s var(--ease); display: flex; align-items: center; gap: 10px; min-height: 56px; }
.mitem.term { font-weight: 700; font-family: var(--font-display); }
.mitem:hover:not(:disabled) { border-color: var(--blue); }
.mitem.sel { border-color: var(--blue); background: var(--blue-soft); box-shadow: 0 0 0 4px rgba(234,0,41,.12); }
.mitem.matched { cursor: default; }
.mitem.err { animation: shake .4s; border-color: var(--bad); background: var(--bad-soft); }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.mitem .tag { width: 26px; height: 26px; border-radius: 8px; flex: none; display: grid; place-items: center; font-size: .75rem; font-weight: 800; color: #fff; background: var(--line-strong); }

/* sortable */
.sortable { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.sort-item { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 8px; border-radius: 14px; background: #fff; border: 1.5px solid var(--line-strong); box-shadow: var(--shadow-1); user-select: none; -webkit-user-select: none; position: relative; transition: border-color .2s, background .2s, box-shadow .2s; }
.sort-item.dragging { z-index: 5; box-shadow: var(--shadow-3); border-color: var(--blue); transition: none; cursor: grabbing; }
.sort-item:not(.locked) { cursor: grab; }
.sort-item__grip { width: 36px; height: 44px; display: grid; place-items: center; color: var(--ink-faint); touch-action: none; flex: none; border-radius: 10px; }
.sort-item__n { width: 30px; height: 30px; border-radius: 9px; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: .85rem; flex: none; }
.sort-item__text { flex: 1; font-size: .94rem; font-weight: 500; }
.sort-item__btns { display: flex; flex-direction: column; gap: 2px; }
.sort-item__btns button { width: 34px; height: 24px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; cursor: pointer; color: var(--ink-soft); padding: 0; }
.sort-item__btns button:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
.sort-item__btns button:disabled { opacity: .35; cursor: default; }
.sort-item__btns .ico { width: 16px; height: 16px; }
.sort-item.right { border-color: var(--ok); background: var(--ok-soft); }
.sort-item.right .sort-item__n { background: var(--ok); }
.sort-item.wrong { border-color: var(--bad); background: var(--bad-soft); }
.sort-item.wrong .sort-item__n { background: var(--bad); }
.sort-item .fixhint { font-size: .78rem; color: var(--bad); font-weight: 700; white-space: nowrap; }

/* drop zone */
.dz-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
.dz { min-height: 170px; border-radius: var(--radius-lg); border: 2.5px dashed var(--line-strong); background: #fff; padding: 18px; display: flex; flex-direction: column; gap: 10px; transition: all .2s; }
.dz.over { border-color: var(--blue); background: var(--blue-soft); }
.dz__label { font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); display: flex; align-items: center; gap: 8px; }
.dz__placeholder { margin: auto; color: var(--ink-faint); font-size: .9rem; text-align: center; }
.dcard { padding: 14px 16px; border-radius: 14px; background: #fff; border: 1.5px solid var(--line-strong); box-shadow: var(--shadow-1); cursor: grab; font-size: .92rem; touch-action: none; user-select: none; -webkit-user-select: none; text-align: left; width: 100%; display: flex; gap: 10px; align-items: flex-start; }
.dcard:hover:not(:disabled) { border-color: var(--blue); }
.dcard .ico { color: var(--ink-faint); margin-top: 2px; }
.dcard.ghost { position: fixed; pointer-events: none; z-index: 300; box-shadow: var(--shadow-3); transform: rotate(-2deg); border-color: var(--blue); }
.dcard.placed { cursor: default; }
.dcard.right { border-color: var(--ok); background: var(--ok-soft); }
.dcard.wrong { border-color: var(--bad); background: var(--bad-soft); }
.dcard.lifted { opacity: .35; }
.dz-pool { display: flex; flex-direction: column; gap: 10px; }

/* route game */
.route { position: relative; padding: 18px 6px 6px; margin-bottom: 18px; }
.route__line { position: absolute; left: 8%; right: 8%; top: 52px; height: 8px; border-radius: 99px; background: repeating-linear-gradient(90deg, #C8C9CC 0 16px, #E2E3E6 16px 26px); }
.route__fill { position: absolute; left: 8%; top: 52px; height: 8px; border-radius: 99px; background: linear-gradient(90deg, var(--blue), #3CB57E); transition: width .8s var(--ease); }
.route__nodes { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.station { display: flex; flex-direction: column; align-items: center; gap: 8px; border: 0; background: transparent; cursor: pointer; padding: 0; }
.station:disabled { cursor: not-allowed; }
.station__dot { width: 72px; height: 72px; border-radius: 22px; display: grid; place-items: center; background: #fff; border: 3px solid var(--line-strong); color: var(--ink-faint); box-shadow: var(--shadow-1); transition: all .3s var(--ease); position: relative; }
.station__dot .ico { width: 30px; height: 30px; }
.station__label { font-size: .8rem; font-weight: 800; color: var(--ink-soft); text-align: center; }
.station.cur .station__dot { border-color: var(--blue); color: #fff; background: var(--blue); transform: translateY(-4px); }
.station.res-good .station__dot { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.station.res-mid .station__dot { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }
.station.res-bad .station__dot { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.station .lockmini { position: absolute; bottom: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink-faint); }
.station .lockmini .ico { width: 13px; height: 13px; }
.truck { position: absolute; top: 0; width: 56px; transition: left .9s var(--ease); transform: translateX(-50%); z-index: 2; pointer-events: none; }
.station-panel { padding: 24px; }
.station-panel__head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.station-panel__ico { width: 52px; height: 52px; border-radius: 16px; background: var(--navy); color: #fff; display: grid; place-items: center; flex: none; }
.station-panel__head small { display: block; color: var(--ink-faint); font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.incident { padding: 14px 16px; border-radius: var(--radius-md); background: var(--warn-soft); border: 1px solid #F0D49B; display: flex; gap: 10px; font-size: .95rem; }
.incident .ico { color: var(--warn); margin-top: 2px; }
.route-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; text-align: left; }
.route-sum div { padding: 12px; border-radius: 12px; background: #fff; border: 1px solid var(--line); font-size: .82rem; }
.route-sum strong { display: block; font-family: var(--font-display); font-size: .95rem; }

/* commitment */
.commit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.commit-opt { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 16px; background: #fff; border: 1.5px solid var(--line-strong); cursor: pointer; text-align: left; font-size: .92rem; transition: all .2s var(--ease); }
.commit-opt:hover:not(:disabled) { border-color: var(--blue); }
.commit-opt:disabled { opacity: .5; cursor: not-allowed; }
.commit-opt__ico { width: 40px; height: 40px; border-radius: 12px; background: var(--bg); color: var(--navy); display: grid; place-items: center; flex: none; }
.commit-opt strong { display: block; font-family: var(--font-display); font-size: .95rem; margin-bottom: 2px; }
.commit-opt small { color: var(--ink-faint); font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.commit-opt[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); box-shadow: 0 0 0 4px rgba(234,0,41,.12); }
.commit-opt[aria-pressed="true"] .commit-opt__ico { background: var(--blue); color: #fff; }
.commit-count { position: sticky; top: calc(var(--topbar-h) + 8px); z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius: 14px; background: var(--navy); color: #fff; margin-bottom: 14px; flex-wrap: wrap; }
.commit-count .slots { display: flex; gap: 6px; }
.commit-count .slots span { width: 30px; height: 30px; border-radius: 50%; border: 2px dashed rgba(255,255,255,.4); display: grid; place-items: center; font-weight: 800; font-size: .8rem; }
.commit-count .slots span.on { background: var(--gold); border: 0; color: #fff; }
.commit-preview { margin-top: 20px; }
.commit-preview canvas, .cert-preview canvas, .cert-preview img { width: 100%; height: auto; border-radius: 16px; box-shadow: var(--shadow-2); display: block; background: #fff; }

/* case */
.case { display: grid; grid-template-columns: .9fr 1.1fr; gap: 20px; align-items: start; }
.case__story { padding: 24px; background: #fff; }
.case__cast { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 16px; }
.cast { display: flex; align-items: center; gap: 10px; }
.cast .av { width: 46px; height: 46px; }
.cast strong { display: block; font-size: .88rem; line-height: 1.2; }
.cast small { font-size: .75rem; color: var(--ink-faint); }
.case__story p { font-size: .96rem; }
.case__story p:last-child { margin-bottom: 0; }
.case__q { padding: 24px; }
.case__q h3 { font-size: 1.05rem; }

/* conclusion */
.concl { text-align: center; padding: clamp(28px, 5vw, 48px) clamp(18px, 4vw, 40px); background: #fff; }
.concl .badge-big { width: 150px; height: 150px; margin: 0 auto 10px; display: block; animation: badgeIn .9s var(--ease) both; }
@keyframes badgeIn { 0% { transform: scale(.3) rotate(-25deg); opacity: 0; } 60% { transform: scale(1.1) rotate(6deg); opacity: 1; } 100% { transform: none; } }
.takeaways { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 24px 0; text-align: left; }
.takeaway { display: flex; gap: 10px; padding: 14px 16px; border-radius: 14px; background: var(--bg); font-size: .92rem; }
.takeaway .ico { color: var(--ok); margin-top: 2px; }
.concl__stats { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin: 10px 0 22px; }

/* ---------- Exam ---------- */
.exam-intro { display: grid; grid-template-columns: 1.2fr .8fr; gap: 20px; align-items: start; }
.exam-intro > *, .case > *, .sim > *, .dz-wrap > *, .match > * { min-width: 0; }
.rules { list-style: none; padding: 0; margin: 14px 0; display: flex; flex-direction: column; gap: 10px; }
.rules li { display: flex; gap: 10px; align-items: flex-start; font-size: .95rem; }
.rules li .ico { color: var(--blue); margin-top: 3px; }
.exam-nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
.exam-nav button { width: 36px; height: 36px; border-radius: 10px; border: 1.5px solid var(--line-strong); background: #fff; font-weight: 800; font-size: .82rem; cursor: pointer; }
.exam-nav button.answered { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); }
.exam-nav button.cur { background: var(--navy); border-color: var(--navy); color: #fff; }
.qtype { font-size: .72rem; }
.attempts { width: 100%; border-collapse: collapse; font-size: .88rem; }
.attempts th, .attempts td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); }
.attempts th { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
.review { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
.review__item { padding: 18px; border-radius: var(--radius-md); background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--bad); }
.review__item.ok { border-left-color: var(--ok); }
.review__item h4 { font-size: .98rem; margin-bottom: 8px; font-family: var(--font-body); font-weight: 700; }
.review__item p { margin: 4px 0; font-size: .9rem; }
.ring { width: 170px; height: 170px; margin: 0 auto; display: block; }

/* ---------- Results ---------- */
.res-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin: 18px 0; }
.stat { padding: 20px; }
.stat small { display: block; font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
.stat strong { display: block; font-family: var(--font-display); font-size: 2rem; line-height: 1.15; margin-top: 4px; }
.stat span { font-size: .85rem; color: var(--ink-soft); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
.badge-tile { text-align: center; padding: 16px 10px; }
.badge-tile svg { width: 86px; height: 86px; display: block; margin: 0 auto 8px; }
.badge-tile strong { display: block; font-size: .85rem; line-height: 1.25; }
.badge-tile small { color: var(--ink-faint); font-size: .74rem; }
.badge-tile.locked svg { filter: grayscale(1); opacity: .35; }
.section-title { display: flex; align-items: center; gap: 10px; margin: 32px 0 12px; }
.section-title h2 { margin: 0; font-size: 1.35rem; }

/* ---------- Toast / modal / confetti ---------- */
.toast-host { position: fixed; top: calc(var(--topbar-h) + 14px); right: 18px; z-index: 400; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; background: var(--navy); color: #fff; padding: 10px 16px 10px 10px; border-radius: 14px; box-shadow: var(--shadow-3); font-size: .9rem; font-weight: 600; animation: toastIn .4s var(--ease) both; }
.toast__ico { width: 32px; height: 32px; border-radius: 10px; background: var(--gold); color: #fff; display: grid; place-items: center; flex: none; }
.toast.out { animation: toastOut .35s var(--ease) forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateX(30px); } }
.modal { position: fixed; inset: 0; z-index: 500; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); animation: fade .3s both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal__box { width: min(480px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: #fff; border-radius: var(--radius-xl); padding: 32px 26px 26px; text-align: center; box-shadow: var(--shadow-3); animation: pop .45s var(--ease) both; position: relative; }
.modal__box h2 { font-size: 1.5rem; }
.modal__box p { color: var(--ink-soft); }
.modal__xp { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; background: var(--gold-soft); color: #EA0029; font-weight: 800; font-family: var(--font-display); margin-bottom: 14px; }
.modal__box .badge-big { width: 150px; height: 150px; margin: 0 auto 6px; display: block; animation: badgeIn .9s var(--ease) both; }
.modal__box .btn-row { justify-content: center; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 600; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

/* ---------- Certificate ---------- */
.cert-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
.cert-preview { max-width: 900px; }
.print-area { display: none; }

/* ---------- Responsive ---------- */
@media (max-width: 1080px) {
  .sim { grid-template-columns: 1fr; }
  .sim__side { position: static; display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
  .sim__face { width: 84px; height: 84px; margin: 0; }
  .sim__name { text-align: left; }
  .sim__mood { text-align: left; }
  .sim__steps { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; gap: 10px; }
}
@media (max-width: 960px) {
  :root { --sidebar-w: 0px; }
  .shell { grid-template-columns: minmax(0,1fr); }
  .topbar__menu { display: grid; }
  .sidebar { position: fixed; top: var(--topbar-h); left: 0; bottom: 0; width: min(320px, 86vw); height: auto; z-index: 70; transform: translateX(-105%); transition: transform .3s var(--ease); box-shadow: var(--shadow-3); }
  .sidebar.open { transform: none; }
  .navbar { left: 0; }
  .hero__inner { grid-template-columns: 1fr; }
  .hero__art { max-width: 520px; }
  .intro { grid-template-columns: 1fr; }
  .intro__art { max-width: 420px; }
  .case { grid-template-columns: 1fr; }
  .exam-intro { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  body { font-size: 15px; }
  .topbar { padding: 0 10px; gap: 8px; }
  .topbar__course { display: none; }
  .brand__text { font-size: .92rem; }
  .brand__logo { height: 44px; margin: 0 -8px 0 -10px; }
  .brand__text { display: none; }
  .topbar__stats { margin-left: auto; }
  .xp-chip small { display: none; }
  .split, .compare, .detail__cols, .match, .dz-wrap, .obj-grid { grid-template-columns: 1fr; }
  .journey__track, .journey__fill { display: none; }
  .journey__nodes { grid-auto-flow: row; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
  .method { grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .mletter { padding: 12px 4px; }
  .mletter span { font-size: .68rem; }
  .route__line, .route__fill { display: none; }
  .route__nodes { grid-template-columns: repeat(3, 1fr); row-gap: 16px; }
  .station__dot { width: 60px; height: 60px; border-radius: 18px; }
  .truck { display: none; }
  .choice-row { grid-template-columns: 1fr; }
  .navbar { padding: 10px 12px; }
  .navbar .btn { padding: 8px 12px; min-height: 44px; }
  .navbar .btn .lbl { display: none; }
  .steps-dots span { width: 14px; }
  .screen { padding-top: 18px; }
  .acc-panel { padding-left: 18px; }
  .toast-host { left: 12px; right: 12px; }
  .scard, .quiz-card, .station-panel, .case__q, .case__story { padding: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* ---------- Print (certificado / tarjeta) ---------- */
@media print {
  @page { size: landscape; margin: 0; }
  body.printing > *:not(.print-area) { display: none !important; }
  body.printing .print-area { display: flex !important; align-items: center; justify-content: center; width: 100%; height: 100vh; }
  body.printing .print-area img { max-width: 100%; max-height: 100vh; }
  body { background: #fff; }
}

</style>

  <script>
/* ==========================================================================
   Adaptador de integración con Academia Mirage (LMS).

   Estado actual: NO existe backend. Todo se guarda en localStorage del
   navegador del colaborador. Este módulo deja lista la "costura" para que,
   cuando Academia Mirage tenga registro de usuarios y seguimiento, solo se
   implemente aquí la comunicación sin tocar el resto del curso.

   Eventos emitidos (payload común: courseId, courseVersion, learner, ts):
     course_started · module_completed · activity_completed · quiz_completed
     exam_submitted · course_completed · certificate_issued · progress_reset

   Canales disponibles hoy:
     1) window CustomEvent 'academia:event'  (misma página / contenedor)
     2) window.parent.postMessage            (solo si config.integration.parentOrigin)
     3) fetch(eventsEndpoint)                (solo si config.integration.eventsEndpoint)

   Entrada desde la plataforma (opcional, vía postMessage desde parentOrigin):
     { type: 'academia:learner', learner: { id: '123', name: 'Nombre Apellido' } }
   ========================================================================== */
(function () {
  const cfg = SCM.config;
  const listeners = [];

  function basePayload() {
    const st = SCM.store ? SCM.store.get() : {};
    return {
      courseId: cfg.courseId,
      courseVersion: cfg.courseVersion,
      learner: st.learner ? { id: st.learner.id || null, name: st.learner.name || '' } : null,
      ts: new Date().toISOString()
    };
  }

  function emit(type, data) {
    const evt = Object.assign(basePayload(), { type, data: data || {} });

    // Registro local acotado (útil para depurar e integrar)
    try { SCM.store && SCM.store.logEvent(evt); } catch (e) { /* noop */ }

    // 1) Evento en la página
    try { window.dispatchEvent(new CustomEvent('academia:event', { detail: evt })); } catch (e) { /* noop */ }

    // 2) Ventana contenedora (Academia Mirage), solo con origen configurado
    if (cfg.integration.parentOrigin && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ source: 'scm-course', event: evt }, cfg.integration.parentOrigin); } catch (e) { /* noop */ }
    }

    // 3) Endpoint futuro
    if (cfg.integration.eventsEndpoint) {
      try {
        fetch(cfg.integration.eventsEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(evt),
          keepalive: true
        }).catch(() => {});
      } catch (e) { /* noop */ }
    }

    listeners.forEach(fn => { try { fn(evt); } catch (e) { /* noop */ } });
  }

  // Recepción de datos del participante desde la plataforma contenedora
  window.addEventListener('message', (e) => {
    if (!cfg.integration.parentOrigin || e.origin !== cfg.integration.parentOrigin) return;
    const msg = e.data || {};
    if (msg.type === 'academia:learner' && msg.learner && typeof msg.learner.name === 'string') {
      SCM.store.setLearner({ id: String(msg.learner.id || ''), name: msg.learner.name.slice(0, 80), source: 'academia' });
      if (SCM.app) SCM.app.refresh();
    }
  });

  SCM.lms = {
    emit,
    on(fn) { listeners.push(fn); },
    /** ¿Los datos se sincronizan con un servidor? Hoy: no. */
    isConnected() { return Boolean(cfg.integration.eventsEndpoint); },
    /** Resumen listo para enviarse a un futuro servicio de historial. */
    buildRecord() {
      const st = SCM.store.get();
      return {
        courseId: cfg.courseId,
        courseVersion: cfg.courseVersion,
        learner: st.learner,
        startedAt: st.startedAt,
        modulesCompleted: Object.keys(st.modulesDone),
        xp: st.xp,
        quizzes: st.quizzes,
        exam: { attempts: st.exam.attempts, passed: st.exam.passed, bestPct: st.exam.bestPct },
        certificate: st.certificate,
        exportedAt: new Date().toISOString(),
        storage: 'localStorage (solo este navegador; no verificable por un administrador)'
      };
    }
  };
})();

</script>

/* ==========================================================================
   Estado y persistencia local (localStorage).
   El avance se guarda solamente en este navegador y dispositivo.
   ========================================================================== */
(function () {
  const KEY = SCM.config.storageKey;

  function fresh() {
    return {
      v: 1,
      learner: { id: '', name: '', source: 'local' },
      startedAt: null,
      lastRoute: null,
      screens: {},        // 'm1:3' -> true
      modulesDone: {},    // 'm1' -> fecha ISO
      badges: {},         // 'm1' -> fecha ISO
      xp: 0,
      xpLog: {},          // id -> puntos otorgados (evita duplicar)
      activities: {},     // id -> { score, max, done, data }
      quizzes: {},        // 'm1' -> { correct, total }
      exam: { attempts: [], passed: false, bestPct: 0, current: null },
      certificate: null,  // { folio, date, pct, name }
      commitments: null,  // { items: [...], note, date }
      events: []
    };
  }

  let state = load();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return fresh();
      const parsed = JSON.parse(raw);
      const base = fresh();
      // Fusión superficial para tolerar versiones previas del estado
      const merged = Object.assign(base, parsed);
      merged.exam = Object.assign(fresh().exam, parsed.exam || {});
      merged.learner = Object.assign(fresh().learner, parsed.learner || {});
      return merged;
    } catch (e) {
      return fresh();
    }
  }

  let saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 120);
  }
  function flush() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* almacenamiento no disponible */ }
  }
  window.addEventListener('pagehide', flush);
  window.addEventListener('beforeunload', flush);

  SCM.store = {
    get() { return state; },
    save, flush,
    storageAvailable() {
      try { localStorage.setItem(KEY + ':t', '1'); localStorage.removeItem(KEY + ':t'); return true; } catch (e) { return false; }
    },
    setLearner(l) { state.learner = Object.assign(state.learner || {}, l); save(); },
    markScreen(key) { if (!state.screens[key]) { state.screens[key] = true; save(); return true; } return false; },
    isScreenDone(key) { return Boolean(state.screens[key]); },
    addXP(id, amount) {
      if (state.xpLog[id] != null || !amount) return 0;
      state.xpLog[id] = amount;
      state.xp += amount;
      save();
      return amount;
    },
    setActivity(id, data) { state.activities[id] = Object.assign(state.activities[id] || {}, data); save(); },
    getActivity(id) { return state.activities[id] || null; },
    logEvent(evt) {
      state.events.push({ type: evt.type, ts: evt.ts, data: evt.data });
      if (state.events.length > 60) state.events = state.events.slice(-60);
      save();
    },
    reset() {
      const learner = state.learner;
      state = fresh();
      state.learner = learner;
      flush();
    }
  };
})();

      `<path d="M-8 -78 Q0 -82 8 -78" stroke="${C.navy}" stroke-width="3" fill="none" stroke-linecap="round"/>`,

      `<path d="M-9 -80 Q0 -72 9 -80" stroke="${C.navy}" stroke-width="3" fill="none" stroke-linecap="round"/>`,
      `<path d="M-11 -82 Q0 -68 11 -82 Z" fill="${C.navy}"/><path d="M-7 -79 Q0 -74 7 -79" fill="#fff"/>`
    ];
    const m = Math.max(0, Math.min(4, Math.round(mood)));
    g += `<circle cx="-10" cy="-92" r="3" fill="${C.navy}"/><circle cx="10" cy="-92" r="3" fill="${C.navy}"/>`;
    g += brows[m] + mouths[m];
    if (m >= 3) g += `<circle cx="-17" cy="-83" r="4" fill="#F09A8A" opacity=".45"/><circle cx="17" cy="-83" r="4" fill="#F09A8A" opacity=".45"/>`;
    if (m === 0) g += `<path d="M30 -116 l6 -6 M34 -108 l8 -2 M26 -122 l2 -8" stroke="${C.bad}" stroke-width="3" stroke-linecap="round"/>`;

  }

  function minisplit(x, y, w, opts) {
    opts = opts || {};
    const h = w * 0.28;
    let g = `<g transform="translate(${x} ${y})">`;
    g += `<rect x="0" y="0" width="${w}" height="${h}" rx="${h * 0.3}" fill="#fff" stroke="${C.line}" stroke-width="2"/>`;
    g += `<rect x="${w * 0.06}" y="${h * 0.66}" width="${w * 0.88}" height="${h * 0.12}" rx="2" fill="${C.gray}" stroke="${C.line}"/>`;
    g += `<circle cx="${w * 0.88}" cy="${h * 0.3}" r="${h * 0.07}" fill="${opts.led || C.blue2}"/>`;
    g += `<rect x="${w * 0.08}" y="${h * 0.22}" width="${w * 0.22}" height="${h * 0.12}" rx="2" fill="${C.soft}"/>`;
    if (opts.air !== false) {
      for (let i = 0; i < 3; i++) {
        const ax = w * (0.25 + i * 0.25);
        g += `<path d="M${ax} ${h + 10} q-8 14 0 28 q8 14 0 28" fill="none" stroke="${C.sky}" stroke-width="3" stroke-linecap="round" opacity=".9"><animate attributeName="opacity" values=".2;1;.2" dur="${2 + i * 0.4}s" repeatCount="indefinite"/></path>`;
      }
    }
    return g + '</g>';
  }

    return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(16, h / 2)}" fill="${fill}"/><path d="${t}" fill="${fill}"/>${content || ''}</g>`;
  }

    return g;
  }
