  <script>
/* ==========================================================================
   Evaluación final: 15 reactivos aleatorios desde un banco de 36,
   mínimo aprobatorio 80 %, intentos ilimitados, revisión de errores.
   ========================================================================== */
(function () {
  const { el, esc, shuffle, letter } = SCM.ui;
  const I = SCM.icon;
  const cfg = SCM.config;
  const bankById = () => Object.fromEntries(SCM.examBank.map(q => [q.id, q]));
  const typeLabel = { tf: 'Verdadero o falso', mc: 'Opción múltiple', case: 'Análisis de caso', multi: 'Selecciona las mejores respuestas', order: 'Ordena el proceso' };

  /* ---------- Construcción y calificación ---------- */
  function buildAttempt() {
    const byType = {};
    SCM.examBank.forEach(q => { (byType[q.type] = byType[q.type] || []).push(q); });
    let picked = [];
    Object.entries(cfg.examMix).forEach(([t, n]) => { picked = picked.concat(shuffle(byType[t] || []).slice(0, n)); });
    // Completa si la mezcla no alcanza el total configurado
    if (picked.length < cfg.examQuestions) {
      const rest = shuffle(SCM.examBank.filter(q => !picked.includes(q)));
      picked = picked.concat(rest.slice(0, cfg.examQuestions - picked.length));
    }
    picked = shuffle(picked).slice(0, cfg.examQuestions);
    return {
      startedAt: new Date().toISOString(),
      qs: picked.map(q => ({
        id: q.id,
        order: q.type === 'tf' ? [0, 1] : q.type === 'order' ? SCM.ui.shuffleNot(q.items.map((_, i) => i)) : shuffle(q.options.map((_, i) => i))
      })),
      answers: {},
      cur: 0
    };
  }

  function isCorrect(q, a) {
    if (a == null) return false;
    if (q.type === 'multi') return Array.isArray(a) && a.length === q.answer.length && q.answer.every(x => a.includes(x));
    if (q.type === 'order') return Array.isArray(a) && a.every((v, i) => v === i);
    return a === q.answer;
  }

  function answerText(q, a) {
    if (a == null) return '<em>Sin respuesta</em>';
    if (q.type === 'tf') return ['Verdadero', 'Falso'][a];
    if (q.type === 'multi') return a.map(i => esc(q.options[i])).join(' · ');
    if (q.type === 'order') return a.map((i, n) => `${n + 1}. ${esc(q.items[i])}`).join('<br>');
    return esc(q.options[a]);
  }
  function correctText(q) {
    if (q.type === 'tf') return ['Verdadero', 'Falso'][q.answer];
    if (q.type === 'multi') return q.answer.map(i => esc(q.options[i])).join(' · ');
    if (q.type === 'order') return q.items.map((t, n) => `${n + 1}. ${esc(t)}`).join('<br>');
    return esc(q.options[q.answer]);
  }

  function ring(pct, passed) {
    const r = 70, c = 2 * Math.PI * r, off = c * (1 - pct / 100);
    const col = passed ? '#1E8E5A' : '#C2453D';
    return `<svg class="ring" viewBox="0 0 170 170" role="img" aria-label="Calificación ${pct}%">
      <circle cx="85" cy="85" r="${r}" fill="none" stroke="#E2E3E6" stroke-width="14"/>
      <circle cx="85" cy="85" r="${r}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" transform="rotate(-90 85 85)">
        <animate attributeName="stroke-dashoffset" from="${c}" to="${off}" dur="1.2s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/></circle>
      <text x="85" y="92" text-anchor="middle" font-family="Montserrat, Segoe UI, sans-serif" font-size="34" font-weight="800" fill="#222933">${pct}%</text>
      <text x="85" y="116" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#76777A">mínimo ${cfg.passingScore}%</text></svg>`;
  }

  /* ---------- Vistas ---------- */
  function render(main) {
    const st = SCM.store.get();
    const allDone = SCM.modules.every(m => st.modulesDone[m.id]);
    const wrap = el('<section class="screen"><div class="screen-body"></div></section>');
    const body = wrap.querySelector('.screen-body');
    main.appendChild(wrap);

    if (!allDone) {
      body.appendChild(el(`<div class="card" style="padding:32px;text-align:center">
        <div style="width:72px;height:72px;border-radius:22px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;margin:0 auto 14px">${I('lock')}</div>
        <h2>Evaluación final bloqueada</h2>
        <p class="lead" style="margin:0 auto 18px">Completa los seis módulos para desbloquearla.</p>
        <div style="display:grid;gap:8px;max-width:460px;margin:0 auto 20px;text-align:left">${SCM.modules.map(m => `<div class="takeaway">${st.modulesDone[m.id] ? I('check') : `<span style="color:var(--ink-faint)">${I('lock')}</span>`}<span>Módulo ${m.number}. ${esc(m.title)}</span></div>`).join('')}</div>
        <a class="btn btn-primary" href="${SCM.app.resumeHref()}">${I('play')} Continuar capacitación</a></div>`));
      return;
    }
    if (st.exam.current) return question(body);
    intro(body);
  }

  function intro(body) {
    const st = SCM.store.get();
    const at = st.exam.attempts;
    body.innerHTML = '';
    body.appendChild(el(`<div>
      <span class="kicker">Evaluación final</span>
      <h2 class="screen-title">Demuestra lo que aprendiste</h2>
      <div class="exam-intro" style="margin-top:16px">
        <div class="card" style="padding:24px">
          <h3>Instrucciones</h3>
          <ul class="rules">
            <li>${I('clipboard')} <span><strong>${cfg.examQuestions} preguntas</strong> elegidas al azar de un banco de ${SCM.examBank.length} reactivos.</span></li>
            <li>${I('layers')} <span>Opción múltiple, verdadero o falso, análisis de casos, selección de mejores respuestas y ordenamiento de procesos.</span></li>
            <li>${I('target')} <span>Calificación mínima aprobatoria: <strong>${cfg.passingScore}%</strong>.</span></li>
            <li>${I('refresh')} <span>Puedes hacer nuevos intentos; cada uno genera preguntas distintas.</span></li>
            <li>${I('eye')} <span>Al terminar verás tu calificación y la explicación de cada respuesta incorrecta.</span></li>
          </ul>
          <button class="btn btn-primary btn-lg" data-start>${I('play')} ${at.length ? 'Comenzar nuevo intento' : 'Comenzar evaluación'}</button>
        </div>
        <div class="card" style="padding:24px">
          <h3>Tu historial</h3>
          ${at.length ? `<p style="margin:0 0 10px">Mejor calificación: <strong>${st.exam.bestPct}%</strong> ${st.exam.passed ? `<span class="pill ok">${I('check')} Aprobada</span>` : `<span class="pill bad">No aprobada aún</span>`}</p>
          <div style="overflow-x:auto"><table class="attempts"><thead><tr><th>Intento</th><th>Fecha</th><th>Aciertos</th><th>%</th></tr></thead><tbody>
            ${at.slice().reverse().map(a => `<tr><td>${a.n}</td><td>${SCM.ui.fmtDate(a.date)}</td><td>${a.correct}/${a.total}</td><td><strong style="color:${a.passed ? 'var(--ok)' : 'var(--bad)'}">${a.pct}%</strong></td></tr>`).join('')}
          </tbody></table></div>
          ${st.exam.passed ? `<a class="btn btn-ok" style="margin-top:14px" href="#/certificado">${I('award')} Ver mi certificado</a>` : ''}`
          : `<p class="muted">Aún no tienes intentos registrados.</p>`}
          <div class="notice" style="margin-top:14px">${I('info')}<span>Tus intentos se guardan en este navegador.</span></div>
        </div>
      </div></div>`));
    body.querySelector('[data-start]').addEventListener('click', () => {
      st.exam.current = buildAttempt();
      SCM.store.save();
      question(body);
    });
  }

  function question(body) {
    const st = SCM.store.get();
    const cur = st.exam.current;
    const bank = bankById();
    // Si el banco cambió y algún reactivo ya no existe, reinicia el intento
    if (cur.qs.some(x => !bank[x.id])) { st.exam.current = buildAttempt(); SCM.store.save(); return question(body); }
    const idx = cur.cur;
    const meta = cur.qs[idx];
    const q = bank[meta.id];
    const answered = (k) => cur.answers[cur.qs[k].id] != null && !(Array.isArray(cur.answers[cur.qs[k].id]) && !cur.answers[cur.qs[k].id].length);
    const total = cur.qs.length;
    const nAnswered = cur.qs.filter((_, k) => answered(k)).length;

    body.innerHTML = '';
    const view = el(`<div>
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
        <div><span class="kicker">Evaluación final</span><h2 class="screen-title" style="margin:0">Pregunta ${idx + 1} de ${total}</h2></div>
        <span class="pill">${I('check')} Respondidas: ${nAnswered}/${total}</span>
      </div>
      <nav class="exam-nav" aria-label="Ir a pregunta">${cur.qs.map((_, k) => `<button data-go="${k}" class="${k === idx ? 'cur' : answered(k) ? 'answered' : ''}" aria-label="Pregunta ${k + 1}${answered(k) ? ', respondida' : ''}" ${k === idx ? 'aria-current="step"' : ''}>${k + 1}</button>`).join('')}</nav>
      <div class="card quiz-card">
        <span class="pill qtype">${I(q.type === 'order' ? 'list' : q.type === 'case' ? 'building' : q.type === 'multi' ? 'check' : q.type === 'tf' ? 'scale' : 'clipboard')} ${typeLabel[q.type]}</span>
        <p class="quiz-q" id="eq" style="margin-top:12px">${esc(q.q)}</p>
        ${q.type === 'multi' ? `<p class="muted" style="font-size:.88rem;margin:6px 0 0">Selecciona ${q.answer.length} opciones.</p>` : ''}
        ${q.type === 'order' ? `<p class="muted" style="font-size:.88rem;margin:6px 0 0">Arrastra o usa las flechas para ordenar. Si ya está en el orden que quieres, confírmalo.</p>` : ''}
        <div data-ans style="margin-top:12px"></div>
      </div>
      <div class="btn-row" style="justify-content:space-between;margin-top:18px">
        <button class="btn btn-ghost" data-prev ${idx === 0 ? 'disabled' : ''}>${I('left')} Anterior</button>
        <div class="btn-row">
          ${idx < total - 1 ? `<button class="btn btn-primary" data-next>Siguiente ${I('right')}</button>` : ''}
          <button class="btn ${nAnswered === total ? 'btn-ok' : 'btn-ghost'}" data-submit ${nAnswered === total ? '' : 'disabled'}>${I('flag')} Enviar evaluación</button>
        </div>
      </div>
      <p class="muted" data-hint style="font-size:.82rem;margin-top:10px">${nAnswered < total ? `Responde todas las preguntas para poder enviar (${total - nAnswered} pendiente${total - nAnswered === 1 ? '' : 's'}).` : 'Todas las preguntas tienen respuesta. Puedes revisarlas o enviar.'}</p>
    </div>`);
    body.appendChild(view);
    const ans = view.querySelector('[data-ans]');
    const save = (v) => { cur.answers[q.id] = v; SCM.store.save(); };
    const refreshNav = () => question(body);

    if (q.type === 'order') {
      const list = el('<ol class="sortable" aria-labelledby="eq"></ol>');
      const initial = Array.isArray(cur.answers[q.id]) ? cur.answers[q.id] : meta.order;
      list.innerHTML = initial.map(i => SCM.ui.sortItemHTML(String(i), esc(q.items[i]))).join('');
      ans.appendChild(list);
      const confirm = el(`<div class="btn-row" style="margin-top:12px"><button class="btn btn-sm ${cur.answers[q.id] ? 'btn-ok' : 'btn-ghost'}">${I('check')} ${cur.answers[q.id] ? 'Orden guardado' : 'Confirmar este orden'}</button></div>`);
      ans.appendChild(confirm);
      const s = SCM.ui.makeSortable(list, (ids) => { save(ids.map(Number)); markConfirm(); });
      const markConfirm = () => { const b = confirm.querySelector('button'); b.className = 'btn btn-sm btn-ok'; b.innerHTML = `${I('check')} Orden guardado`; updateSubmitState(); };
      confirm.querySelector('button').addEventListener('click', () => { save(s.ids().map(Number)); markConfirm(); });
    } else {
      const multi = q.type === 'multi';
      const opts = el(`<div class="opts" role="${multi ? 'group' : 'radiogroup'}" aria-labelledby="eq"></div>`);
      const labels = q.type === 'tf' ? ['Verdadero', 'Falso'] : q.options;
      meta.order.forEach((k, n) => {
        const a = cur.answers[q.id];
        const sel = multi ? (Array.isArray(a) && a.includes(k)) : a === k;
        const b = el(`<button class="opt ${sel ? 'selected' : ''}" role="${multi ? 'checkbox' : 'radio'}" aria-checked="${sel}" data-k="${k}"><span class="opt__key">${letter(n)}</span><span>${esc(labels[k])}</span>${multi ? `<span class="check">${sel ? I('check') : ''}</span>` : ''}</button>`);
        b.addEventListener('click', () => {
          if (multi) {
            let a = Array.isArray(cur.answers[q.id]) ? cur.answers[q.id].slice() : [];
            if (a.includes(k)) a = a.filter(x => x !== k);
            else { if (a.length >= q.answer.length) a.shift(); a.push(k); }
            save(a.length ? a : null);
          } else save(k);
          opts.querySelectorAll('.opt').forEach(x => {
            const kk = +x.dataset.k, cv = cur.answers[q.id];
            const on = multi ? (Array.isArray(cv) && cv.includes(kk)) : cv === kk;
            x.classList.toggle('selected', on); x.setAttribute('aria-checked', on);
            const ck = x.querySelector('.check'); if (ck) ck.innerHTML = on ? I('check') : '';
          });
          updateSubmitState();
        });
        opts.appendChild(b);
      });
      ans.appendChild(opts);
    }

    function updateSubmitState() {
      const n = cur.qs.filter((_, k) => answered(k)).length;
      view.querySelector('.pill:not(.qtype)').innerHTML = `${I('check')} Respondidas: ${n}/${total}`;
      const navBtn = view.querySelector(`[data-go="${idx}"]`);
      const sb = view.querySelector('[data-submit]');
      sb.disabled = n !== total; sb.className = 'btn ' + (n === total ? 'btn-ok' : 'btn-ghost');
      view.querySelector('[data-hint]').textContent = n < total ? `Responde todas las preguntas para poder enviar (${total - n} pendiente${total - n === 1 ? '' : 's'}).` : 'Todas las preguntas tienen respuesta. Puedes revisarlas o enviar.';
      if (navBtn) navBtn.setAttribute('aria-label', `Pregunta ${idx + 1}${answered(idx) ? ', respondida' : ''}`);
    }

    view.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { cur.cur = +b.dataset.go; SCM.store.save(); refreshNav(); }));
    view.querySelector('[data-prev]').addEventListener('click', () => { cur.cur = Math.max(0, idx - 1); SCM.store.save(); refreshNav(); });
    const nx = view.querySelector('[data-next]');
    if (nx) nx.addEventListener('click', () => { cur.cur = Math.min(total - 1, idx + 1); SCM.store.save(); refreshNav(); });
    view.querySelector('[data-submit]').addEventListener('click', async () => {
      const ok = await SCM.ui.confirm('¿Enviar evaluación?', 'Una vez enviada se calificará este intento. Podrás ver tus resultados y, si lo necesitas, hacer un nuevo intento.', 'Enviar');
      if (ok) submit(body);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function submit(body) {
    const st = SCM.store.get();
    const cur = st.exam.current;
    const bank = bankById();
    const review = cur.qs.map(x => ({ id: x.id, given: cur.answers[x.id] == null ? null : cur.answers[x.id], ok: isCorrect(bank[x.id], cur.answers[x.id]) }));
    const correct = review.filter(r => r.ok).length;
    const total = review.length;
    const pct = Math.round(correct / total * 100);
    const passed = pct >= cfg.passingScore;
    const attempt = { n: st.exam.attempts.length + 1, date: new Date().toISOString(), correct, total, pct, passed, review };
    const firstPass = passed && !st.exam.passed;
    st.exam.attempts.push(attempt);
    st.exam.bestPct = Math.max(st.exam.bestPct || 0, pct);
    st.exam.passed = st.exam.passed || passed;
    st.exam.current = null;
    SCM.store.save();
    SCM.lms.emit('exam_submitted', { attempt: attempt.n, correct, total, pct, passed });
    if (firstPass) {
      SCM.store.addXP('exam-pass', 300);
      SCM.lms.emit('course_completed', { pct, attempts: attempt.n });
    }
    SCM.app.refreshChrome();
    results(body, attempt, firstPass);
  }

  function results(body, attempt, firstPass) {
    const bank = bankById();
    const wrong = attempt.review.filter(r => !r.ok);
    body.innerHTML = '';
    const view = el(`<div>
      <span class="kicker">Resultados · Intento ${attempt.n}</span>
      <div class="card" style="padding:28px;text-align:center">
        ${ring(attempt.pct, attempt.passed)}
        <h2 style="margin-top:12px">${attempt.passed ? '¡Aprobaste la evaluación final!' : 'Aún no alcanzas la calificación mínima'}</h2>
        <p class="lead" style="margin:0 auto 16px">Obtuviste <strong>${attempt.correct} de ${attempt.total}</strong> aciertos (${attempt.pct}%). ${attempt.passed ? 'Tu certificado de finalización está disponible.' : `Necesitas al menos ${cfg.passingScore}% para aprobar. Revisa las explicaciones y haz un nuevo intento.`}</p>
        <div class="btn-row" style="justify-content:center">
          ${attempt.passed ? `<a class="btn btn-ok btn-lg" href="#/certificado">${I('award')} Obtener mi certificado</a>` : ''}
          <button class="btn ${attempt.passed ? 'btn-ghost' : 'btn-primary btn-lg'}" data-retry>${I('refresh')} Nuevo intento</button>
          <a class="btn btn-ghost" href="#/resultados">${I('trophy')} Mis resultados</a>
        </div>
      </div>
      <div class="section-title">${I('eye')}<h2>${wrong.length ? `Revisa tus respuestas incorrectas (${wrong.length})` : '¡Todas tus respuestas fueron correctas!'}</h2></div>
      <div class="review">${wrong.map(r => {
        const q = bank[r.id];
        return `<div class="review__item"><h4>${esc(q.q)}</h4>
          <p><span class="pill bad">Tu respuesta</span><br>${answerText(q, r.given)}</p>
          <p><span class="pill ok">Respuesta correcta</span><br>${correctText(q)}</p>
          <p style="color:var(--ink-soft)">${I('info')} ${esc(q.explain)}</p></div>`;
      }).join('')}</div>
      ${attempt.review.some(r => r.ok) ? `<details style="margin-top:16px"><summary style="cursor:pointer;font-weight:700">Ver preguntas respondidas correctamente (${attempt.review.filter(r => r.ok).length})</summary><div class="review">${attempt.review.filter(r => r.ok).map(r => { const q = bank[r.id]; return `<div class="review__item ok"><h4>${esc(q.q)}</h4><p>${correctText(q)}</p></div>`; }).join('')}</div></details>` : ''}
    </div>`);
    body.appendChild(view);
    view.querySelector('[data-retry]').addEventListener('click', () => {
      const st = SCM.store.get();
      st.exam.current = buildAttempt();
      SCM.store.save();
      question(body);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (attempt.passed) {
      SCM.ui.confetti(140);
      if (firstPass) SCM.ui.toast('+300 XP · ¡Evaluación aprobada!', 'trophy');
    }
  }

  SCM.exam = { render, buildAttempt, isCorrect };
})();

</script>

    const rnd = Array.from(bytes, b => abc[b % abc.length]).join('');
    const d = new Date(date);
    const ymd = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');

    x.fillText('por haber concluido satisfactoriamente el curso', cx, 650);
    x.fillStyle = '#222933'; x.font = `800 58px ${D}`; x.fillText('Servicio al Cliente Mirage', cx, 740);
    x.fillStyle = '#4B4D52'; x.font = `700 40px ${D}`; x.fillText('Creando experiencias extraordinarias', cx, 800);

    // Datos
    const cols = [
      ['FECHA DE FINALIZACIÓN', SCM.ui.fmtDate(cert.date)],
      ['CALIFICACIÓN OBTENIDA', cert.pct + ' %'],
      ['DURACIÓN', cfg.durationLabel],
      ['MÓDULOS', '6 de 6']
    ];
    const colW = 330, startX = cx - (colW * cols.length) / 2 + colW / 2;
    cols.forEach((cl, i) => {
      const px = startX + i * colW;
      x.fillStyle = '#F4F5F7'; x.beginPath(); x.roundRect ? x.roundRect(px - 150, 880, 300, 130, 18) : x.rect(px - 150, 880, 300, 130); x.fill();
      x.fillStyle = '#76777A'; x.font = `700 19px ${B}`; x.fillText(cl[0], px, 930);
      let fs = 34;
      x.font = `800 ${fs}px ${D}`;
      while (x.measureText(cl[1]).width > 270 && fs > 20) { fs -= 2; x.font = `800 ${fs}px ${D}`; }
      x.fillStyle = '#222933'; x.fillText(cl[1], px, 980);
    });

    // Sello
    const sx = W - 330, sy = H - 300;
    x.fillStyle = '#EA0029';
    for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2; x.beginPath(); x.arc(sx + Math.cos(a) * 112, sy + Math.sin(a) * 112, 18, 0, Math.PI * 2); x.fill(); }
    x.beginPath(); x.arc(sx, sy, 114, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#C8C9CC'; x.beginPath(); x.arc(sx, sy, 98, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#222933'; x.beginPath(); x.arc(sx, sy, 82, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#fff'; x.beginPath();
    for (let i = 0; i < 10; i++) { const r = i % 2 ? 22 : 50, a = -Math.PI / 2 + i * Math.PI / 5; x.lineTo(sx + Math.cos(a) * r, sy - 12 + Math.sin(a) * r); }
    x.closePath(); x.fill();
    x.font = `800 18px ${D}`; x.fillText('APROBADO', sx, sy + 58);

    // Competencias
    x.textAlign = 'left';
    x.fillStyle = '#222933'; x.font = `700 22px ${B}`; x.fillText('Competencias desarrolladas:', 280, H - 290);
    x.fillStyle = '#4B4D52'; x.font = `500 22px ${B}`;
    ['Cultura de servicio · Comunicación efectiva y escucha activa · Manejo de clientes difíciles',
     'Solución de problemas y posventa · Trabajo en equipo · Experiencias extraordinarias'].forEach((t, i) => x.fillText(t, 280, H - 252 + i * 34));

    // Aviso de validez (sin backend)
    x.fillStyle = '#76777A'; x.font = `500 18px ${B}`;
    SCM.ui.wrapText(x, 'Constancia generada localmente en el navegador del participante. El folio no ha sido registrado por un sistema central y no constituye una acreditación verificable por un administrador hasta su validación en Academia Mirage.', 280, H - 150, W - 760, 26, 3);
    return c;
  }

  function render(main) {
    const st = SCM.store.get();
    const wrap = el('<section class="screen"><div class="screen-body"></div></section>');
    const body = wrap.querySelector('.screen-body');
    main.appendChild(wrap);

    if (!eligible()) {
      const modsOk = SCM.modules.every(m => st.modulesDone[m.id]);
      body.appendChild(el(`<div class="card" style="padding:32px;text-align:center">
        <div style="width:72px;height:72px;border-radius:22px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;margin:0 auto 14px">${I('lock')}</div>
        <h2>Certificado aún no disponible</h2>
        <p class="lead" style="margin:0 auto 18px">El certificado se habilita al completar los seis módulos y aprobar la evaluación final con al menos ${cfg.passingScore}%.</p>
        <div style="display:grid;gap:8px;max-width:420px;margin:0 auto 20px;text-align:left">
          <div class="takeaway">${modsOk ? I('check') : `<span style="color:var(--ink-faint)">${I('lock')}</span>`}<span>Seis módulos completados</span></div>
          <div class="takeaway">${st.exam.passed ? I('check') : `<span style="color:var(--ink-faint)">${I('lock')}</span>`}<span>Evaluación final aprobada ${st.exam.attempts.length ? `(mejor calificación: ${st.exam.bestPct}%)` : ''}</span></div>
        </div>
        <a class="btn btn-primary" href="${modsOk ? '#/examen' : SCM.app.resumeHref()}">${modsOk ? `${I('clipboard')} Ir a la evaluación final` : `${I('play')} Continuar capacitación`}</a></div>`));
      return;
    }

    const view = el(`<div>
      <span class="kicker">Certificado de finalización</span>
      <h2 class="screen-title">¡Felicidades${st.learner.name ? ', ' + esc(st.learner.name.split(' ')[0]) : ''}!</h2>
      <p class="lead">Completaste la capacitación <strong>Servicio al Cliente Mirage: Creando experiencias extraordinarias</strong>.</p>
      <div class="card" style="padding:20px;margin:16px 0;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
        <label style="display:grid;gap:6px;font-weight:600;font-size:.9rem;flex:1;min-width:240px">Nombre completo como aparecerá en el certificado
          <input class="input" data-name maxlength="80" autocomplete="name" value="${esc(st.certificate ? st.certificate.name : st.learner.name || '')}"></label>
        <button class="btn btn-primary" data-gen>${I('award')} ${st.certificate ? 'Actualizar certificado' : 'Generar certificado'}</button>
      </div>
      <div class="notice warn">${I('info')}<span><strong>Aviso:</strong> este curso todavía no está conectado a un sistema de registro. El certificado y su folio se generan en tu navegador y <strong>no constituyen una acreditación verificable por un administrador</strong> hasta que Academia Mirage los registre.</span></div>
      <div data-out style="margin-top:18px"></div>
    </div>`);
    body.appendChild(view);
    const out = view.querySelector('[data-out]');
    const nameInput = view.querySelector('[data-name]');

    async function generate() {
      const name = nameInput.value.trim().replace(/\s+/g, ' ');
      if (name.length < 3) { nameInput.focus(); SCM.ui.toast('Escribe tu nombre completo', 'user'); return; }
      SCM.store.setLearner({ name });
      const first = !st.certificate;
      if (first) {
        const date = lastPassDate(st);
        st.certificate = { folio: newFolio(date), date, pct: st.exam.bestPct, name, issuedAt: new Date().toISOString() };
      } else {
        st.certificate.name = name;
        st.certificate.pct = st.exam.bestPct;
      }
      SCM.store.save();
      if (first) {
        SCM.lms.emit('certificate_issued', { folio: st.certificate.folio, pct: st.certificate.pct });
        SCM.ui.confetti(120);
      }
      const canvas = await draw(st.certificate);
      canvas.setAttribute('role', 'img');
      canvas.setAttribute('aria-label', `Certificado de finalización a nombre de ${name}, calificación ${st.certificate.pct}%, folio ${st.certificate.folio}`);
      out.innerHTML = '';
      const box = el(`<div>
        <div class="cert-actions">
          <button class="btn btn-primary" data-pdf>${I('download')} Descargar PDF</button>
          <button class="btn btn-ghost" data-print>${I('printer')} Imprimir</button>
          <button class="btn btn-ghost" data-png>${I('file')} Descargar imagen</button>
        </div>
        <div class="cert-preview" data-cv></div>
        <p class="muted" style="font-size:.85rem;margin-top:10px">Folio: <strong>${esc(st.certificate.folio)}</strong> · Emitido el ${SCM.ui.fmtDate(st.certificate.issuedAt)}</p>
      </div>`);
      box.querySelector('[data-cv]').appendChild(canvas);
      out.appendChild(box);
      const file = 'certificado-servicio-al-cliente-mirage-' + st.certificate.folio;
      box.querySelector('[data-pdf]').addEventListener('click', () => SCM.ui.download(SCM.pdf.canvasToPdf(canvas, { title: 'Certificado · Servicio al Cliente Mirage' }), file + '.pdf'));
      box.querySelector('[data-png]').addEventListener('click', () => canvas.toBlob(b => SCM.ui.download(b, file + '.png')));
      box.querySelector('[data-print]').addEventListener('click', () => SCM.ui.printImage(canvas.toDataURL('image/png')));
      view.querySelector('[data-gen]').innerHTML = `${I('award')} Actualizar certificado`;
      SCM.app.refreshChrome();
    }
    view.querySelector('[data-gen]').addEventListener('click', generate);
    if (st.certificate) generate();
  }

  SCM.certificate = { render, eligible };
})();

</script>
  <script>
/* ==========================================================================
   Aplicación: enrutador, estructura (barra superior, menú lateral,
   navegación), pantalla inicial, resultados y logros.
   Rutas: #/inicio · #/m/{módulo}/{pantalla} · #/examen · #/resultados · #/certificado
   ========================================================================== */
(function () {
  const { el, esc } = SCM.ui;
  const I = SCM.icon;
  const S = SCM.store;
  const cfg = SCM.config;
  const M = SCM.modules;

  const $main = document.getElementById('main');
  const $side = document.getElementById('sidebar');
  const $shell = document.getElementById('shell');
  const $backdrop = document.getElementById('backdrop');
  const $menuBtn = document.getElementById('menuBtn');

  /* ---------- Estado derivado ---------- */
  const key = (m, i) => `${m.id}:${i}`;
  const totalScreens = M.reduce((n, m) => n + m.screens.length, 0);
  const doneCount = (m) => m.screens.filter((_, i) => S.isScreenDone(key(m, i))).length;
  const firstPending = (m) => { const i = m.screens.findIndex((_, k) => !S.isScreenDone(key(m, k))); return i === -1 ? m.screens.length - 1 : i; };
  const moduleUnlocked = (m) => !cfg.sequentialModules || m.number === 1 || Boolean(S.get().modulesDone[M[m.number - 2].id]);
  const globalPct = () => {
    const st = S.get();
    const done = M.reduce((n, m) => n + doneCount(m), 0);
    return Math.round(done / totalScreens * 90 + (st.exam.passed ? 10 : 0));
  };
  function resumeHref() {
    const st = S.get();
    const m = M.find(mm => !st.modulesDone[mm.id]);
    if (m) return `#/m/${m.number}/${firstPending(m) + 1}`;
    return st.exam.passed ? '#/resultados' : '#/examen';
  }

  /* ---------- Barra superior ---------- */
  function refreshChrome() {
    const st = S.get();
    const lv = SCM.ui.levelFor(st.xp);
    document.getElementById('xpChip').innerHTML = `<span class="xp-chip__star">${I('star')}</span><span><strong>${st.xp}</strong> XP <small>· Nivel ${lv.index} · ${esc(lv.name)}</small></span>`;
    document.getElementById('xpChip').setAttribute('aria-label', `${st.xp} puntos de experiencia, nivel ${lv.index}: ${lv.name}`);
    document.getElementById('globalBar').style.width = globalPct() + '%';
  }
  function bumpXP() {
    const c = document.getElementById('xpChip');
    c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump');
  }

  /* ---------- Menú lateral ---------- */
  function renderSidebar(route) {
    const st = S.get();
    const pct = globalPct();
    const allDone = M.every(m => st.modulesDone[m.id]);
    $side.innerHTML = '';
    const head = el(`<div class="side-head"><span class="side-head__label">Tu progreso</span>
      <div class="side-head__pct"><strong>${pct}%</strong><span>${Object.keys(st.modulesDone).length} de ${M.length} módulos</span></div>
      <div class="bar ${pct === 100 ? 'ok' : ''}"><span style="width:${pct}%"></span></div></div>`);
    $side.appendChild(head);
    const nav = el('<nav aria-label="Módulos del curso"></nav>');
    M.forEach(m => {
      const unlocked = moduleUnlocked(m);
      const done = Boolean(st.modulesDone[m.id]);
      const isCur = route.name === 'module' && route.m === m;
      const dc = doneCount(m);
      const item = el(`<div class="side-mod ${isCur ? 'is-current' : ''} ${done ? 'is-done' : ''}">
        <button class="side-mod__btn" ${unlocked ? '' : 'disabled'} aria-label="Módulo ${m.number}: ${esc(m.title)}${done ? ', completado' : unlocked ? '' : ', bloqueado'}">
          <span class="side-mod__num">${done ? I('check') : m.number}</span>
          <span><span class="side-mod__title">${esc(m.title)}</span><span class="side-mod__meta">${dc}/${m.screens.length} pantallas · ${m.minutes} min</span>
            <span class="bar side-mod__bar ${done ? 'ok' : ''}"><span style="width:${dc / m.screens.length * 100}%"></span></span></span>
          <span class="side-mod__state">${unlocked ? '' : I('lock')}</span>
        </button></div>`);
      item.querySelector('button').addEventListener('click', () => go(`#/m/${m.number}/${firstPending(m) + 1}`));
      if (isCur) {
        const reach = firstPending(m);
        const ol = el('<ol class="side-steps"></ol>');
        m.screens.forEach((s, i) => {
          const d = S.isScreenDone(key(m, i));
          const lbl = ['intro', 'objectives', 'quiz', 'conclusion'].includes(s.type) ? SCM.screens.typeLabel[s.type][1] : s.title;
          const li = el(`<li><button ${i > reach && !d ? 'disabled' : ''} ${i === route.s ? 'aria-current="step"' : ''}><span class="dot ${d ? 'done' : ''}">${d ? I('check') : ''}</span>${esc(lbl)}</button></li>`);
          li.querySelector('button').addEventListener('click', () => go(`#/m/${m.number}/${i + 1}`));
          ol.appendChild(li);
        });
        item.appendChild(ol);
      }
      nav.appendChild(item);
    });
    $side.appendChild(nav);
    $side.appendChild(el('<div class="side-sep"></div>'));
    const links = [
      { href: '#/examen', name: 'exam', icon: 'clipboard', label: 'Evaluación final', sub: st.exam.passed ? `Aprobada · ${st.exam.bestPct}%` : allDone ? 'Disponible' : 'Se desbloquea al terminar', disabled: !allDone },
      { href: '#/resultados', name: 'results', icon: 'trophy', label: 'Mis resultados', sub: `${st.xp} XP · ${Object.keys(st.badges).length} insignias` },
      { href: '#/certificado', name: 'cert', icon: 'award', label: 'Certificado', sub: SCM.certificate.eligible() ? 'Disponible' : 'Requiere aprobar', disabled: !SCM.certificate.eligible() }
    ];
    links.forEach(l => {
      const b = el(`<button class="side-link ${route.name === l.name ? 'is-current' : ''}" ${l.disabled ? 'disabled' : ''}><span class="side-link__ico">${I(l.disabled ? 'lock' : l.icon)}</span><span>${l.label}<small>${l.sub}</small></span></button>`);
      b.addEventListener('click', () => go(l.href));
      $side.appendChild(b);
    });
  }

  function openDrawer(open) {
    $side.classList.toggle('open', open);
    $backdrop.hidden = !open;
    $menuBtn.setAttribute('aria-expanded', open);
    $menuBtn.setAttribute('aria-label', open ? 'Cerrar menú de módulos' : 'Abrir menú de módulos');
    $menuBtn.innerHTML = I(open ? 'close' : 'menu');
    if (open) { const f = $side.querySelector('button:not(:disabled)'); f && f.focus(); }
  }
  $menuBtn.addEventListener('click', () => openDrawer(!$side.classList.contains('open')));
  $backdrop.addEventListener('click', () => openDrawer(false));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $side.classList.contains('open')) { openDrawer(false); $menuBtn.focus(); } });

  /* ---------- Inicio ---------- */
  function renderHome() {
    const st = S.get();
    const started = Boolean(st.startedAt);
    const pct = globalPct();
    const comps = [
      { icon: 'heart', t: 'Cultura de servicio', d: 'Entender el impacto de tu trabajo en cada momento de verdad.' },
      { icon: 'ear', t: 'Comunicación y escucha', d: 'Escuchar, preguntar y responder con claridad y empatía.' },
      { icon: 'shield', t: 'Manejo de situaciones tensas', d: 'Atender quejas con calma y recuperar la confianza.' },
      { icon: 'wrench', t: 'Solución de problemas', d: 'Resolver y dar seguimiento sin prometer lo no confirmado.' },
      { icon: 'users', t: 'Trabajo en equipo', d: 'Coordinarte con otras áreas para cumplirle al cliente.' },
      { icon: 'sparkles', t: 'Experiencias memorables', d: 'Anticipar, personalizar y mejorar continuamente.' }
    ];
    const page = el(`<div class="home">
      <section class="hero">
        <div class="hero__inner">
          <div>
            <span class="pill">${I('book')} ${esc(cfg.academy)} · Curso en línea</span>
            <h1 style="margin-top:18px"><span>Servicio al Cliente Mirage México</span>Creando experiencias extraordinarias</h1>
            <p class="lead">Una experiencia práctica para todo el equipo Mirage: simulación de conversaciones con distribuidores, técnicos y usuarios. Resuelve casos reales de pedidos, entregas y posventa, y cumple nuestra misión: <strong>Acondicionamos tu vida</strong>.</p>
            <div class="hero__facts">
              <div class="hero__fact">${I('clock')}<span><strong>${cfg.durationLabel}</strong><small>Duración</small></span></div>
              <div class="hero__fact">${I('layers')}<span><strong>${M.length} módulos</strong><small>Interactivos</small></span></div>
              <div class="hero__fact">${I('puzzle')}<span><strong>7 juegos</strong><small>y simuladores</small></span></div>
              <div class="hero__fact">${I('award')}<span><strong>Certificado</strong><small>al aprobar</small></span></div>
            </div>
            ${started ? '' : `<div class="name-field"><label for="learnerName">¿Cómo te llamas? <span style="font-weight:400">(opcional; lo usaremos en tu tarjeta y certificado)</span></label><input id="learnerName" maxlength="80" autocomplete="name" placeholder="Nombre y apellido" value="${esc(st.learner.name || '')}"></div>`}
            <div class="hero__cta">
              <button class="btn btn-primary btn-lg" data-start style="background:#fff;color:var(--navy)">${I('play')} ${started ? (pct >= 100 ? 'Ver mis resultados' : `Continuar capacitación · ${pct}%`) : 'Comenzar capacitación'}</button>
              <a class="btn btn-ghost btn-lg" href="#modulos">Ver contenido</a>
            </div>
          </div>
          <div class="hero__art">${SCM.illo.scenes.hero()}</div>
        </div>
      </section>

      <section class="home-section">
        <span class="kicker">Lo que desarrollarás</span>
        <h2>Competencias del curso</h2>
        <div class="comp-grid">${comps.map(c => `<div class="card comp"><span class="comp__ico">${I(c.icon)}</span><h3>${c.t}</h3><p>${c.d}</p></div>`).join('')}</div>
      </section>

      <section class="home-section" id="modulos">
        <span class="kicker">Ruta de aprendizaje</span>
        <h2>Seis módulos, una experiencia</h2>
        <p class="lead">Cada módulo incluye contenido breve, una infografía interactiva, un juego o simulador, un caso Mirage, una evaluación corta y una insignia.</p>
        <div class="mod-grid">${M.map(m => {
          const dc = doneCount(m), done = Boolean(st.modulesDone[m.id]), un = moduleUnlocked(m);
          return `<article class="card mod-card">
            <div class="mod-card__art"><span class="pill mod-card__num">Módulo ${m.number}</span><span class="mod-card__lock ${done ? 'done' : ''}">${I(done ? 'check' : un ? 'play' : 'lock')}</span>${SCM.illo.scenes[m.scene]()}</div>
            <div class="mod-card__body"><h3>${esc(m.title)}</h3><p>${esc(m.summary)}</p>
              <div class="mod-card__foot"><span class="muted" style="font-size:.8rem;white-space:nowrap">${I('clock')} ${m.minutes} min</span><span class="bar ${done ? 'ok' : ''}"><span style="width:${dc / m.screens.length * 100}%"></span></span>
              ${un ? `<a class="btn btn-sm ${done ? 'btn-ghost' : 'btn-primary'}" href="#/m/${m.number}/${done ? 1 : firstPending(m) + 1}">${done ? 'Repasar' : dc ? 'Continuar' : 'Iniciar'}</a>` : `<span class="pill">${I('lock')} Bloqueado</span>`}</div>
            </div></article>`;
        }).join('')}</div>
      </section>

      <section class="home-section">
        <span class="kicker">Cómo funciona</span>
        <h2>Aprende jugando, demuestra lo aprendido</h2>
        <div class="comp-grid">
          <div class="card comp"><span class="comp__ico">${I('star')}</span><h3>Puntos de experiencia</h3><p>Gana XP en actividades, casos y evaluaciones. Sube de nivel hasta convertirte en Leyenda del servicio.</p></div>
          <div class="card comp"><span class="comp__ico">${I('award')}</span><h3>Insignias</h3><p>Desbloquea una insignia al completar cada módulo.</p></div>
          <div class="card comp"><span class="comp__ico">${I('clipboard')}</span><h3>Evaluación final</h3><p>15 preguntas de un banco de ${SCM.examBank.length}. Aprueba con ${cfg.passingScore}% o más; puedes reintentar.</p></div>
          <div class="card comp"><span class="comp__ico">${I('file')}</span><h3>Certificado</h3><p>Descárgalo en PDF o imprímelo al aprobar.</p></div>
        </div>
        <div class="notice" style="margin-top:18px">${I('info')}<span>Tu avance se guarda automáticamente <strong>en este navegador y dispositivo</strong>. No se sincroniza con otros equipos ni con un servidor.${S.storageAvailable() ? '' : ' <strong>Atención: tu navegador está bloqueando el almacenamiento local; el avance no se conservará al recargar.</strong>'}</span></div>
      </section>
    </div>`);
    page.querySelector('[data-start]').addEventListener('click', () => {
      const input = page.querySelector('#learnerName');
      if (input && input.value.trim()) S.setLearner({ name: input.value.trim().replace(/\s+/g, ' ') });
      if (!st.startedAt) {
        st.startedAt = new Date().toISOString(); S.save();
        SCM.lms.emit('course_started', {});
      }
      go(pct >= 100 ? '#/resultados' : resumeHref());
    });
    page.querySelector('a[href="#modulos"]').addEventListener('click', (e) => { e.preventDefault(); page.querySelector('#modulos').scrollIntoView({ behavior: 'smooth' }); });
    return page;
  }

  /* ---------- Pantalla de módulo ---------- */
  function renderModule(route) {
    const m = route.m, i = route.s, s = m.screens[i];
    const k = key(m, i);
    const st = S.get();
    if (!st.startedAt) { st.startedAt = new Date().toISOString(); S.save(); SCM.lms.emit('course_started', {}); }

    const wrap = el(`<section class="screen" aria-labelledby="scrTitle">
      <header class="screen-head">
        <div class="screen-head__mod"><span class="num">${m.number}</span><div><small>Módulo ${m.number}</small><strong id="scrTitle">${esc(m.title)}</strong></div></div>
        <div class="steps-dots" aria-label="Pantalla ${i + 1} de ${m.screens.length}">${m.screens.map((_, j) => `<span class="${j === i ? 'current' : S.isScreenDone(key(m, j)) ? 'done' : ''}"></span>`).join('')}</div>
      </header>
      <div class="screen-type">${s.type !== 'intro' ? `<span class="pill">${I(SCM.screens.typeLabel[s.type][0])} ${SCM.screens.typeLabel[s.type][1]}</span>` : ''}</div>
      <div class="screen-body"></div>
    </section>`);
    const navbar = el('<nav class="navbar" aria-label="Navegación de pantallas"></nav>');

    const ctx = {
      module: m, screen: s, index: i, key: k,
      isDone: S.isScreenDone(k),
      getData: (n) => { const a = S.getActivity('scr:' + k); return a ? a[n] : null; },
      setData: (n, v) => S.setActivity('scr:' + k, { [n]: v }),
      complete(opts) {
        opts = opts || {};
        const first = S.markScreen(k);
        const gained = opts.xp ? S.addXP('xp:' + k, opts.xp) : 0;
        if (gained) {
          bumpXP();
          if (!opts.silent) SCM.ui.toast(`+${gained} XP · ${esc(opts.label || '¡Bien hecho!')}`, 'star');
        }
        if (first && SCM.screens.interactive(s)) {
          SCM.lms.emit('activity_completed', { module: m.id, screen: i + 1, type: s.type, score: opts.score == null ? null : opts.score });
        }
        ctx.isDone = true;
        refreshChrome();
        paintNav();
        if (first || gained) renderSidebar(route);
        wrap.querySelectorAll('.steps-dots span')[i].className = 'current';
      },
      completeModule() {
        const st2 = S.get();
        const allPrev = m.screens.every((_, j) => j === i || S.isScreenDone(key(m, j)));
        if (st2.modulesDone[m.id] || !allPrev) return;
        const now = new Date().toISOString();
        st2.modulesDone[m.id] = now;
        st2.badges[m.id] = now;
        S.save();
        const gained = S.addXP('module:' + m.id, 100);
        SCM.lms.emit('module_completed', { module: m.id, number: m.number, quiz: st2.quizzes[m.id] || null });
        refreshChrome(); bumpXP(); renderSidebar(route);
        setTimeout(() => achievement(m, gained), 450);
      }
    };

    function paintNav() {
      const done = S.isScreenDone(k);
      const interactiveTotal = m.screens.filter(SCM.screens.interactive).length;
      const interactiveDone = m.screens.filter((sc, j) => SCM.screens.interactive(sc) && S.isScreenDone(key(m, j))).length;
      const last = i === m.screens.length - 1;
      const next = M[m.number];
      const prevHref = i > 0 ? `#/m/${m.number}/${i}` : (m.number > 1 ? `#/m/${m.number - 1}/${M[m.number - 2].screens.length}` : '#/inicio');
      const nextHref = !last ? `#/m/${m.number}/${i + 2}` : next ? `#/m/${next.number}/1` : '#/examen';
      const nextLabel = !last ? 'Siguiente' : next ? `Módulo ${next.number}` : 'Evaluación final';
      navbar.innerHTML = `
        <a class="btn btn-ghost" href="${prevHref}" aria-label="Pantalla anterior">${I('left')} <span class="lbl">Anterior</span></a>
        <div class="navbar__info"><strong>Pantalla ${i + 1} de ${m.screens.length}</strong> · Actividades ${interactiveDone}/${interactiveTotal}
          ${done ? `<span class="navbar__hint ok">${I('check')} Completada</span>` : `<span class="navbar__hint">${I('lock')} ${hintFor(s)}</span>`}</div>
        <button class="btn btn-primary" data-next ${done ? '' : 'disabled'} aria-label="${esc(nextLabel)}"><span class="lbl">${esc(nextLabel)}</span> ${I('right')}</button>`;
      navbar.querySelector('[data-next]').addEventListener('click', () => go(nextHref));
    }
    function hintFor(sc) {
      return { infographic: 'Explora todos los elementos para continuar', activity: 'Completa la actividad para continuar', case: 'Resuelve el caso para continuar', quiz: 'Responde la evaluación para continuar' }[sc.type] || 'Completa esta pantalla';
    }

    const body = wrap.querySelector('.screen-body');
    body.appendChild(SCM.screens[s.type](s, ctx));
    paintNav();
    wrap.appendChild(navbar);
    return wrap;
  }

  function achievement(m, gained) {
    SCM.ui.confetti(110);
    const next = M[m.number];
    const md = SCM.ui.modal(`
      <div class="badge-big">${SCM.illo.badge(m.badge.icon, m.badge.color, m.badge.name)}</div>
      <span class="modal__xp">${I('star')} +${gained || 0} XP</span>
      <h2 id="modalTitle">¡Insignia desbloqueada!</h2>
      <p>Completaste el <strong>Módulo ${m.number}: ${esc(m.title)}</strong> y obtuviste la insignia <strong>${esc(m.badge.name)}</strong>.</p>
      <div class="btn-row"><button class="btn btn-primary" data-close data-autofocus>${I('check')} ¡Genial!</button></div>
      ${next ? `<p style="font-size:.85rem;margin:14px 0 0">Siguiente: Módulo ${next.number} · ${esc(next.title)}</p>` : `<p style="font-size:.85rem;margin:14px 0 0">¡Completaste los seis módulos! La evaluación final ya está disponible.</p>`}
    `);
    return md;
  }

  /* ---------- Resultados ---------- */
  function renderResults() {
    const st = S.get();
    const lv = SCM.ui.levelFor(st.xp);
    const nextLv = SCM.ui.levels[lv.index] || null;
    const modsDone = Object.keys(st.modulesDone).length;
    const certOk = SCM.certificate.eligible();
    const wrap = el(`<section class="screen"><div class="screen-body">
      <span class="kicker">Panel del participante</span>
      <h2 class="screen-title">${st.learner.name ? 'Resultados de ' + esc(st.learner.name) : 'Mis resultados'}</h2>
      <div class="res-grid">
        <div class="card stat"><small>Módulos terminados</small><strong>${modsDone}/${M.length}</strong><span class="bar ${modsDone === M.length ? 'ok' : ''}" style="display:block;margin-top:8px"><span style="width:${modsDone / M.length * 100}%"></span></span></div>
        <div class="card stat"><small>Puntos de experiencia</small><strong>${st.xp} XP</strong><span>Nivel ${lv.index} · ${esc(lv.name)}${nextLv ? ` · faltan ${nextLv.min - st.xp} XP para ${esc(nextLv.name)}` : ''}</span></div>
        <div class="card stat"><small>Calificación final</small><strong style="color:${st.exam.passed ? 'var(--ok)' : st.exam.attempts.length ? 'var(--bad)' : 'inherit'}">${st.exam.attempts.length ? st.exam.bestPct + '%' : '—'}</strong><span>${st.exam.passed ? 'Aprobada' : st.exam.attempts.length ? `No aprobada · mínimo ${cfg.passingScore}%` : 'Sin intentos'} · ${st.exam.attempts.length} intento${st.exam.attempts.length === 1 ? '' : 's'}</span></div>
        <div class="card stat"><small>Certificado</small><strong>${certOk ? (st.certificate ? 'Emitido' : 'Disponible') : 'Pendiente'}</strong><span>${st.certificate ? 'Folio ' + esc(st.certificate.folio) : certOk ? 'Genéralo ahora' : 'Requiere completar y aprobar'}</span></div>
      </div>

      <div class="section-title">${I('award')}<h2>Insignias</h2></div>
      <div class="badges">${M.map(m => `<div class="card badge-tile ${st.badges[m.id] ? '' : 'locked'}">${SCM.illo.badge(m.badge.icon, m.badge.color, m.badge.name)}<strong>${esc(m.badge.name)}</strong><small>${st.badges[m.id] ? SCM.ui.fmtDate(st.badges[m.id]) : 'Módulo ' + m.number}</small></div>`).join('')}
        <div class="card badge-tile ${st.exam.passed ? '' : 'locked'}">${SCM.illo.badge('trophy', '#222933', 'Servicio Extraordinario')}<strong>Servicio Extraordinario</strong><small>${st.exam.passed ? 'Evaluación aprobada' : 'Aprueba la evaluación'}</small></div>
      </div>

      <div class="section-title">${I('list')}<h2>Detalle por módulo</h2></div>
      <div class="card" style="overflow-x:auto"><table class="attempts"><thead><tr><th>Módulo</th><th>Avance</th><th>Actividad principal</th><th>Evaluación</th><th>Estado</th></tr></thead><tbody>
        ${M.map(m => {
          const acts = m.screens.filter(s => s.type === 'activity').map(s => S.getActivity(s.activity.id)).filter(Boolean);
          const q = st.quizzes[m.id];
          return `<tr><td><strong>${m.number}.</strong> ${esc(m.short)}</td><td>${doneCount(m)}/${m.screens.length}</td>
            <td>${acts.length ? acts.map(a => (a.best != null ? a.best : a.score) + '%').join(' · ') : '—'}</td><td>${q ? q.correct + '/' + q.total : '—'}</td>
            <td>${st.modulesDone[m.id] ? `<span class="pill ok">${I('check')} Completado</span>` : moduleUnlocked(m) ? '<span class="pill">En curso</span>' : `<span class="pill">${I('lock')} Bloqueado</span>`}</td></tr>`;
        }).join('')}
      </tbody></table></div>

      ${st.commitments ? `<div class="section-title">${I('pen')}<h2>Mis compromisos</h2></div>
        <div class="takeaways" style="margin-top:0">${st.commitments.items.map(i => { const o = M[5].screens.find(s => s.type === 'activity').activity.options[i]; return `<div class="takeaway">${I(o.icon)}<span><strong>${esc(o.title)}.</strong> ${esc(o.text)}</span></div>`; }).join('')}</div>` : ''}

      <div class="btn-row" style="margin-top:24px">
        ${certOk ? `<a class="btn btn-ok btn-lg" href="#/certificado">${I('award')} ${st.certificate ? 'Ver mi certificado' : 'Obtener mi certificado'}</a>` : `<a class="btn btn-primary btn-lg" href="${resumeHref()}">${I('play')} Continuar capacitación</a>`}
        ${modsDone === M.length ? `<a class="btn btn-ghost" href="#/examen">${I('clipboard')} Evaluación final</a>` : ''}
      </div>

      <div class="section-title">${I('info')}<h2>Tus datos</h2></div>
      <div class="card" style="padding:20px">
        <p style="margin-top:0">Tu avance, calificaciones, intentos e insignias se guardan <strong>únicamente en este navegador y dispositivo</strong> (almacenamiento local). No se sincronizan con otros equipos ni con un servidor, y un administrador todavía no puede consultarlos.</p>
        <div class="btn-row"><button class="btn btn-ghost btn-sm" data-export>${I('download')} Descargar mi registro (JSON)</button><button class="btn btn-ghost btn-sm" data-reset style="color:var(--bad)">${I('refresh')} Reiniciar curso</button></div>
      </div>
    </div></section>`);
    wrap.querySelector('[data-export]').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(SCM.lms.buildRecord(), null, 2)], { type: 'application/json' });
      SCM.ui.download(blob, 'registro-servicio-al-cliente-mirage.json');
    });
    wrap.querySelector('[data-reset]').addEventListener('click', async () => {
      const ok = await SCM.ui.confirm('¿Reiniciar el curso?', 'Se borrarán tu avance, puntos, insignias, intentos y certificado guardados en este navegador. Esta acción no se puede deshacer.', 'Sí, reiniciar');
      if (!ok) return;
      SCM.lms.emit('progress_reset', {});
      S.reset();
      go('#/inicio', true);
    });
    return wrap;
  }

  /* ---------- Enrutador ---------- */
  function parse() {
    const h = location.hash.replace(/^#\/?/, '');
    const parts = h.split('/');
    if (parts[0] === 'm') {
      const m = M[(+parts[1] || 1) - 1];
      if (!m) return { name: 'home' };
      const s = Math.min(Math.max((+parts[2] || 1) - 1, 0), m.screens.length - 1);
      return { name: 'module', m, s };
    }
    if (parts[0] === 'examen') return { name: 'exam' };
    if (parts[0] === 'resultados') return { name: 'results' };
    if (parts[0] === 'certificado') return { name: 'cert' };
    return { name: 'home' };
  }

  function go(href, force) {
    if (location.hash === href && !force) render();
    else if (location.hash === href) render();
    else location.hash = href;
  }

  function render() {
    let route = parse();
    // Reglas de acceso
    if (route.name === 'module') {
      if (!moduleUnlocked(route.m)) {
        SCM.ui.toast('Completa el módulo anterior para desbloquear este', 'lock');
        location.replace(resumeHref()); return;
      }
      const reach = firstPending(route.m);
      if (route.s > reach && !S.isScreenDone(key(route.m, route.s))) {
        location.replace(`#/m/${route.m.number}/${reach + 1}`); return;
      }
    }
    const st = S.get();
    st.lastRoute = location.hash; S.save();
    openDrawer(false);
    $main.innerHTML = '';
    $shell.classList.toggle('no-sidebar', route.name === 'home');
    $menuBtn.style.visibility = route.name === 'home' ? 'hidden' : '';
    if (route.name === 'home') $main.appendChild(renderHome());
    else if (route.name === 'module') $main.appendChild(renderModule(route));
    else if (route.name === 'exam') SCM.exam.render($main);
    else if (route.name === 'results') $main.appendChild(renderResults());
    else if (route.name === 'cert') SCM.certificate.render($main);
    if (route.name !== 'home') renderSidebar(route);
    refreshChrome();
    const titles = { home: 'Inicio', exam: 'Evaluación final', results: 'Mis resultados', cert: 'Certificado' };
    document.title = (route.name === 'module' ? `M${route.m.number} · ${route.m.screens[route.s].title || route.m.title}` : titles[route.name]) + ' · Servicio al Cliente Mirage';
    window.scrollTo(0, 0);
    $main.focus({ preventScroll: true });
  }

  window.addEventListener('hashchange', render);
  $menuBtn.innerHTML = I('menu');

  SCM.app = { refresh: render, refreshChrome, resumeHref, go };
  render();
})();

</script>
</body>
</html>
