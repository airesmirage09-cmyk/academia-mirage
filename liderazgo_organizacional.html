   {a:'1950s',t:'Rasgos y conducta',d:'Se busca al \"líder nato\". Ohio y Michigan estudian conductas observables.'},\n   {a:'1960s',t:'Drucker y la eficacia',d:'La dirección se vuelve una disciplina con resultados medibles.'},\n   {a:'1970s',t:'Situacional',d:'Hersey y Blanchard: no hay un estilo único, depende de la persona.'},\n   {a:'1980s',t:'Transformacional',d:'Burns y Bass: liderar es elevar a la gente, no intercambiar favores.'},\n   {a:'1990s',t:'Inteligencia emocional',d:'Goleman demuestra el peso del clima emocional en el resultado.'},\n   {a:'2000s+',t:'Propósito y cultura',d:'Collins, Schein, Lencioni y Sinek: liderazgo como sistema colectivo.'}]},\n {tipo:'cita',frase:'No hay nada tan inútil como hacer con gran eficiencia algo que no debería hacerse en absoluto.',autor:'Peter F. Drucker',obra:'El ejecutivo eficaz'},\n {tipo:'leccion',kicker:'Microlección 2 · 7 min',titulo:'Kotter: los tres actos del liderazgo',texto:'Kotter reduce el liderazgo a tres movimientos encadenados. Si falta uno, el cambio no ocurre.',cards:[\n   {n:'01',t:'Fijar rumbo',d:'No es un plan detallado: es una dirección que la gente puede repetir de memoria.'},\n   {n:'02',t:'Alinear personas',d:'Comunicar hasta que cada técnico y cada vendedor sepa qué parte le toca.'},\n   {n:'03',t:'Motivar',d:'Conectar la meta con lo que le importa a la persona, no con lo que le importa al reporte.'}]},\n {tipo:'vf',titulo:'Mitos del liderazgo',texto:'Marca cada afirmación como verdadera o falsa.',items:[\n   {t:'El líder debe ser el mejor técnico de su equipo.',v:false,fb:'Falso. Ser el mejor técnico es una trampa: te vuelve indispensable en la tarea y ausente en la dirección.'},\n   {t:'Liderar y administrar son actividades complementarias, no opuestas.',v:true,fb:'Verdadero. Kotter insiste: una organización necesita las dos, en proporción según el momento.'},\n   {t:'El liderazgo se ejerce solo desde un puesto jerárquico.',v:false,fb:'Falso. La autoridad da poder formal; el liderazgo se gana con influencia y credibilidad.'},\n   {t:'Un buen líder evita el conflicto para mantener el clima.',v:false,fb:'Falso. Evitar el conflicto necesario deteriora el clima a mediano plazo.'},\n   {t:'La eficacia se mide por resultados, no por horas trabajadas.',v:true,fb:'Verdadero. Es el criterio central de Drucker.'}]},\n {tipo:'infografia',titulo:'El líder Mirage en 6 conductas',sub:'Traducción operativa de los modelos de Drucker y Kotter',bloques:[\n   {n:'01',t:'Da rumbo',d:'Cada lunes su equipo sabe cuál es la prioridad de la semana y por qué.'},\n   {n:'02',t:'Delega la tarea, no la responsabilidad',d:'Suelta el desarmador y sostiene el estándar.'},\n   {n:'03',t:'Decide con dato',d:'Tiempos de respuesta, reincidencias y satisfacción del cliente sobre la mesa.'},\n   {n:'04',t:'Desarrolla',d:'Cada trimestre alguien de su equipo sabe hacer algo que antes no sabía.'},\n   {n:'05',t:'Protege el estándar',d:'No negocia la seguridad ni la calidad de instalación por urgencia.'},\n   {n:'06',t:'Reconoce en público',d:'Nombra la conducta específica, no un elogio genérico.'}]},\n {tipo:'flashcards',titulo:'Tarjetas de memoria',texto:'Toca cada tarjeta para revelar la definición.',cards:[\n   {f:'Eficacia',b:'Hacer las cosas correctas. Se decide antes de actuar.'},\n   {f:'Eficiencia',b:'Hacer bien las cosas. Se mide durante la ejecución.'},\n   {f:'Fijar rumbo',b:'Definir la dirección y la visión del cambio (Kotter).'},\n   {f:'Alinear',b:'Comunicar el rumbo hasta que la gente actúe en la misma dirección.'},\n   {f:'Autoridad',b:'Poder que otorga el puesto. Se recibe.'},\n   {f:'Influencia',b:'Capacidad de movilizar sin usar el puesto. Se gana.'}]},\n {tipo:'caso',empresa:'Toyota',etiqueta:'Caso real',titulo:'El líder que va al lugar donde ocurre el trabajo',contexto:'Toyota construyó su sistema de producción sobre una idea incómoda para el mando tradicional: el líder no dirige desde el escritorio, va al piso a ver el problema con sus propios ojos y pregunta antes de ordenar. El supervisor deja de ser un vigilante y se convierte en desarrollador de personas.',aprendizaje:'La autoridad se sostiene con presencia y con preguntas, no con reportes.',traslado:'En Mirage: acompañar una instalación completa al mes con una cuadrilla distinta, sin corregir en el momento, y devolver observaciones después.',pregunta:'¿Cuándo fue la última vez que viste trabajar a tu equipo sin intervenir?'},\n {tipo:'escenario',etiqueta:'Escenario de decisión',titulo:'Primer día de temporada alta',situacion:'Son las 8:10 a.m. del primer calor fuerte del año. Tienes 34 servicios pendientes, dos técnicos incapacitados y el gerente regional pidiendo el reporte de ayer. Tu coordinador de servicio te pregunta qué hacer primero.',opciones:[\n   {t:'Tomas una camioneta y sales a cubrir los servicios más urgentes tú mismo.',ok:false,fb:'Resuelves el día y pierdes la semana. Mientras instalas, nadie está decidiendo prioridades ni ajustando rutas. Es la trampa del líder técnico.'},\n   {t:'Reúnes 10 minutos al equipo, defines criterio de prioridad y delegas el reporte al coordinador.',ok:true,fb:'Correcto. Fijas rumbo, alineas y liberas tu tiempo para decidir. Es exactamente la secuencia de Kotter aplicada a una mañana concreta.'},\n   {t:'Contestas primero el reporte del regional para quitarte la presión.',ok:false,fb:'Atiendes lo urgente ajeno antes de lo importante propio. El reporte puede esperar 30 minutos; el criterio del día, no.'}]},\n {tipo:'reto',etiqueta:'Reto práctico · 7 días',titulo:'Auditoría de tu semana',texto:'Durante cinco días registra tus bloques de dos horas y clasifícalos: administrar o liderar. Al final, calcula el porcentaje.',pasos:[\n   'Anota cada bloque de 2 horas y clasifícalo con una sola letra: A o L.',\n   'El viernes suma y calcula tu proporción real.',\n   'Identifica una actividad de administración que puedas delegar la próxima semana.',\n   'Escribe aquí tu compromiso concreto y con quién lo vas a delegar.']},\n {tipo:'resumen',titulo:'Resumen visual del módulo',puntos:[\n   {t:'Administrar produce orden; liderar produce movimiento. Necesitas ambos.'},\n   {t:'Eficacia antes que eficiencia: primero lo correcto, después lo rápido.'},\n   {t:'El liderazgo de Kotter son tres actos: rumbo, alineación y motivación.'},\n   {t:'La autoridad se recibe con el puesto; la influencia se gana con conducta.'},\n   {t:'Si eres indispensable en la tarea, eres prescindible en la dirección.'}]},\n {tipo:'quiz',titulo:'Evaluación del módulo 1',texto:'8 reactivos · mínimo aprobatorio 80%',preguntas:[\n   {p:'Según Drucker, la eficacia consiste en:',ops:['Hacer las cosas con el menor costo posible','Hacer las cosas correctas','Cumplir el procedimiento al pie de la letra','Trabajar más horas que el equipo'],ok:1,fb:'La eficacia es hacer lo correcto; la eficiencia es hacerlo bien.'},\n   {p:'¿Cuál de estas es una función de administración según Kotter?',ops:['Fijar la visión del área','Inspirar al equipo','Planear y presupuestar','Alinear a la gente con el rumbo'],ok:2,fb:'Planear y presupuestar es administración: produce orden y previsibilidad.'},\n   {p:'Los tres actos del liderazgo de Kotter son:',ops:['Planear, organizar, controlar','Fijar rumbo, alinear, motivar','Medir, corregir, reportar','Delegar, supervisar, evaluar'],ok:1,fb:'Rumbo, alineación y motivación: en ese orden.'},\n   {p:'Un supervisor que cubre personalmente los servicios más difíciles todos los días:',ops:['Demuestra liderazgo con el ejemplo','Optimiza el recurso más capaz','Está administrando su propia tarea y dejando de dirigir','Reduce el riesgo operativo'],ok:2,fb:'El ejemplo puntual enseña; hacerlo todos los días sustituye a la dirección.'},\n   {p:'La diferencia entre autoridad e influencia es que:',ops:['Son sinónimos en la práctica','La autoridad se gana y la influencia se otorga','La autoridad la da el puesto y la influencia se gana con conducta','La influencia solo existe en niveles directivos'],ok:2,fb:'El puesto da autoridad; la conducta consistente da influencia.'},\n   {p:'Administración produce orden y previsibilidad. Liderazgo produce:',ops:['Control y disciplina','Cambio y movimiento','Reportes y métricas','Estabilidad de procesos'],ok:1,fb:'Ese es el contraste central del modelo de Kotter.'},\n   {p:'En temporada alta, la primera responsabilidad del líder es:',ops:['Ejecutar los servicios más críticos','Definir el criterio de prioridad y alinear al equipo','Contestar de inmediato a la dirección regional','Reforzar el control de asistencia'],ok:1,fb:'Primero el criterio: sin él, cada quien prioriza distinto.'},\n   {p:'La pregunta de Drucker que ordena tu agenda es:',ops:['¿Cómo hago esto más rápido?','¿Qué debo hacer yo que nadie más en mi área puede hacer?','¿Quién es responsable de este error?','¿Cuánto cuesta esta decisión?'],ok:1,fb:'Es el filtro para separar lo delegable de lo indelegable.'}]}\n],\n2:[\n {tipo:'portada',kicker:'Módulo 02 · Bloque I',titulo:'Autoliderazgo',sub:'Hábitos, foco y credibilidad',texto:'Nadie dirige a otros mejor de lo que se dirige a sí mismo. Covey aporta el sistema de hábitos; Goldsmith, el espejo incómodo de las conductas que hoy te limitan.',meta:'60 min · 6 microlecciones · 120 XP'},\n {tipo:'objetivos',titulo:'Al terminar este módulo podrás',items:[\n   'Ubicar tus actividades en la matriz de urgencia e importancia y rebalancearlas.',\n   'Reconocer dos hábitos que hoy limitan tu credibilidad como líder.',\n   'Solicitar feedforward de forma estructurada a tu equipo.']},\n {tipo:'gancho',dato:'48%',titulo:'del tiempo de un mando medio se consume en asuntos urgentes que no son importantes.',texto:'Son las interrupciones que se sienten productivas: llamadas que alguien más podría atender, autorizaciones que no requieren tu criterio, incendios que se repiten porque nadie los previno.',pregunta:'¿Cuál de tus urgencias de ayer no debería haber llegado a tu escritorio?'},\n {tipo:'leccion',kicker:'Microlección 1 · 6 min',titulo:'Covey: de la dependencia a la interdependencia',texto:'Los siete hábitos no son consejos aislados: son una progresión. Primero te haces cargo de ti, después construyes con otros, y solo entonces sostienes el desempeño en el tiempo.',cards:[\n   {n:'01',t:'Independencia',d:'Hábitos 1 a 3: proactividad, propósito y prioridades. La victoria privada.'},\n   {n:'02',t:'Interdependencia',d:'Hábitos 4 a 6: ganar-ganar, escuchar primero y sinergia. La victoria pública.'},\n   {n:'03',t:'Renovación',d:'Hábito 7: afilar la sierra. Sin esto, los seis anteriores se desgastan.'}]},\n {tipo:'infografia',titulo:'Los 7 hábitos aplicados a tu operación',sub:'Traducción práctica al día de un líder de servicio y venta',bloques:[\n   {n:'01',t:'Sé proactivo',d:'Anticipa la falla recurrente en lugar de celebrar la reparación rápida.'},\n   {n:'02',t:'Empieza con el fin en mente',d:'Define cómo quieres que se vea tu área en 90 días antes de mover el rol.'},\n   {n:'03',t:'Primero lo primero',d:'Bloquea en agenda lo importante no urgente: formación, seguimiento, prevención.'},\n   {n:'04',t:'Piensa en ganar-ganar',d:'Diseña metas de sucursal donde servicio y ventas no compitan entre sí.'},\n   {n:'05',t:'Busca entender primero',d:'Antes de corregir al técnico, pregunta qué encontró en sitio.'},\n   {n:'06',t:'Sinergiza',d:'Junta a instalación y postventa a resolver la reincidencia juntos.'},\n   {n:'07',t:'Afila la sierra',d:'Una hora semanal de formación propia, sin excepción.'}]},\n {tipo:'clasificar',titulo:'Ubica cada actividad en su cuadrante',texto:'Toca la actividad y después el cuadrante que le corresponde. Recuerda: importante es lo que mueve el resultado; urgente es lo que grita.',cubetas:['I · Urgente e importante','II · Importante, no urgente','III · Urgente, no importante','IV · Ni urgente ni importante'],items:[\n   {t:'Falla crítica en el cuarto frío de un cliente clave',c:0},\n   {t:'Formar al técnico nuevo antes de temporada alta',c:1},\n   {t:'Llamada de un proveedor para confirmar un dato que tiene tu asistente',c:2},\n   {t:'Revisar cadenas de correo en las que solo estás copiado',c:3},\n   {t:'Diseñar el plan de mantenimiento preventivo del próximo trimestre',c:1},\n   {t:'Reclamo de un cliente que amenaza con cancelar hoy',c:0},\n   {t:'Reunión sin agenda que se repite cada semana',c:3},\n   {t:'Interrupción para autorizar un gasto menor ya presupuestado',c:2}]},\n {tipo:'cita',frase:'La clave no es priorizar lo que está en tu agenda, sino agendar tus prioridades.',autor:'Stephen R. Covey',obra:'Los 7 hábitos de la gente altamente efectiva'},\n {tipo:'leccion',kicker:'Microlección 2 · 7 min',titulo:'Goldsmith: lo que te trajo aquí no te llevará allá',texto:'Las conductas que te hicieron destacar como técnico o vendedor pueden ser exactamente las que te frenan como líder. Goldsmith identifica veinte; estas tres son las más frecuentes en mandos operativos.',cards:[\n   {n:'01',t:'Ganar demasiado',d:'Necesitar tener razón incluso en discusiones irrelevantes.'},\n   {n:'02',t:'Agregar demasiado valor',d:'Mejorar toda idea ajena hasta que deja de ser del otro.'},\n   {n:'03',t:'Retener información',d:'Guardar el dato como fuente de poder en lugar de compartirlo.'}]},\n {tipo:'completar',titulo:'Completa los principios',texto:'Toca la frase y después la palabra correcta del banco.',opciones:['feedforward','proactivo','confianza','prioridades','escuchar'],frases:[\n   {pre:'A diferencia del feedback, que juzga el pasado, el',ok:0,post:'propone conductas futuras y no admite defensa.'},\n   {pre:'Ser',ok:1,post:'significa actuar sobre lo que está en tu círculo de influencia, no sobre lo que solo te preocupa.'},\n   {pre:'La credibilidad del líder se construye con consistencia entre lo que dice y lo que hace: eso es',ok:2,post:'.'},\n   {pre:'Agendar tus',ok:3,post:'es lo contrario a priorizar lo que ya está en tu agenda.'}]},\n {tipo:'vf',titulo:'Mitos de la productividad del líder',texto:'Marca cada afirmación como verdadera o falsa.',items:[\n   {t:'Estar disponible todo el tiempo es una virtud del buen líder.',v:false,fb:'Falso. La disponibilidad total garantiza que tu agenda la escriban los demás.'},\n   {t:'El cuadrante II (importante, no urgente) es donde se gana el mediano plazo.',v:true,fb:'Verdadero. Prevención, formación y planeación viven ahí.'},\n   {t:'Agregar tu mejora a cada idea del equipo aumenta el compromiso.',v:false,fb:'Falso. Goldsmith lo advierte: mejoras la idea 5% y reduces el compromiso 50%.'},\n   {t:'El feedforward se pide sobre conductas futuras, no sobre errores pasados.',v:true,fb:'Verdadero. Por eso genera menos defensa y más acción.'},\n   {t:'Delegar una tarea también transfiere la responsabilidad del resultado.',v:false,fb:'Falso. Se delega la ejecución; la responsabilidad del estándar sigue siendo tuya.'}]},\n {tipo:'flashcards',titulo:'Tarjetas de memoria',texto:'Toca cada tarjeta para revelar la definición.',cards:[\n   {f:'Proactividad',b:'Actuar sobre tu círculo de influencia en lugar de reaccionar al de preocupación.'},\n   {f:'Cuadrante II',b:'Importante y no urgente: prevención, formación, planeación y relaciones.'},\n   {f:'Ganar-ganar',b:'Acuerdo donde ambas partes obtienen resultado; no es ceder a medias.'},\n   {f:'Feedforward',b:'Sugerencias sobre conductas futuras. No se discute, se agradece.'},\n   {f:'Afilar la sierra',b:'Renovación deliberada: física, mental, social y de propósito.'},\n   {f:'Cuenta bancaria emocional',b:'Reserva de confianza que se llena con cumplimiento y se vacía con incongruencia.'}]},\n {tipo:'caso',empresa:'Microsoft',etiqueta:'Caso real',titulo:'Dejar de tener razón para empezar a aprender',contexto:'Cuando Satya Nadella tomó la dirección de Microsoft, la empresa era conocida internamente por una cultura de \"sabelotodos\" que competían entre áreas. Su intervención central no fue tecnológica: cambió el estándar de conducta directiva de demostrar conocimiento a demostrar aprendizaje, y pidió a sus líderes escuchar antes de responder.',aprendizaje:'La credibilidad del líder crece cuando deja de necesitar ganar cada conversación.',traslado:'En Mirage: entrar a la junta semanal con dos preguntas preparadas en lugar de dos correcciones.',pregunta:'¿En qué conversación de la semana pasada necesitaste tener razón?'},\n {tipo:'comparativo',titulo:'Feedback y feedforward',sub:'Marco de Marshall Goldsmith',izqT:'Feedback',izq:['Habla del pasado','Evalúa lo que ya ocurrió','Genera defensa y justificación','Suele darlo solo el jefe','Se recibe con tensión'],derT:'Feedforward',der:['Habla del futuro','Sugiere conductas concretas','No se discute: se agradece','Puede pedirse a cualquiera','Se recibe con apertura']},\n {tipo:'escenario',etiqueta:'Escenario de decisión',titulo:'La junta que siempre se descarrila',situacion:'Es la junta semanal de sucursal. En los primeros diez minutos ya cambiaste tres veces el tema: un reclamo de cliente, una factura pendiente y una queja entre técnicos. Tu coordinadora te mira esperando que ordenes la conversación.',opciones:[\n   {t:'Resuelves los tres temas ahí mismo para que nadie se vaya con pendientes.',ok:false,fb:'Resolver todo en la junta la convierte en la oficina de urgencias del área. La reunión pierde su función y tú pierdes 40 minutos.'},\n   {t:'Defines una agenda de tres puntos con tiempo asignado y mandas lo demás a un espacio de seguimiento uno a uno.',ok:true,fb:'Correcto. Aplicas \"primero lo primero\": la junta protege el cuadrante II y lo urgente encuentra otro canal.'},\n   {t:'Cancelas la junta porque hoy hay demasiada operación.',ok:false,fb:'Cancelar la junta libera una hora hoy y te cuesta la alineación de la semana. Es el patrón que mantiene todo en modo urgencia.'}]},\n {tipo:'reto',etiqueta:'Reto práctico · 7 días',titulo:'Pide feedforward a tres personas',texto:'Elige a un colaborador, un par y tu jefe directo. A cada uno formula la misma pregunta y solo escucha: sin explicar, sin defender, sin justificar.',pasos:[\n   'Pregunta: \"¿Qué dos conductas concretas podría cambiar para dirigir mejor a este equipo el próximo trimestre?\".',\n   'Anota las respuestas literales, sin interpretarlas.',\n   'Agradece y no argumentes. Es la parte difícil.',\n   'Escribe aquí el patrón que se repitió y la conducta que vas a cambiar.']},\n {tipo:'resumen',titulo:'Resumen visual del módulo',puntos:[\n   {t:'El autoliderazgo antecede al liderazgo: primero la victoria privada.'},\n   {t:'Lo importante no urgente es el único cuadrante que reduce urgencias futuras.'},\n   {t:'Ganar demasiado y agregar valor de más son las trampas más comunes del mando técnico.'},\n   {t:'El feedforward pide conductas futuras: no se discute, se agradece.'},\n   {t:'La credibilidad es la distancia entre lo que dices y lo que haces.'}]},\n {tipo:'quiz',titulo:'Evaluación del módulo 2',texto:'8 reactivos · mínimo aprobatorio 80%',preguntas:[\n   {p:'El cuadrante II de la matriz de Covey corresponde a actividades:',ops:['Urgentes e importantes','Importantes y no urgentes','Urgentes y no importantes','Ni urgentes ni importantes'],ok:1,fb:'Es el cuadrante de la prevención, la formación y la planeación.'},\n   {p:'Ser proactivo, según Covey, significa:',ops:['Adelantarse a responder los correos','Actuar sobre tu círculo de influencia','Trabajar más horas','Anticipar lo que pedirá tu jefe'],ok:1,fb:'Influencia, no preocupación: ahí está la diferencia.'},\n   {p:'\"Agregar demasiado valor\" es problemático porque:',ops:['Consume tiempo del líder','Mejora poco la idea y reduce mucho el compromiso','Molesta al jefe directo','Genera dependencia técnica'],ok:1,fb:'La idea gana un poco; el dueño de la idea pierde mucho.'},\n   {p:'La diferencia central entre feedback y feedforward es:',ops:['Quién lo entrega','El tono con que se dice','Pasado evaluado frente a futuro sugerido','La formalidad del registro'],ok:2,fb:'El feedforward no se discute porque aún no ha ocurrido.'},\n   {p:'Los hábitos 4, 5 y 6 de Covey corresponden a:',ops:['La victoria privada','La interdependencia','La renovación','La proactividad'],ok:1,fb:'Ganar-ganar, entender primero y sinergia: construir con otros.'},\n   {p:'Al delegar una tarea, el líder transfiere:',ops:['La ejecución, no la responsabilidad del estándar','La responsabilidad completa','El riesgo del error','La autoridad formal'],ok:0,fb:'Se suelta el desarmador; se sostiene el estándar.'},\n   {p:'Una junta semanal que resuelve urgencias operativas cada vez:',ops:['Aprovecha bien el tiempo del equipo','Sustituye la alineación por la urgencia','Fortalece la confianza','Reduce las interrupciones'],ok:1,fb:'Pierde su función: alinear rumbo y dar seguimiento.'},\n   {p:'\"Afilar la sierra\" se refiere a:',ops:['Revisar los indicadores','Renovarte de forma deliberada y periódica','Corregir al equipo a tiempo','Actualizar los procedimientos'],ok:1,fb:'Sin renovación, los otros seis hábitos se desgastan.'}]}\n],\n3:[\n {tipo:'portada',kicker:'Módulo 03 · Bloque I',titulo:'Inteligencia emocional',sub:'Y los seis estilos de liderazgo',texto:'Goleman demostró con datos lo que la operación ya sabía: el estado de ánimo del jefe se contagia, y ese contagio se paga o se cobra en el resultado del mes.',meta:'60 min · 7 microlecciones · 120 XP'},\n {tipo:'objetivos',titulo:'Al terminar este módulo podrás',items:[\n   'Nombrar tus detonadores emocionales y su efecto en el clima del equipo.',\n   'Elegir el estilo de liderazgo adecuado según la situación y no por costumbre.',\n   'Conducir una conversación difícil sin escalar el conflicto.']},\n {tipo:'gancho',dato:'70%',titulo:'de la percepción del clima laboral se explica por la conducta del jefe directo.',texto:'No por la empresa, ni por el sueldo, ni por las instalaciones: por la persona que dirige el turno. Y el clima explica una parte medible del desempeño del equipo.',pregunta:'Si tu equipo describiera tu estado de ánimo típico en una palabra, ¿cuál sería?'},\n {tipo:'leccion',kicker:'Microlección 1 · 6 min',titulo:'Los cuatro dominios de la inteligencia emocional',texto:'Goleman ordena la competencia emocional en cuatro dominios que se construyen en secuencia: no puedes gestionar lo que no reconoces, ni influir en quien no entiendes.',cards:[\n   {n:'01',t:'Autoconciencia',d:'Reconocer qué sientes y cómo se ve desde fuera, en el momento.'},\n   {n:'02',t:'Autogestión',d:'Elegir la respuesta en lugar de ejecutar la reacción.'},\n   {n:'03',t:'Conciencia social',d:'Leer el estado del equipo y la política real de la organización.'},\n   {n:'04',t:'Gestión de relaciones',d:'Influir, desarrollar y resolver conflicto sin dejar residuo.'}]},\n {tipo:'infografia',titulo:'Los seis estilos de liderazgo',sub:'Cada uno tiene su momento; ninguno funciona siempre',bloques:[\n   {n:'01',t:'Visionario',d:'Moviliza hacia una visión. Útil cuando hace falta rumbo nuevo. Impacto en clima: muy positivo.'},\n   {n:'02',t:'Coaching',d:'Desarrolla a la persona a mediano plazo. Ideal con talento con potencial. Impacto: positivo.'},\n   {n:'03',t:'Afiliativo',d:'Crea vínculo y armonía. Sirve para reparar confianza. Impacto: positivo.'},\n   {n:'04',t:'Democrático',d:'Construye acuerdo y compromiso. Requiere equipo competente. Impacto: positivo.'},\n   {n:'05',t:'Marcapasos',d:'Exige excelencia inmediata con el propio ejemplo. Desgasta si se abusa. Impacto: negativo.'},\n   {n:'06',t:'Autoritario',d:'Ordena y controla. Solo en crisis o riesgo real. Impacto: muy negativo si es permanente.'}]},\n {tipo:'relacionar',titulo:'¿Qué estilo pide cada situación?',texto:'Toca la situación y después el estilo que corresponde.',orden:[3,0,5,2,4,1],pares:[\n   {a:'Abres una sucursal nueva y nadie tiene claro el rumbo',b:'Visionario'},\n   {a:'Un técnico con potencial comete errores por falta de método',b:'Coaching'},\n   {a:'El equipo quedó dividido tras un despido difícil',b:'Afiliativo'},\n   {a:'Hay que definir el nuevo protocolo de instalación y el equipo domina el tema',b:'Democrático'},\n   {a:'Un cliente estratégico exige resultado en 48 horas y el equipo es experto',b:'Marcapasos'},\n   {a:'Fuga de gas refrigerante con riesgo para el personal',b:'Autoritario'}]},\n {tipo:'comparativo',titulo:'Estilos que construyen y estilos que desgastan',sub:'Uso sostenido en el tiempo, según Goleman',izqT:'Desgastan el clima si son permanentes',izq:['Marcapasos: el estándar es imposible y nadie lo dice','Autoritario: se obedece y se deja de pensar','Se sostiene el resultado del mes y se pierde la gente','Rotación alta de personal técnico','Nadie reporta el error temprano'],derT:'Construyen clima y resultado',der:['Visionario: la gente sabe hacia dónde y por qué','Coaching: el equipo crece de trimestre a trimestre','Afiliativo: existe confianza para reportar problemas','Democrático: el acuerdo se cumple sin vigilancia','El resultado se sostiene sin ti presente']},\n {tipo:'cita',frase:'El gran líder mueve a las personas. Enciende nuestra pasión e inspira lo mejor de nosotros.',autor:'Daniel Goleman',obra:'El líder resonante crea más'},\n {tipo:'leccion',kicker:'Microlección 2 · 6 min',titulo:'Autogestión: los seis segundos que te separan del error',texto:'El impulso emocional tarda unos segundos en atravesar el cerebro racional. Ese intervalo es todo el margen que tienes entre reaccionar y elegir.',cards:[\n   {n:'01',t:'Detecta',d:'Nombra la emoción en silencio: \"estoy molesto por la reincidencia\".'},\n   {n:'02',t:'Detén',d:'No respondas el mensaje, no levantes la voz, no decidas. Seis segundos.'},\n   {n:'03',t:'Decide',d:'Elige la conducta que sostendría tu credibilidad si el equipo la viera grabada.'}]},\n {tipo:'clasificar',titulo:'Clasifica cada conducta por dominio',texto:'Toca la conducta y después el dominio de inteligencia emocional al que pertenece.',cubetas:['Autoconciencia','Autogestión','Empatía','Habilidad social'],items:[\n   {t:'Notar que tu tono subió antes de que el equipo se tense',c:0},\n   {t:'Posponer una respuesta por escrito hasta bajar la molestia',c:1},\n   {t:'Preguntar al técnico qué encontró antes de opinar',c:2},\n   {t:'Reunir a dos áreas enfrentadas y facilitar el acuerdo',c:3},\n   {t:'Reconocer que las juntas de cierre de mes te ponen ansioso',c:0},\n   {t:'Sostener el estándar sin levantar la voz ante un incumplimiento',c:1},\n   {t:'Detectar que un vendedor está desmotivado antes de que lo diga',c:2},\n   {t:'Comunicar una mala noticia cuidando la dignidad de la persona',c:3}]},\n {tipo:'vf',titulo:'Verdadero o falso',texto:'Marca cada afirmación como verdadera o falsa.',items:[\n   {t:'La inteligencia emocional es un rasgo fijo: se tiene o no se tiene.',v:false,fb:'Falso. Es un conjunto de competencias entrenables, a diferencia del coeficiente intelectual.'},\n   {t:'El estilo autoritario nunca debe usarse.',v:false,fb:'Falso. En crisis o riesgo real es el estilo correcto; el problema es volverlo permanente.'},\n   {t:'El estado emocional del jefe se contagia al equipo.',v:true,fb:'Verdadero. Es el fenómeno de resonancia que documenta Goleman.'},\n   {t:'El estilo marcapasos sostenido en el tiempo deteriora el clima.',v:true,fb:'Verdadero. El estándar se vuelve inalcanzable y el equipo deja de intentar.'},\n   {t:'Empatía significa estar de acuerdo con la otra persona.',v:false,fb:'Falso. Empatía es entender su posición; puedes entender y sostener una decisión distinta.'}]},\n {tipo:'flashcards',titulo:'Tarjetas de memoria',texto:'Toca cada tarjeta para revelar la definición.',cards:[\n   {f:'Autoconciencia',b:'Reconocer tu emoción y su efecto en los demás, en tiempo real.'},\n   {f:'Autogestión',b:'Elegir la respuesta en lugar de ejecutar el impulso.'},\n   {f:'Empatía',b:'Entender la posición del otro sin necesidad de compartirla.'},\n   {f:'Resonancia',b:'Contagio del estado emocional del líder al equipo.'},\n   {f:'Estilo visionario',b:'Moviliza con rumbo y sentido. El de mayor impacto positivo en clima.'},\n   {f:'Estilo marcapasos',b:'Exige excelencia con el propio ejemplo. Útil en dosis cortas.'}]},\n {tipo:'caso',empresa:'Southwest Airlines',etiqueta:'Caso real',titulo:'Contratar por actitud, entrenar la habilidad',contexto:'Southwest construyó su ventaja operativa sobre una decisión de personal poco común en la industria: seleccionar por disposición al trato y capacidad de trabajo en equipo, y enseñar después la parte técnica. Sus supervisores fueron evaluados no solo por puntualidad de vuelos, sino por el clima de sus cuadrillas.',aprendizaje:'La habilidad técnica se entrena en semanas; la disposición emocional, casi nunca.',traslado:'En Mirage: incorporar a la entrevista del técnico dos preguntas de trato al cliente y una de manejo de conflicto en cuadrilla.',pregunta:'¿A quién contrataste por habilidad técnica y hoy te cuesta trabajo dirigir?'},\n {tipo:'escenario',etiqueta:'Role play · toma de decisiones',titulo:'El técnico que contestó mal al cliente',situacion:'Un cliente llama molesto: tu técnico más capaz le respondió de forma cortante frente a su familia. Es la segunda vez en el mes. El técnico está en la sala, acaba de cerrar una jornada de once horas y sabe que vas a hablar con él.',opciones:[\n   {t:'Lo llamas de inmediato frente al equipo y le pones un límite claro para que quede el precedente.',ok:false,fb:'Corriges la conducta y destruyes la confianza. La exposición pública genera obediencia sin compromiso, justo lo que documenta Goleman del estilo autoritario mal usado.'},\n   {t:'Dejas pasar el tema: viene de once horas de trabajo y es tu mejor técnico.',ok:false,fb:'Evitar la conversación protege el clima de hoy y erosiona el estándar de mañana. La tercera vez ya será una política no escrita.'},\n   {t:'Lo escuchas en privado, preguntas qué ocurrió en sitio y después nombras el estándar y el acuerdo concreto.',ok:true,fb:'Correcto. Empatía primero, estándar después: entiendes el contexto sin negociar la conducta. Es el estilo coaching aplicado a un caso disciplinario.'}]},\n {tipo:'reto',etiqueta:'Reto práctico · 7 días',titulo:'Mapa de tus detonadores',texto:'Durante cinco días identifica las situaciones que disparan tu reacción y qué hiciste después. El objetivo no es dejar de sentir, es dejar de reaccionar.',pasos:[\n   'Registra cada episodio: qué pasó, qué sentiste, qué hiciste.',\n   'Identifica los tres detonadores que más se repiten.',\n   'Define para cada uno una conducta de reemplazo concreta y observable.',\n   'Escribe aquí tus tres detonadores y tu plan de manejo.']},\n {tipo:'resumen',titulo:'Resumen visual del módulo',puntos:[\n   {t:'El estado emocional del líder se contagia: es resonancia, no carácter.'},\n   {t:'Cuatro dominios en secuencia: autoconciencia, autogestión, empatía y relaciones.'},\n   {t:'Seis estilos disponibles; el error es tener uno solo.'},\n   {t:'Marcapasos y autoritario funcionan en dosis cortas y situaciones específicas.'},\n   {t:'Empatía no es acuerdo: entiendes el contexto y sostienes el estándar.'}]},\n {tipo:'quiz',titulo:'Evaluación del módulo 3',texto:'8 reactivos · mínimo aprobatorio 80%',preguntas:[\n   {p:'Los cuatro dominios de la inteligencia emocional son:',ops:['Rasgos, conductas, actitudes y valores','Autoconciencia, autogestión, conciencia social y gestión de relaciones','Visión, alineación, motivación y control','Escuchar, hablar, decidir y delegar'],ok:1,fb:'Se construyen en ese orden: de adentro hacia afuera.'},\n   {p:'¿Qué estilo es más adecuado cuando el equipo no tiene claro el rumbo?',ops:['Autoritario','Marcapasos','Visionario','Afiliativo'],ok:2,fb:'El visionario da dirección y sentido; es el de mayor impacto positivo en clima.'},\n   {p:'El estilo autoritario es apropiado cuando:',ops:['El equipo es experto y autónomo','Hay una crisis o riesgo inmediato','Se busca desarrollar talento','Hace falta reparar la confianza'],ok:1,fb:'En emergencia se ordena; el problema es quedarse ahí.'},\n   {p:'El estilo marcapasos usado de forma permanente:',ops:['Eleva el estándar del equipo','Deteriora el clima y desgasta a la gente','Genera compromiso duradero','Desarrolla la autonomía'],ok:1,fb:'El estándar se vuelve inalcanzable y el equipo deja de intentar.'},\n   {p:'Empatía, en el marco de Goleman, significa:',ops:['Estar de acuerdo con la otra persona','Evitar el conflicto','Entender la posición del otro sin necesariamente compartirla','Ceder ante la presión del equipo'],ok:2,fb:'Entiendes el contexto y aun así puedes sostener el estándar.'},\n   {p:'La autogestión se manifiesta cuando el líder:',ops:['Reprime lo que siente','Elige su respuesta en lugar de reaccionar','Evita las conversaciones tensas','Delega el conflicto a Recursos Humanos'],ok:1,fb:'No es negar la emoción: es decidir la conducta.'},\n   {p:'Ante un técnico que respondió mal a un cliente, la secuencia correcta es:',ops:['Corregir en público para fijar el precedente','Dejar pasar el episodio por su desempeño','Escuchar en privado y después nombrar el estándar','Reportarlo por escrito antes de hablar con él'],ok:2,fb:'Empatía primero, estándar después: sin negociar la conducta.'},\n   {p:'La resonancia del líder se refiere a:',ops:['Su capacidad de hablar en público','El contagio de su estado emocional al equipo','La claridad de sus instrucciones','Su reputación ante la dirección'],ok:1,fb:'Es el mecanismo por el que el jefe directo explica buena parte del clima.'}]}\n],\n4:[\n {tipo:'portada',kicker:'Módulo 04 · Bloque II',titulo:'Liderazgo situacional',sub:'Adaptar el estilo a cada persona',texto:'Hersey y Blanchard rompieron la búsqueda del estilo ideal: el estilo correcto depende del nivel de desarrollo de la persona en esa tarea concreta, no del carácter del jefe.',meta:'60 min · 6 microlecciones · 120 XP'},\n {tipo:'objetivos',titulo:'Al terminar este módulo podrás',items:[\n   'Diagnosticar el nivel de desarrollo de cada colaborador en una tarea específica.',\n   'Aplicar el estilo S1 a S4 correspondiente sin caer en tu estilo favorito.',\n   'Ajustar tu dirección conforme la persona madura en la tarea.']},\n {tipo:'gancho',dato:'1 estilo',titulo:'es lo que usa la mayoría de los jefes con todo su equipo, todo el tiempo.',texto:'El técnico nuevo recibe la misma autonomía que el instalador con quince años, y el experto recibe la misma supervisión que el aprendiz. Los dos rinden por debajo de su capacidad, por razones opuestas.',pregunta:'¿A quién de tu equipo estás supervisando de más y a quién de menos?'},\n {tipo:'leccion',kicker:'Microlección 1 · 7 min',titulo:'El nivel de desarrollo es por tarea, no por persona',texto:'Blanchard insiste en un punto que se suele omitir: la misma persona puede ser D4 instalando minisplits y D1 atendiendo una queja de garantía. El diagnóstico se hace tarea por tarea.',cards:[\n   {n:'D1',t:'Principiante entusiasta',d:'Poca competencia, alto compromiso. Sabe poco y quiere aprender.'},\n   {n:'D2',t:'Aprendiz desilusionado',d:'Algo de competencia, compromiso bajo. Descubrió que es más difícil de lo que creía.'},\n   {n:'D3',t:'Ejecutor capaz pero cauteloso',d:'Competencia alta, confianza variable. Sabe hacerlo, duda de sí mismo.'},\n   {n:'D4',t:'Experto autónomo',d:'Competencia y compromiso altos. Puede responder por el resultado.'}]},\n {tipo:'infografia',titulo:'Los cuatro estilos de dirección',sub:'A cada nivel de desarrollo le corresponde un estilo',bloques:[\n   {n:'S1',t:'Dirigir',d:'Instrucciones precisas y supervisión estrecha. Para D1: alta dirección, bajo apoyo.'},\n   {n:'S2',t:'Instruir',d:'Explicas el por qué, escuchas dudas y sigues decidiendo. Para D2: alta dirección y alto apoyo.'},\n   {n:'S3',t:'Apoyar',d:'Preguntas más de lo que indicas; la decisión se comparte. Para D3: baja dirección, alto apoyo.'},\n   {n:'S4',t:'Delegar',d:'Acuerdas resultado y fecha; sales del camino. Para D4: baja dirección y bajo apoyo.'},\n   {n:'!',t:'Error frecuente',d:'Delegar a un D1 y llamarlo confianza. El resultado es un error costoso y una persona desmoralizada.'},\n   {n:'!!',t:'Error inverso',d:'Supervisar a un D4 y llamarlo rigor. El resultado es un experto que se va con la competencia.'}]},\n {tipo:'relacionar',titulo:'Diagnostica y elige el estilo',texto:'Toca el perfil del colaborador y después el estilo que le corresponde.',orden:[2,0,3,1],pares:[\n   {a:'Técnico recién contratado, motivado, sin experiencia en línea blanca',b:'S1 · Dirigir con instrucciones precisas'},\n   {a:'Instalador con seis meses que empezó a cometer errores y se ve desanimado',b:'S2 · Instruir explicando el por qué'},\n   {a:'Vendedora competente que no se atreve a cerrar cuentas grandes sola',b:'S3 · Apoyar y compartir la decisión'},\n   {a:'Coordinador de servicio con ocho años y resultados sostenidos',b:'S4 · Delegar el resultado completo'}]},\n {tipo:'clasificar',titulo:'Ubica a cada colaborador en su nivel',texto:'Toca la descripción y después el nivel de desarrollo que corresponde para esa tarea.',cubetas:['D1','D2','D3','D4'],items:[\n   {t:'Aprendiz de su primera semana, entusiasmado con el puesto',c:0},\n   {t:'Técnico que ya sabe instalar pero se frustró con la carga de temporada',c:1},\n   {t:'Instalador experto que capacita a los nuevos por iniciativa propia',c:3},\n   {t:'Vendedor con buen dominio del producto que evita al cliente corporativo',c:2},\n   {t:'Auxiliar que pide instrucciones para cada paso y las sigue con gusto',c:0},\n   {t:'Coordinadora capaz que pregunta si su decisión fue la correcta',c:2},\n   {t:'Técnico con un año que dice que \"así no se puede trabajar\"',c:1},\n   {t:'Jefe de cuadrilla que responde por su resultado sin supervisión',c:3}]},\n {tipo:'comparativo',titulo:'Supervisar de más y de menos',sub:'Los dos errores del estilo único',izqT:'Supervisar de más a un experto',izq:['Revisas cada detalle de su trabajo','Pides reporte de lo que ya domina','La persona deja de proponer','Se siente desconfianza, no rigor','Termina buscando autonomía en otra empresa'],derT:'Supervisar de menos a un principiante',der:['Le entregas la tarea completa sin método','Asumes que preguntará si no sabe','El error aparece frente al cliente','Se siente abandono, no confianza','Termina creyendo que no sirve para el puesto']},\n {tipo:'cita',frase:'No hay nada tan desigual como tratar a todos por igual.',autor:'Ken Blanchard',obra:'Liderazgo situacional II'},\n {tipo:'vf',titulo:'Verdadero o falso',texto:'Marca cada afirmación como verdadera o falsa.',items:[\n   {t:'El nivel de desarrollo se diagnostica por persona, no por tarea.',v:false,fb:'Falso. La misma persona puede ser experta en una tarea y principiante en otra.'},\n   {t:'Delegar siempre es el estilo más maduro de liderazgo.',v:false,fb:'Falso. Delegar a quien no tiene competencia es abandono disfrazado de confianza.'},\n   {t:'El D2 requiere alta dirección y alto apoyo al mismo tiempo.',v:true,fb:'Verdadero. Necesita método y también aliento: es el punto donde más gente se pierde.'},\n   {t:'Un D3 necesita más instrucción técnica que respaldo.',v:false,fb:'Falso. Ya sabe hacerlo; lo que le falta es confianza. Necesita apoyo, no instrucciones.'},\n   {t:'El estilo debe ajustarse conforme la persona avanza en la tarea.',v:true,fb:'Verdadero. El estilo es dinámico: lo que funcionó hace tres meses ya no aplica.'}]},\n {tipo:'flashcards',titulo:'Tarjetas de memoria',texto:'Toca cada tarjeta para revelar la definición.',cards:[\n   {f:'Nivel de desarrollo',b:'Combinación de competencia y compromiso en una tarea específica.'},\n   {f:'S1 · Dirigir',b:'Alta dirección y bajo apoyo. Instrucciones precisas y seguimiento cercano.'},\n   {f:'S2 · Instruir',b:'Alta dirección y alto apoyo. Explicas el por qué y sostienes el ánimo.'},\n   {f:'S3 · Apoyar',b:'Baja dirección y alto apoyo. Preguntas, escuchas y decides con la persona.'},\n   {f:'S4 · Delegar',b:'Baja dirección y bajo apoyo. Acuerdas el resultado y te retiras.'},\n   {f:'Error de diagnóstico',b:'Usar el mismo estilo con todo el equipo por costumbre del líder.'}]},\n {tipo:'caso',empresa:'The Home Depot',etiqueta:'Caso real',titulo:'Certificar por niveles al asociado de piso',contexto:'La cadena estructuró el desarrollo del personal de piso por niveles de certificación: cada nivel habilita decisiones distintas frente al cliente y define cuánta supervisión recibe la persona. Un asociado recién certificado no atiende los mismos casos que uno avanzado, y su supervisor lo sabe con precisión.',aprendizaje:'Cuando el nivel de desarrollo está explícito, el estilo de dirección deja de ser una intuición del jefe.',traslado:'En Mirage: definir tres niveles de técnico con las decisiones que cada uno puede tomar sin consultar.',pregunta:'¿Tu equipo sabe qué puede decidir sin preguntarte?'},\n {tipo:'escenario',etiqueta:'Escenario de decisión',titulo:'El técnico nuevo y el cliente premium',situacion:'Tienes una instalación en la residencia de un cliente que representa el 8% de la facturación de la sucursal. Tu único técnico disponible entró hace tres semanas: es cuidadoso, motivado y todavía no ha instalado solo un sistema de esa capacidad.',opciones:[\n   {t:'Lo mandas solo: es la mejor forma de que aprenda y confíe en sí mismo.',ok:false,fb:'Estás delegando a un D1. El aprendizaje ocurrirá, pero el costo del error lo paga tu cliente más importante.'},\n   {t:'Cancelas y reprogramas hasta tener disponible a un técnico experto.',ok:false,fb:'Proteges la instalación y pierdes el servicio. Además no resuelves el problema de fondo: el técnico nuevo sigue sin desarrollarse.'},\n   {t:'Lo envías con instrucciones detalladas, un punto de control a media instalación y tú disponible por video.',ok:true,fb:'Correcto. Es S1 puro: alta dirección con supervisión estrecha. Proteges al cliente y desarrollas a la persona en la misma jugada.'}]},\n {tipo:'completar',titulo:'Completa los principios',texto:'Toca la frase y después la palabra correcta del banco.',opciones:['tarea','delegar','apoyo','dinámico'],frases:[\n   {pre:'El nivel de desarrollo se diagnostica siempre respecto a una',ok:0,post:'específica y no a la persona en general.'},\n   {pre:'Un colaborador D3 necesita sobre todo',ok:2,post:'porque ya tiene
