impopular sin perder credibilidad.']},\n {tipo:'gancho',dato:'¿Por qué?',titulo:'es la pregunta que casi ninguna instrucción operativa responde.',texto:'\"Cambia el protocolo de instalación\", \"usa el formato nuevo\", \"llega media hora antes en temporada\". El equipo cumple el qué, entiende el cómo y desconoce el por qué. Ahí se pierde el compromiso.',pregunta:'¿Podría tu técnico explicar por qué existe el estándar que le pides cumplir?'},\n {tipo:'leccion',kicker:'Microlección 1 · 6 min',titulo:'El círculo dorado',texto:'Sinek propone invertir el orden de la comunicación: la mayoría empieza por el qué, y los líderes que movilizan empiezan por el por qué.',cards:[\n   {n:'01',t:'Por qué',d:'La razón de existir del área. \"Que ninguna familia pase un verano sin confort.\"'},\n   {n:'02',t:'Cómo',d:'Los principios con los que trabajas. Instalación certificada, respuesta en 24 horas.'},\n   {n:'03',t:'Qué',d:'Lo que haces todos los días: instalar, reparar, vender, dar garantía.'}]},\n {tipo:'completar',titulo:'Completa los principios',texto:'Toca la frase y después la palabra correcta del banco.',opciones:['por qué','confianza','seguridad','último'],frases:[\n   {pre:'Las organizaciones que inspiran comunican primero el',ok:0,post:'y solo después el qué.'},\n   {pre:'El círculo de',ok:2,post:'es el perímetro dentro del cual la gente puede reportar un error sin miedo.'},\n   {pre:'Los líderes comen al',ok:3,post:': el beneficio del equipo antecede al del líder.'},\n   {pre:'La',ok:1,post:'no se declara en una junta: se acumula con cumplimiento sostenido.'}]},\n {tipo:'infografia',titulo:'El círculo de seguridad',sub:'Qué cambia cuando el equipo deja de sentirse en riesgo interno',bloques:[\n   {n:'01',t:'Dentro del círculo',d:'La energía se usa en resolver al cliente, no en cuidarse del jefe.'},\n   {n:'02',t:'Fuera del círculo',d:'La energía se usa en no ser culpado. El error se oculta hasta que estalla.'},\n   {n:'03',t:'Reportar temprano',d:'El costo de un error reportado a tiempo es una fracción del error escondido.'},\n   {n:'04',t:'Quién define el perímetro',d:'El jefe directo, con su reacción a la primera mala noticia del día.'},\n   {n:'05',t:'Señal de que existe',d:'Alguien te dice algo que no querías oír, sin que se lo preguntes.'},\n   {n:'06',t:'Señal de que no existe',d:'Todo está bien en la junta y mal en la operación.'}]},\n {tipo:'clasificar',titulo:'Conductas que construyen o destruyen confianza',texto:'Toca la conducta y después la columna a la que pertenece.',cubetas:['Construye confianza','Destruye confianza'],items:[\n   {t:'Reconocer frente al equipo que tu decisión fue equivocada',c:0},\n   {t:'Cambiar la prioridad sin explicar el motivo',c:1},\n   {t:'Sostener un acuerdo aunque cueste más de lo previsto',c:0},\n   {t:'Comentar el error de un técnico con otros compañeros',c:1},\n   {t:'Preguntar cómo llegó el problema antes de asignar culpa',c:0},\n   {t:'Prometer un cambio de horario y no darle seguimiento',c:1},\n   {t:'Defender al equipo ante un cliente que exige algo fuera del estándar',c:0},\n   {t:'Enterarse por otros de un problema que tu equipo ya conocía',c:1}]},\n {tipo:'comparativo',titulo:'Manipular o inspirar',sub:'Dos formas de obtener el mismo comportamiento',izqT:'Manipulación',izq:['Bono, promoción o amenaza','Funciona mientras dura el estímulo','Genera cumplimiento calculado','Hay que subir la dosis cada vez','El equipo negocia cada esfuerzo extra'],derT:'Inspiración',der:['Propósito, pertenencia y progreso','Funciona cuando nadie está mirando','Genera compromiso voluntario','Se sostiene con congruencia','El equipo aporta esfuerzo sin pedirlo']},\n {tipo:'cita',frase:'La gente no compra lo que haces, compra por qué lo haces.',autor:'Simon Sinek',obra:'Empieza con el por qué'},\n {tipo:'leccion',kicker:'Microlección 2 · 7 min',titulo:'Comunicar una decisión impopular',texto:'La credibilidad no se pierde por dar malas noticias, se pierde por darlas mal: sin contexto, sin lugar para la pregunta o con un optimismo que nadie cree.',cards:[\n   {n:'01',t:'Contexto primero',d:'Explica la situación real antes del anuncio. Nadie acepta una conclusión sin premisa.'},\n   {n:'02',t:'Sin adornos',d:'Di la parte incómoda con palabras simples. El equipo ya sabe que algo pasa.'},\n   {n:'03',t:'Qué sí controlan',d:'Cierra con lo que el equipo puede decidir. Sin agencia, el anuncio solo genera miedo.'}]},\n {tipo:'vf',titulo:'Verdadero o falso',texto:'Marca cada afirmación como verdadera o falsa.',items:[\n   {t:'El propósito de un área debe ser un enunciado corporativo extenso.',v:false,fb:'Falso. Si no se puede repetir de memoria, no orienta ninguna decisión.'},\n   {t:'La confianza del equipo se construye con congruencia sostenida.',v:true,fb:'Verdadero. Es acumulación de cumplimiento, no un discurso.'},\n   {t:'Ocultar la mala noticia protege el clima del equipo.',v:false,fb:'Falso. Retrasa el costo y destruye la credibilidad cuando se descubre.'},\n   {t:'Un incentivo económico produce compromiso duradero.',v:false,fb:'Falso. Produce cumplimiento mientras dura el incentivo.'},\n   {t:'Que alguien te diga algo que no querías oír es señal de confianza.',v:true,fb:'Verdadero. Es la mejor evidencia de que existe círculo de seguridad.'}]},\n {tipo:'flashcards',titulo:'Tarjetas de memoria',texto:'Toca cada tarjeta para revelar la definición.',cards:[\n   {f:'Círculo dorado',b:'Por qué, cómo y qué. Comunicar de adentro hacia afuera.'},\n   {f:'Círculo de seguridad',b:'Perímetro donde el equipo puede reportar errores sin castigo.'},\n   {f:'Propósito',b:'Razón de existir del área, repetible de memoria.'},\n   {f:'Manipulación',b:'Obtener conducta con premio o amenaza; se apaga con el estímulo.'},\n   {f:'Inspiración',b:'Obtener conducta con sentido; opera cuando nadie mira.'},\n   {f:'Congruencia',b:'Distancia cero entre lo que el líder dice y lo que hace.'}]},\n {tipo:'caso',empresa:'Patagonia',etiqueta:'Caso real',titulo:'El propósito como filtro de decisiones difíciles',contexto:'Patagonia construyó su reputación tomando decisiones que contradecían el interés comercial de corto plazo: reparar en lugar de reemplazar, recomendar comprar menos, retirar productos que no cumplían su estándar ambiental. El propósito no funcionó como frase de campaña, sino como criterio para decir no.',aprendizaje:'Un propósito sirve exactamente en la medida en que te obliga a rechazar algo rentable.',traslado:'En Mirage: si el propósito es el confort del cliente, no vender el equipo de mayor margen cuando no es el adecuado para el espacio.',pregunta:'¿A qué venta rentable tendría que renunciar tu área para ser congruente con su propósito?'},\n {tipo:'escenario',etiqueta:'Escenario de decisión',titulo:'La meta impopular de temporada',situacion:'La dirección extiende el horario de servicio a domingos durante los tres meses de mayor calor. Tu equipo lo va a resentir: varios trabajaron ya dos temporadas seguidas sin descanso completo. Tienes que anunciarlo mañana en la junta.',opciones:[\n   {t:'Lo presentas como una gran oportunidad de ingresos extra y evitas el tema del cansancio.',ok:false,fb:'El optimismo que ignora la realidad destruye credibilidad. El equipo sabe lo que cuesta un domingo en temporada.'},\n   {t:'Explicas el contexto del negocio, nombras el costo personal sin adornos y abres a que el equipo diseñe el esquema de rotación.',ok:true,fb:'Correcto. Contexto, honestidad y agencia: la decisión no cambia, pero el equipo participa en el cómo. Es liderar con el por qué.'},\n   {t:'Comunicas la instrucción por escrito para evitar la discusión en la junta.',ok:false,fb:'Evitas el momento incómodo y pierdes la oportunidad de dar contexto. El rumor llenará el espacio que dejaste vacío.'}]},\n {tipo:'reto',etiqueta:'Reto práctico · 7 días',titulo:'Escribe el por qué de tu área',texto:'Formula el propósito de tu área en dos frases que cualquier integrante pueda repetir. Después pruébalo: pregunta a tres personas qué entienden.',pasos:[\n   'Escribe el por qué: para qué existe tu área más allá de facturar.',\n   'Redúcelo a dos frases sin adjetivos vacíos.',\n   'Pregúntalo a tres personas del equipo y anota qué entendieron.',\n   'Escribe aquí la versión final y una decisión reciente que se justifique con ella.']},\n {tipo:'resumen',titulo:'Resumen visual del módulo',puntos:[\n   {t:'Comunica primero el por qué; el qué se cumple sin él, pero sin compromiso.'},\n   {t:'El propósito sirve cuando te obliga a rechazar algo rentable.'},\n   {t:'El círculo de seguridad lo define la reacción del jefe a la primera mala noticia.'},\n   {t:'La manipulación opera mientras dura el estímulo; la inspiración, cuando nadie mira.'},\n   {t:'Malas noticias: contexto, honestidad sin adornos y espacio de decisión.'}]},\n {tipo:'quiz',titulo:'Evaluación del módulo 6',texto:'8 reactivos · mínimo aprobatorio 80%',preguntas:[\n   {p:'El círculo dorado propone comunicar en el orden:',ops:['Qué, cómo, por qué','Por qué, cómo, qué','Cómo, qué, por qué','Por qué, qué, cómo'],ok:1,fb:'De adentro hacia afuera.'},\n   {p:'Un propósito de área es útil cuando:',ops:['Aparece en la pared de la oficina','Se puede repetir de memoria y sirve para decidir','Lo redacta la dirección general','Menciona la rentabilidad esperada'],ok:1,fb:'Si no orienta una decisión concreta, es decoración.'},\n   {p:'El círculo de seguridad se refiere a:',ops:['El protocolo de seguridad industrial','El perímetro donde se puede reportar un error sin castigo','El grupo cercano de confianza del jefe','La estabilidad del empleo'],ok:1,fb:'Y lo define la reacción del líder a la mala noticia.'},\n   {p:'La diferencia entre manipular e inspirar es que la manipulación:',ops:['Es más rápida y más barata','Funciona solo mientras dura el estímulo','Nunca funciona','Aplica solo a personal operativo'],ok:1,fb:'Y exige subir la dosis cada vez.'},\n   {p:'Al comunicar una decisión impopular, lo primero es:',ops:['El anuncio directo','El contexto que explica la decisión','El beneficio para el equipo','El plan de compensación'],ok:1,fb:'Nadie acepta una conclusión sin premisa.'},\n   {p:'Una señal de que existe confianza en tu equipo es:',ops:['Nadie cuestiona tus decisiones','Alguien te dice algo que no querías oír','Las juntas terminan antes','No hay quejas formales'],ok:1,fb:'El silencio no es señal de acuerdo.'},\n   {p:'Cerrar un anuncio difícil con lo que el equipo sí controla:',ops:['Diluye el mensaje','Da agencia y reduce la parálisis','Genera falsas expectativas','Es innecesario si la decisión es firme'],ok:1,fb:'Sin agencia, el anuncio solo produce miedo.'},\n   {p:'\"Los líderes comen al último\" significa que:',ops:['El líder debe ser austero','El beneficio del equipo antecede al del líder','Hay que delegar los privilegios','La jerarquía no importa'],ok:1,fb:'Es la conducta que sostiene el círculo de seguridad.'}]}\n],\n7:[\n {tipo:'portada',kicker:'Módulo 07 · Bloque III',titulo:'Cultura organizacional',sub:'Lo que nadie escribe pero todos obedecen',texto:'Schein demostró que la cultura no es el clima ni los valores del cuadro en la pared: son los supuestos compartidos que el grupo aprendió porque funcionaron, y que hoy nadie cuestiona.',meta:'60 min · 6 microlecciones · 120 XP'},\n {tipo:'objetivos',titulo:'Al terminar este módulo podrás',items:[\n   'Leer la cultura de tu área en sus tres niveles.',\n   'Detectar brechas entre el valor declarado y el valor practicado.',\n   'Usar los mecanismos del líder para reforzar la cultura que necesitas.']},\n {tipo:'gancho',dato:'3 niveles',titulo:'y solo uno es visible.',texto:'Los uniformes, los tableros y el discurso están a la vista. Debajo están los valores que se declaran. Y más abajo, los supuestos que realmente gobiernan la conducta: lo que el equipo aprendió que aquí sí se puede y qué no.',pregunta:'¿Qué regla no escrita conoce tu equipo y nunca aparecería en un manual?'},\n {tipo:'leccion',kicker:'Microlección 1 · 7 min',titulo:'El iceberg de Schein',texto:'La cultura opera en tres niveles de profundidad. La mayoría de los intentos de cambio fracasan porque intervienen el primero y no tocan el tercero.',cards:[\n   {n:'01',t:'Artefactos',d:'Lo visible: uniformes, tableros, distribución del taller, rituales de junta.'},\n   {n:'02',t:'Valores declarados',d:'Lo que la organización dice creer: seguridad primero, cliente al centro.'},\n   {n:'03',t:'Supuestos básicos',d:'Lo invisible y compartido: \"si te atrasas, es mejor no reportarlo\". Gobierna la conducta real.'}]},\n {tipo:'clasificar',titulo:'Excava el iceberg',texto:'Toca cada señal y clasifícala en el nivel de cultura al que pertenece.',cubetas:['Artefactos','Valores declarados','Supuestos básicos'],items:[\n   {t:'Los técnicos usan uniforme y credencial visible',c:0},\n   {t:'\"Aquí la seguridad está antes que la productividad\"',c:1},\n   {t:'Nadie detiene una instalación por falta de equipo de protección en temporada alta',c:2},\n   {t:'El tablero de indicadores en la entrada del almacén',c:0},\n   {t:'\"Somos una empresa donde se puede opinar\"',c:1},\n   {t:'En las juntas solo hablan los jefes; el resto asiente',c:2},\n   {t:'El ritual de arranque de turno con revisión de rutas',c:0},\n   {t:'Se asume que un error reportado tarde se castiga menos que uno reportado a tiempo',c:2}]},\n {tipo:'infografia',titulo:'Los seis mecanismos del líder',sub:'Cómo Schein explica que la cultura se transmite en la práctica',bloques:[\n   {n:'01',t:'A qué le pones atención',d:'Lo que mides y preguntas cada día define lo que importa.'},\n   {n:'02',t:'Cómo reaccionas a la crisis',d:'La conducta del líder bajo presión enseña más que cualquier manual.'},\n   {n:'03',t:'Qué recursos asignas',d:'El presupuesto revela la prioridad real, no la declarada.'},\n   {n:'04',t:'A quién promueves',d:'Cada promoción comunica la conducta que la organización premia.'},\n   {n:'05',t:'Qué modelas',d:'Tu conducta observable es el estándar de facto.'},\n   {n:'06',t:'Qué toleras',d:'La conducta que no corriges se convierte en política.'}]},\n {tipo:'comparativo',titulo:'Valor declarado y valor practicado',sub:'La brecha que el equipo detecta en la primera semana',izqT:'Lo que se declara',izq:['\"La seguridad es primero\"','\"El cliente está al centro\"','\"Aquí se puede proponer\"','\"Trabajamos en equipo\"','\"Formamos a nuestra gente\"'],derT:'Lo que se practica',der:['Se instala sin arnés cuando el día viene atrasado','Se cierra la venta aunque el equipo no sea el adecuado','La idea que incomoda no se vuelve a mencionar','Cada área protege su indicador','La capacitación se cancela en temporada alta']},\n {tipo:'cita',frase:'La única tarea de verdadera importancia para los líderes es la creación y la gestión de la cultura.',autor:'Edgar H. Schein',obra:'Cultura organizacional y liderazgo'},\n {tipo:'relacionar',titulo:'Relaciona el mecanismo con su señal',texto:'Toca la situación y después el mecanismo cultural que está operando.',orden:[2,0,3,1],pares:[\n   {a:'El jefe pregunta todos los días por tiempos de respuesta y nunca por reincidencias',b:'A qué le pone atención'},\n   {a:'Ante un reclamo grave, el líder busca al responsable antes de entender el proceso',b:'Cómo reacciona a la crisis'},\n   {a:'Se promueve al vendedor con mejor cifra y peor trato al equipo',b:'A quién promueve'},\n   {a:'Se deja pasar por tercera vez una instalación sin protocolo',b:'Qué tolera'}]},\n {tipo:'vf',titulo:'Verdadero o falso',texto:'Marca cada afirmación como verdadera o falsa.',items:[\n   {t:'La cultura es lo mismo que el clima organizacional.',v:false,fb:'Falso. El clima es la percepción del momento; la cultura son supuestos aprendidos y estables.'},\n   {t:'Los supuestos básicos suelen ser inconscientes para el propio grupo.',v:true,fb:'Verdadero. Por eso son tan difíciles de cambiar: nadie los discute porque nadie los ve.'},\n   {t:'Cambiar los artefactos visibles cambia la cultura.',v:false,fb:'Falso. Cambiar el uniforme o el tablero sin tocar los supuestos produce cinismo.'},\n   {t:'Lo que el líder tolera se convierte en política no escrita.',v:true,fb:'Verdadero. Es uno de los seis mecanismos de transmisión de Schein.'},\n   {t:'Las promociones son un mensaje cultural.',v:true,fb:'Verdadero. Comunican con precisión qué conducta premia la organización.'}]},\n {tipo:'flashcards',titulo:'Tarjetas de memoria',texto:'Toca cada tarjeta para revelar la definición.',cards:[\n   {f:'Artefactos',b:'Nivel visible: espacios, símbolos, rituales, lenguaje.'},\n   {f:'Valores declarados',b:'Lo que la organización dice creer y sostiene en público.'},\n   {f:'Supuestos básicos',b:'Creencias compartidas e inconscientes que gobiernan la conducta real.'},\n   {f:'Brecha cultural',b:'Distancia entre el valor declarado y el practicado.'},\n   {f:'Mecanismo de transmisión',b:'Conducta del líder que enseña cultura: atención, crisis, recursos, promoción, modelo, tolerancia.'},\n   {f:'Cinismo organizacional',b:'Efecto de cambiar lo visible sin tocar los supuestos.'}]},\n {tipo:'caso',empresa:'Costco',etiqueta:'Caso real',titulo:'El trato al empleado como ventaja competitiva',contexto:'Costco sostuvo durante décadas salarios y prestaciones por encima de su sector, contra la presión de analistas que exigían recortarlos. La decisión no se explicaba con un valor en la pared, sino con la asignación real de recursos: menos rotación, más experiencia en piso y mejor servicio, sostenidos por una convicción de la dirección que nadie tuvo que declarar.',aprendizaje:'La cultura se lee en el presupuesto y en las promociones, no en el discurso.',traslado:'En Mirage: revisar qué dice tu asignación de tiempo y recursos sobre lo que realmente priorizas.',pregunta:'Si alguien auditara tu presupuesto y tus últimas promociones, ¿qué diría que valora tu área?'},\n {tipo:'escenario',etiqueta:'Escenario de decisión',titulo:'El atajo que se volvió costumbre',situacion:'Descubres que en temporada alta las cuadrillas omiten el paso de verificación final para alcanzar más servicios por día. Nadie lo aprobó, pero todos lo hacen y los indicadores de productividad se ven mejor que nunca. Un cliente acaba de reportar una falla evitable.',opciones:[\n   {t:'Emites un recordatorio por escrito del procedimiento y refuerzas la supervisión.',ok:false,fb:'Intervienes el nivel visible. El supuesto de fondo —\"aquí la productividad vale más que la verificación\"— sigue intacto y el atajo volverá en la siguiente temporada.'},\n   {t:'Sancionas a la cuadrilla del cliente afectado para fijar el precedente.',ok:false,fb:'Castigas la conducta que la organización premió durante meses. El equipo aprenderá a ocultar mejor, no a verificar.'},\n   {t:'Reconoces públicamente que la meta de productividad indujo el atajo, ajustas el indicador y verificas tú mismo dos servicios por semana.',ok:true,fb:'Correcto. Tocas los tres niveles: nombras el supuesto, cambias los recursos e indicadores, y modelas la conducta. Es exactamente el trabajo cultural que Schein atribuye al líder.'}]},\n {tipo:'reto',etiqueta:'Reto práctico · 7 días',titulo:'Excava un supuesto de tu área',texto:'Identifica una regla no escrita que tu equipo cumple sin discutir, y rastrea de dónde viene. Casi siempre nació porque alguna vez funcionó.',pasos:[\n   'Escribe la regla no escrita tal como la diría un integrante del equipo.',\n   'Identifica qué valor declarado contradice.',\n   'Rastrea qué conducta del liderazgo la sostiene: atención, tolerancia, recursos o promociones.',\n   'Escribe aquí el supuesto y las dos acciones con las que vas a empezar a cambiarlo.']},\n {tipo:'resumen',titulo:'Resumen visual del módulo',puntos:[\n   {t:'Tres niveles: artefactos, valores declarados y supuestos básicos.'},\n   {t:'Los supuestos son inconscientes y por eso gobiernan sin ser discutidos.'},\n   {t:'La brecha entre lo declarado y lo practicado es lo primero que detecta un nuevo ingreso.'},\n   {t:'La cultura se transmite por atención, crisis, recursos, promociones, ejemplo y tolerancia.'},\n   {t:'Lo que el líder tolera se convierte en política no escrita.'}]},\n {tipo:'quiz',titulo:'Evaluación del módulo 7',texto:'8 reactivos · mínimo aprobatorio 80%',preguntas:[\n   {p:'Los tres niveles de cultura de Schein son:',ops:['Visión, misión y valores','Artefactos, valores declarados y supuestos básicos','Clima, conducta y resultados','Normas, reglas y sanciones'],ok:1,fb:'Y solo el primero es visible.'},\n   {p:'Los supuestos básicos se caracterizan por ser:',ops:['Explícitos y documentados','Compartidos e inconscientes','Individuales y variables','Impuestos por la dirección'],ok:1,fb:'Nadie los discute porque nadie los ve.'},\n   {p:'Cambiar uniformes y tableros sin tocar los supuestos produce:',ops:['Cambio cultural profundo','Cinismo organizacional','Mejor clima','Mayor productividad'],ok:1,fb:'El equipo detecta la incongruencia de inmediato.'},\n   {p:'\"Lo que el líder tolera se convierte en política\" corresponde al mecanismo de:',ops:['Asignación de recursos','Tolerancia','Modelaje','Atención'],ok:1,fb:'Es uno de los seis mecanismos de transmisión.'},\n   {p:'La brecha cultural es la distancia entre:',ops:['La dirección y la operación','El valor declarado y el practicado','La meta y el resultado','El clima y la cultura'],ok:1,fb:'Es lo primero que percibe un nuevo ingreso.'},\n   {p:'Las promociones comunican culturalmente:',ops:['El nivel salarial de la empresa','Qué conducta premia la organización','La estructura jerárquica','La antigüedad requerida'],ok:1,fb:'Cada promoción es un mensaje sobre lo que vale.'},\n   {p:'Ante un atajo generalizado inducido por un indicador, la intervención más efectiva es:',ops:['Recordar el procedimiento por escrito','Sancionar al equipo detectado','Nombrar el supuesto, ajustar el indicador y modelar la conducta','Aumentar la supervisión'],ok:2,fb:'Hay que tocar los tres niveles, no solo el visible.'},\n   {p:'Según Schein, la tarea central del líder es:',ops:['Alcanzar los indicadores','Crear y gestionar la cultura','Diseñar la estructura','Administrar el presupuesto'],ok:1,fb:'Es su afirmación más citada sobre el rol del liderazgo.'}]}\n],\n8:[\n {tipo:'portada',kicker:'Módulo 08 · Bloque III',titulo:'Equipos de alto desempeño',sub:'Y conversaciones difíciles',texto:'Lencioni ordenó las razones por las que los equipos fallan en una pirámide: cada disfunción se apoya en la anterior, y todas empiezan en la falta de confianza.',meta:'60 min · 7 microlecciones · 120 XP'},\n {tipo:'objetivos',titulo:'Al terminar este módulo podrás',items:[\n   'Diagnosticar cuál de las cinco disfunciones frena hoy a tu equipo.',\n   'Instalar confianza y conflicto productivo en tus reuniones.',\n   'Sostener una conversación de responsabilidad con un guion de cuatro pasos.']},\n {tipo:'gancho',dato:'5',titulo:'disfunciones explican por qué un equipo con buena gente entrega resultados mediocres.',texto:'No es falta de talento ni de esfuerzo. Es una secuencia: sin confianza no hay debate real; sin debate no hay compromiso; sin compromiso nadie exige cuentas; y sin exigencia el resultado colectivo se vuelve opcional.',pregunta:'¿En tu última junta alguien contradijo abiertamente una idea tuya?'},\n {tipo:'leccion',kicker:'Microlección 1 · 7 min',titulo:'La pirámide se construye de abajo hacia arriba',texto:'Lencioni advierte que intentar arreglar el nivel superior sin resolver la base es tiempo perdido: exigir resultados a un equipo sin confianza solo produce protección individual.',cards:[\n   {n:'01',t:'Ausencia de confianza',d:'Nadie admite un error ni pide ayuda. Se cuida la imagen antes que el resultado.'},\n   {n:'02',t:'Temor al conflicto',d:'Armonía artificial en la junta y la discusión real en el pasillo.'},\n   {n:'03',t:'Falta de compromiso',d:'Sin debate genuino nadie se siente dueño del acuerdo.'}]},\n {tipo:'infografia',titulo:'Las cinco disfunciones y su antídoto',sub:'Modelo de Patrick Lencioni',bloques:[\n   {n:'01',t:'Ausencia de confianza',d:'Antídoto: vulnerabilidad del líder. Admite primero tu propio error.'},\n   {n:'02',t:'Temor al conflicto',d:'Antídoto: provocar el debate en la junta y no permitir la discusión de pasillo.'},\n   {n:'03',t:'Falta de compromiso',d:'Antídoto: cerrar cada acuerdo por escrito, con nombre y fecha.'},\n   {n:'04',t:'Evasión de responsabilidades',d:'Antídoto: que los pares se exijan entre sí, no solo el jefe.'},\n   {n:'05',t:'Falta de atención a resultados',d:'Antídoto: un indicador colectivo visible antes que el individual.'},\n   {n:'!',t:'Error del líder',d:'Exigir resultados sin haber construido confianza. Produce protección, no desempeño.'}]},\n {tipo:'relacionar',titulo:'Relaciona el síntoma con la disfunción',texto:'Toca el síntoma observable y después la disfunción que lo produce.',orden:[2,4,0,3,1],pares:[\n   {a:'Nadie pregunta en la junta y todos comentan en el estacionamiento',b:'Temor al conflicto'},\n   {a:'\"Yo cumplí lo mío, el problema es de servicio\"',b:'Falta de atención a resultados colectivos'},\n   {a:'Un técnico oculta un error hasta que el cliente reclama',b:'Ausencia de confianza'},\n   {a:'Nadie corrige al compañero que llega tarde a la cuadrilla',b:'Evasión de responsabilidades'},\n   {a:'Se acordó el nuevo protocolo y a la semana cada uno hace lo suyo',b:'Falta de compromiso'}]},\n {tipo:'comparativo',titulo:'Falsa armonía y conflicto productivo',sub:'La diferencia entre un equipo cómodo y un equipo efectivo',izqT:'Falsa armonía',izq:['Nadie contradice al jefe en la junta','Los desacuerdos aparecen en el pasillo','Las decisiones se reabren una y otra vez','Se protege la relación y se sacrifica el resultado','El silencio se interpreta como acuerdo'],derT:'Conflicto productivo',der:['Se discute la idea, nunca la persona','El desacuerdo se dice en la mesa','La decisión se cierra y se sostiene','Se protege el resultado y la relación resiste','El acuerdo se verifica en voz alta']},\n {tipo:'cita',frase:'Si logras que todas las personas de una organización remen en la misma dirección, podrás dominar cualquier industria.',autor:'Patrick Lencioni',obra:'Las cinco disfunciones de un equipo'},\n {tipo:'leccion',kicker:'Microlección 2 · 8 min',titulo:'Guion de cuatro pasos para una conversación difícil',texto:'La conversación de responsabilidad no es una llamada de atención: es un acuerdo que se verifica. Cuatro pasos, en este orden, sin saltarse ninguno.',cards:[\n   {n:'01',t:'Hecho',d:'Describe la conducta observable sin adjetivos: \"en tres servicios de esta semana no se registró la verificación final\".'},\n   {n:'02',t:'Impacto',d:'Explica la consecuencia concreta: \"el cliente del viernes tuvo una falla evitable\".'},\n   {n:'03',t:'Escucha',d:'Pregunta qué está ocurriendo y calla. Aquí aparece la causa real la mayoría de las veces.'},\n   {n:'04',t:'Acuerdo',d:'Cierra con qué cambia, cómo se verifica y para cuándo.'}]},\n {tipo:'clasificar',titulo:'Clasifica cada frase del líder',texto:'Toca la frase y después la columna que corresponde según el guion de conversación.',cubetas:['Construye la conversación','La descarrila'],items:[\n   {t:'\"En los últimos tres servicios no se registró la verificación final.\"',c:0},\n   {t:'\"Siempre haces lo mismo, nunca te importa la calidad.\"',c:1},\n   {t:'\"El cliente del viernes tuvo una falla que se pudo evitar.\"',c:0},\n   {t:'\"¿Qué está pasando con la carga de trabajo de tu cuadrilla?\"',c:0},\n   {t:'\"Todo el equipo dice que tú eres el problema.\"',c:1},\n   {t:'\"¿Qué necesitas para que esto no vuelva a ocurrir y cómo lo verificamos?\"',c:0},\n   {t:'\"Si no te gusta, hay mucha gente buscando trabajo.\"',c:1},\n   {t:'\"Ya lo habíamos hablado, pensé que lo habías entendido.\"',c:1}]},\n {tipo:'vf',titulo:'Verdadero o falso',texto:'Marca cada afirmación como verdadera o falsa.',items:[\n   {t:'La confianza en un equipo empieza cuando el líder admite un error propio.',v:true,fb:'Verdadero. Lencioni lo llama vulnerabilidad y es la única entrada a la base de la pirámide.'},\n   {t:'Un equipo sin discusiones es un equipo saludable.',v:false,fb:'Falso. Casi siempre es armonía artificial: el desacuerdo existe, solo no se dice en la mesa.'},\n   {t:'El compromiso surge del debate previo, no de la orden final.',v:true,fb:'Verdadero. Sin haber sido escuchado, nadie se siente dueño del acuerdo.'},\n   {t:'La exigencia de cuentas debe venir únicamente del jefe.',v:false,fb:'Falso. El nivel superior de madurez es que los pares se exijan entre sí.'},\n   {t:'Conviene iniciar una conversación difícil describiendo la conducta observable.',v:true,fb:'Verdadero. Hecho antes que interpretación: reduce la defensa.'}]},\n {tipo:'flashcards',titulo:'Tarjetas de memoria',texto:'Toca cada tarjeta para revelar la definición.',cards:[\n   {f:'Vulnerabilidad del líder',b:'Admitir error o desconocimiento; habilita la confianza del equipo.'},\n   {f:'Armonía artificial',b:'Ausencia de desacuerdo visible con conflicto activo en el pasillo.'},\n   {f:'Conflicto productivo',b:'Debate sobre ideas, no sobre personas, dentro de la reunión.'},\n   {f:'Compromiso',b:'Adhesión al acuerdo que nace del debate, no de la orden.'},\n   {f:'Exigencia entre pares',b:'Los miembros se piden cuentas sin intermediación del jefe.'},\n   {f:'Resultado colectivo',b:'Indicador de equipo que antecede al individual.'}]},\n {tipo:'caso',empresa:'Pixar',etiqueta:'Caso real',titulo:'Poner el error sobre la mesa temprano',contexto:'Pixar institucionalizó reuniones donde el trabajo se muestra deliberadamente inacabado y todos los presentes tienen permiso de señalar lo que no funciona. La regla es explícita: se critica el trabajo, nunca a la persona, y quien dirige el proyecto decide qué incorpora. El objetivo no es consenso, es detectar el problema cuando aún es barato corregirlo.',aprendizaje:'Un equipo que sabe criticar el trabajo sin herir a las personas detecta los errores antes que el cliente.',traslado:'En Mirage: revisión semanal de casos difíciles donde se analiza el servicio, no al técnico.',pregunta:'¿En qué momento se enteran tú y tu equipo de un error: al día siguiente o cuando llama el cliente?'},\n {tipo:'escenario',etiqueta:'Role play · conversación difícil',titulo:'Tercer incumplimiento del protocolo',situacion:'Es la tercera vez este mes que un instalador con ocho años de experiencia omite la prueba de presión antes de cerrar el equipo. Es el técnico más rápido de la cuadrilla y el más querido por sus compañeros. Está frente a ti, esperando.',opciones:[\n   {t:'\"Necesito que me expliques por qué llevas tres servicios sin hacer la prueba de presión. Esto ya afectó a un cliente el viernes. ¿Qué está pasando?\"',ok:true,fb:'Correcto. Hecho, impacto y pregunta: los tres primeros pasos del guion. Abres espacio a la causa real antes de cerrar el acuerdo.'},\n   {t:'\"Con tu experiencia, no debería tener que decirte esto. Espero que no se repita.\"',ok:false,fb:'Apelas a la antigüedad y cierras con una expectativa vaga. No hay hecho verificable, no hay acuerdo y no hay verificación: la conducta volverá.'},\n   {t:'\"Voy a tener que reportarlo con recursos humanos para que quede documentado.\"',ok:false,fb:'Escalas antes de conversar. El registro puede ser necesario después, pero saltarte la conversación destruye la confianza que hace posible el cambio.'}]},\n {tipo:'reto',etiqueta:'Reto práctico · 7 días',titulo:'Sostén la conversación que traes pendiente',texto:'Todos los líderes tienen una conversación aplazada. Prepárala con el guion de cuatro pasos y sostenla esta semana.',pasos:[\n   'Escribe el hecho observable, sin adjetivos ni interpretaciones.',\n   'Define el impacto concreto en el cliente, el equipo o el resultado.',\n   'Prepara la pregunta con la que vas a escuchar, y comprométete a callar 30 segundos.',\n   'Escribe aquí con quién es la conversación y el acuerdo que buscas cerrar.']},\n {tipo:'resumen',titulo:'Resumen visual del módulo',puntos:[\n   {t:'Las cinco disfunciones son una secuencia: todo empieza en la confianza.'},\n   {t:'La confianza se abre con la vulnerabilidad del líder, no con un taller.'},\n   {t:'Sin debate real no hay compromiso, solo obediencia temporal.'},\n   {t:'La madurez del equipo se mide en si los pares se exigen entre sí.'},\n   {t:'Conversación difícil: hecho, impacto, escucha y acuerdo verificable.'}]},\n {tipo:'quiz',titulo:'Evaluación del módulo 8',texto:'8 reactivos · mínimo aprobatorio 80%',preguntas:[\n   {p:'La base de la pirámide de Lencioni es:',ops:['La falta de resultados','La ausencia de confianza','El temor al conflicto','La evasión de responsabilidades'],ok:1,fb:'Todo lo demás se apoya ahí.'},\n   {p:'La confianza en el equipo se habilita cuando:',ops:['El líder muestra vulnerabilidad y admite errores','Se firma un código de conducta','Se realizan actividades de integración','El jefe evita las críticas'],ok:0,fb:'La vulnerabilidad del líder es la puerta de entrada.'},\n   {p:'La armonía artificial se reconoce porque:',ops:['El equipo discute mucho','El desacuerdo aparece fuera de la reunión','Las juntas son largas','Hay quejas formales'],ok:1,fb:'La discusión real ocurre en el pasillo.'},\n   {p:'El compromiso con una decisión surge de:',ops:['La claridad de la orden','El debate previo donde todos fueron escuchados','El incentivo asociado','La supervisión posterior'],ok:1,fb:'Sin voz no hay dueño del acuerdo.'},\n   {p:'El nivel más maduro de exigencia de cuentas es:',ops:['El jefe supervisa a cada integrante','Los pares se exigen entre sí','Recursos humanos documenta','El indicador se publica'],ok:1,fb:'Cuando los pares se exigen, el jefe deja de ser el único control.'},\n   {p:'El primer paso del guion de conversación difícil es:',ops:['Describir el hecho observable','Explicar cómo te sentiste','Recordar los antecedentes','Anunciar la consecuencia'],ok:0,fb:'Hecho antes que interpretación: reduce la defensa.'},\n   {p:'\"Siempre haces lo mismo, nunca te importa la calidad\" es un error porque:',ops:['Es demasiado directo','Generaliza y juzga a la persona en lugar de describir el hecho','Debe decirse por escrito','Debe involucrar a un testigo'],ok:1,fb:'La generalización garantiza defensa y no cambia la conducta.'},\n   {p:'Exigir resultados a un equipo sin confianza produce:',ops:['Alto desempeño','Protección individual y ocultamiento','Compromiso rápido','Mejor comunicación'],ok:1,fb:'Cada uno protege su parte y el resultado colectivo se vuelve opcional.'}]}\n],\n9:[\n {tipo:'portada',kicker:'Módulo 09 · Bloque IV',titulo:'Liderazgo Nivel 5',sub:'De bueno a excelente',texto:'Collins buscó qué distingue a las empresas que dieron un salto sostenido. Encontró un tipo de líder inesperado: humilde en lo personal, implacable en lo profesional, obsesionado con la institución y no con su figura.',meta:'60 min · 6 microlecciones · 120 XP'},\n {tipo:'objetivos',titulo:'Al terminar este módulo podrás',items:[\n   'Reconocer la combinación de humildad personal y voluntad profesional.',\n   'Aplicar el principio \"primero quién, después qué\" en tus decisiones de personal.',\n   'Definir el volante de crecimiento de tu área.']},\n {tipo:'gancho',dato:'Nivel 5',titulo:'no es el líder más brillante de la sala: es el que construye algo que funciona sin él.',texto:'Collins encontró que los líderes carismáticos y mediáticos rara vez produjeron saltos sostenidos. Los que lo lograron eran discretos, tercos con el resultado y ocupados en preparar a su sucesor.',pregunta:'Si te ausentaras seis semanas, ¿qué se detendría en tu área?'},\n {tipo:'leccion',kicker:'Microlección 1 · 6 min',titulo:'Los cinco niveles de liderazgo',texto:'Collins describe una jerarquía acumulativa: cada nivel requiere los anteriores. El paso del cuatro al cinco es el más raro porque exige renunciar al protagonismo.',cards:[\n   {n:'01',t:'Nivel 1 y 2',d:'Individuo capaz y miembro que contribuye al equipo.'},\n   {n:'02',t:'Nivel 3 y 4',d:'Gerente competente y líder eficaz que consigue resultados y compromiso con la visión.'},\n   {n:'03',t:'Nivel 5',d:'Construye grandeza duradera con humildad personal y voluntad profesional.'}]},\n {tipo:'infografia',titulo:'Los principios del salto',sub:'Hallazgos centrales de la investigación de Jim Collins',bloques:[\n   {n:'01',t:'Primero quién, después qué',d:'Se define el equipo antes que la estrategia. La gente correcta no necesita motivación constante.'},\n   {n:'02',t:'Enfrentar los hechos brutales',d:'Sin perder la fe en el resultado. Optimismo con datos incómodos sobre la mesa.'},\n   {n:'03',t:'El concepto del erizo',d:'La intersección de en qué puedes ser el mejor, qué te apasiona y qué mueve tu economía.'},\n   {n:'04',t:'El volante',d:'Empujar consistentemente la misma rueda; el impulso se acumula y no depende de un evento heroico.'},\n   {n:'05',t:'Ventana y espejo',d:'El éxito se atribuye afuera; el fracaso, adentro. Los líderes mediocres hacen lo contrario.'},\n   {n:'06',t:'Disciplina, no burocracia',d:'Cultura de disciplina con libertad dentro de un marco claro.'}]},\n {tipo:'clasificar',titulo:'Ventana o espejo',texto:'Toca la frase del líder y clasifícala: ¿mira por la ventana o al espejo?',cubetas:['Ventana · mira afuera','Espejo · mira adentro'],items:[\n   {t:'\"El mes se logró porque la cuadrilla sostuvo el estándar en pleno calor.\"',c:0},\n   {t:'\"La caída del trimestre es responsabilidad mía: no preparé al equipo a tiempo.\"',c:1},\n   {t:'\"Tuvimos suerte con la temporada, y el equipo supo aprovecharla.\"',c:0},\n   {t:'\"El error del protocolo empezó con una decisión que tomé sin consultar.\"',c:1},\n   {t:'\"Este resultado es de ellos; yo solo quité obstáculos.\"',c:0},\n   {t:'\"Si el cliente se fue, fue porque no vi la señal a tiempo.\"',c:1}]},\n {tipo:'comparativo',titulo:'Bueno y excelente',sub:'Lo que Collins encontró al comparar empresas del mismo sector',izqT:'Compañía buena',izq:['Depende de un líder carismático','Busca el gran evento que cambie todo','Contrata para llenar la vacante','Evita los datos que incomodan','El resultado cae cuando el líder se va'],derT:'Compañía excelente',der:['Depende de un sistema y un equipo','Empuja el mismo volante con constancia','Contrata a la persona correcta y luego define el puesto','Enfrenta los hechos brutales sin perder la fe','El resultado se sostiene después del líder']},\n {tipo:'cita',frase:'Los líderes de nivel 5 canalizan las necesidades de su ego lejos de sí mismos y hacia el objetivo mayor de construir una gran empresa.',autor:'Jim Collins',obra:'Empresas que sobresalen'},\n {tipo:'leccion',kicker:'Microlección 2 · 7 min',titulo:'Primero quién, después qué',texto:'Collins encontró que las empresas que dieron el salto empezaron por subir a la gente correcta al autobús, incluso antes de saber exactamente a dónde iban.',cards:[\n   {n:'01',t:'La gente correcta',d:'No requiere motivación externa: llega con estándar propio.'},\n   {n:'02',t:'Rigor, no crueldad',d:'Ser riguroso es decidir a tiempo, no despedir en masa cuando ya es tarde.'},\n   {n:'03',t:'Los mejores a la mayor oportunidad',d:'No al problema más grande: a la oportunidad más grande.'}]},\n {tipo:'completar',titulo:'Completa los principios',texto:'Toca la frase y después la palabra correcta del banco.',opciones:['volante','erizo','sucesor','hechos'],frases:[\n   {pre:'El impulso sostenido se construye empujando el mismo',ok:0,post:'y no con un evento heroico aislado.'},\n   {pre:'El concepto del',ok:1,post:'es la intersección entre en qué puedes ser el mejor, qué te apasiona y qué mueve tu economía.'},\n   {pre:'Un líder Nivel 5 se mide también por la calidad de su',ok:2,post:'.'},\n   {pre:'Enfrentar los',ok:3,post:'brutales sin perder la fe en el resultado es condición del salto.'}]},\n {tipo:'vf',titulo:'Verdadero o falso',texto:'Marca cada afirmación como verdadera o falsa.',items:[\n   {t:'El liderazgo Nivel 5 combina humildad personal con voluntad profesional feroz.',v:true,fb:'Verdadero. Es la definición central de Collins y la parte más contraintuitiva del hallazgo.'},\n   {t:'Los líderes más carismáticos fueron los que produjeron los saltos sostenidos.',v:false,fb:'Falso. Collins encontró lo contrario: los saltos vinieron de líderes discretos y persistentes.'},\n   {t:'Ser riguroso con la gente significa hacer recortes frecuentes.',v:false,fb:'Falso. Rigor es decidir a tiempo y con criterio, no despedir en masa cuando ya es tarde.'},\n   {t:'El volante describe un impulso que se acumula con acciones consistentes.',v:true,fb:'Verdadero. Cada empujón parece pequeño y el efecto es acumulativo.'},\n   {t:'Un líder Nivel 5 atribuye el éxito al equipo y el fracaso a sí mismo.',v:true,fb:'Verdadero. Es el principio de ventana y espejo.'}]},\n {tipo:'flashcards',titulo:'Tarjetas de memoria',texto:'Toca cada tarjeta para revelar la definición.',cards:[\n   {f:'Nivel 5',b:'Humildad personal más voluntad profesional al servicio de la institución.'},\n   {f:'Primero quién',b:'Definir el equipo correcto antes que la estrategia.'},\n   {f:'Hechos brutales',b:'Enfrentar la realidad incómoda sin perder la fe en el resultado.'},\n   {f:'Concepto del erizo',b:'Intersección de capacidad, pasión y motor económico.'},\n   {f:'Volante',b:'Impulso acumulado por acciones consistentes en la misma dirección.'},\n   {f:'Ventana y espejo',b:'Éxito atribuido afuera, fracaso asumido adentro.'}]},\n {tipo:'caso',empresa:'Trane Technologies',etiqueta:'Caso real',titulo:'Disciplina de largo plazo en un mercado cíclico',contexto:'El negocio del clima depende del clima: temporadas de calor extremo elevan la demanda y los inviernos suaves la hunden. Las compañías que sostienen resultados en esa ciclicidad no lo hacen persiguiendo el pico, sino construyendo capacidades que operan todo el año: servicio recurrente, eficiencia energética, formación técnica y relación de largo plazo con el cliente. Es un volante, no una temporada.',aprendizaje:'En un mercado cíclico, la disciplina del líder consiste en no sacrificar el volante por el pico del mes.',traslado:'En Mirage: definir los tres impulsores que se empujan todo el año, más allá de la temporada alta.',pregunta:'¿Qué estás construyendo hoy que dará resultado en la temporada siguiente?'},\n {tipo:'escenario',etiqueta:'Escenario de decisión',titulo:'A quién promover',situacion:'Se abre la jefatura de servicio de la sucursal. Tienes tres candidatos: el técnico con la mejor cifra de servicios cerrados y trato difícil con sus compañeros; la coordinadora con resultados sólidos que forma gente y no busca reflectores; y un candidato externo con excelente currículum y sin conocimiento del negocio local.',opciones:[\n   {t:'Promueves al técnico con la mejor cifra: los números hablan.',ok:false,fb:'Promover la cifra sobre la conducta comunica exactamente qué premia la organización. Ganas un mes y pierdes al equipo alrededor.'},\n   {t:'Promueves a la coordinadora que forma gente y sostiene resultados sin protagonismo.',ok:true,fb:'Correcto. Es el perfil Nivel 5: resultado con humildad y capacidad de construir equipo. También es la señal cultural más potente que puedes enviar.'},\n   {t:'Contratas al candidato externo para traer prácticas nuevas.',ok:false,fb:'Puede ser válido cuando no hay talento interno, pero aquí ya lo hay: promover fuera desmotiva a quien ya demostró y rompe el volante que estabas construyendo.'}]},\n {tipo:'reto',etiqueta:'Reto práctico · 7 días',titulo:'Define a tu sucesor',texto:'Un líder Nivel 5 se mide por lo que funciona sin él. Identifica quién podría ocupar tu puesto y qué le falta para estar listo.',pasos:[\n   'Nombra a la persona que hoy está más cerca de poder sustituirte.',\n   'Enumera las tres capacidades que le faltan.',\n   'Define una responsabilidad real que puedas transferirle este mes.',\n   'Escribe aquí el nombre, las brechas y la primera responsabilidad que vas a delegar.']},\n {tipo:'resumen',titulo:'Resumen visual del módulo',puntos:[\n   {t:'Nivel 5: humildad personal más voluntad profesional feroz.'},\n   {t:'Primero quién, después qué: el equipo correcto antecede a la estrategia.'},\n   {t:'Enfrentar los hechos brutales sin perder la fe en el resultado.'},\n   {t:'El volante gana por acumulación, no por eventos heroicos.'},\n   {t:'Ventana y espejo: el éxito es del equipo, el error es del líder.'}]},\n {tipo:'quiz',titulo:'Evaluación del módulo 9',texto:'8 reactivos · mínimo aprobatorio 80%',preguntas:[\n   {p:'El liderazgo Nivel 5 combina:',ops:['Carisma y visión','Humildad personal y voluntad profesional','Autoridad y experiencia','Disciplina y control'],ok:1,fb:'Es la combinación central del hallazgo de Collins.'},\n   {p:'\"Primero quién, después qué\" significa:',ops:['Definir la estrategia y luego contratar','Subir a la gente correcta antes de fijar el rumbo','Promover por antigüedad','Contratar solo perfiles externos'],ok:1,fb:'La gente correcta no requiere motivación constante.'},\n   {p:'Enfrentar los hechos brutales implica:',ops:['Ser pesimista con el equipo','Ver la realidad sin perder la fe en el resultado','Comunicar solo lo positivo','Delegar el diagnóstico'],ok:1,fb:'Realismo y fe al mismo tiempo.'},\n   {p:'El efecto volante describe:',ops:['Un cambio radical impulsado por un evento','Impulso acumulado por acciones consistentes','La rotación de personal','El ciclo de temporada'],ok:1,fb:'Cada empujón parece pequeño; el efecto es acumulativo.'},\n   {p:'\"Ventana y espejo\" significa que el líder:',ops:['Atribuye el éxito al equipo y el fracaso a sí mismo','Se atribuye el éxito y culpa al mercado','Evalúa por resultados visibles','Revisa el desempeño cada trimestre'],ok:0,fb:'Los líderes mediocres hacen exactamente lo contrario.'},\n   {p:'El concepto del erizo es la intersección de:',ops:['Costo, calidad y tiempo','En qué puedes ser el mejor, qué te apasiona y qué mueve tu economía','Cliente, producto y precio','Visión, misión y valores'],ok:1,fb:'Las tres condiciones a la vez, no dos.'},\n   {p:'Ser riguroso con la gente, según Collins, es:',ops:['Hacer recortes periódicos','Decidir a tiempo y con criterio sobre las personas','Evaluar por indicadores duros','Rotar puestos con frecuencia'],ok:1,fb:'Rigor no es crueldad: es no postergar la decisión.'},\n   {p:'La mejor señal de un líder Nivel 5 en tu área es que:',ops:['Todo pasa por él','El resultado se sostiene sin su presencia','Tiene la mayor productividad individual','Es el más reconocido por la dirección'],ok:1,fb:'Construye algo que funciona sin él.'}]}\n],\n10:[\n {tipo:'portada',kicker:'Módulo 10 · Bloque IV',titulo:'Liderar el cambio',sub:'Tu plan de 90 días',texto:'Kotter documentó por qué la mayoría de las transformaciones fracasan y ordenó el proceso en ocho pasos. Este módulo integra los catorce autores del programa en un plan que empieza el lunes.',meta:'60 min · 6 microlecciones · 220 XP'},\n {tipo:'objetivos',titulo:'Al terminar este módulo podrás',items:[\n   'Conducir un cambio en tu área con los ocho pasos de Kotter.',\n   'Anticipar y trabajar la resistencia de tu equipo.',\n   'Presentar un plan de 90 días con metas medibles.']},\n {tipo:'gancho',dato:'70%',titulo:'de los esfuerzos de cambio organizacional no alcanzan su objetivo.',texto:'Kotter identificó el patrón: se anuncia el cambio antes de crear urgencia, se comunica una vez, no se retiran los obstáculos y se declara la victoria demasiado pronto. Luego se culpa a la resistencia del personal.',pregunta:'¿Cuál fue el último cambio que anunciaste y que hoy nadie recuerda?'},\n {tipo:'leccion',kicker:'Microlección 1 · 7 min',titulo:'Los ocho pasos en tres fases',texto:'Kotter agrupa el proceso en tres movimientos. Saltarse la primera fase es el error más común y el más caro.',cards:[\n   {n:'01',t:'Crear el clima',d:'Pasos 1 a 3: urgencia real, coalición que empuja y visión clara del cambio.'},\n   {n:'02',t:'Involucrar a la organización',d:'Pasos 4 a 6: comunicar sin descanso, remover obstáculos y generar victorias tempranas.'},\n   {n:'03',t:'Implementar y sostener',d:'Pasos 7 y 8: no declarar victoria antes de tiempo y anclar el cambio en la cultura.'}]},\n {tipo:'timeline',titulo:'Los ocho pasos de Kotter',sub:'Secuencia completa del proceso de cambio',hitos:[\n   {a:'Paso 1',t:'Crear sentido de urgencia',d:'Con datos reales, no con alarmismo: qué pasa si no cambiamos este trimestre.'},\n   {a:'Paso 2',t:'Formar una coalición guía',d:'Cuatro o cinco personas con credibilidad operativa, no solo jefes.'},\n   {a:'Paso 3',t:'Desarrollar visión y estrategia',d:'Una imagen del resultado que el equipo pueda repetir sin leerla.'},\n   {a:'Paso 4',t:'Comunicar la visión',d:'Muchas veces, en muchos canales, con el líder modelando la conducta.'},\n   {a:'Paso 5',t:'Eliminar obstáculos',d:'Procesos, permisos y personas que bloquean. Aquí se prueba tu seriedad.'},\n   {a:'Paso 6',t:'Generar victorias de corto plazo',d:'Un resultado visible en 30 días que confirme que el cambio funciona.'},\n   {a:'Paso 7',t:'Consolidar y seguir',d:'No declarar victoria: usar el impulso para el siguiente frente.'},\n   {a:'Paso 8',t:'Anclar en la cultura',d:'Nuevos criterios de contratación, promoción y medición.'}]},\n {tipo:'clasificar',titulo:'Clasifica cada acción por fase',texto:'Toca la acción y después la fase del proceso de cambio a la que pertenece.',cubetas:['Crear el clima','Involucrar','Implementar y sostener'],items:[\n   {t:'Mostrar al equipo los datos de reincidencia de los últimos seis meses',c:0},\n   {t:'Sumar a dos jefes de cuadrilla respetados como impulsores del nuevo protocolo',c:0},\n   {t:'Repetir la visión del cambio en cada arranque de turno durante un mes',c:1},\n   {t:'Eliminar la autorización doble que retrasaba los repuestos',c:1},\n   {t:'Publicar el primer resultado: 30% menos reincidencias en una cuadrilla piloto',c:1},\n   {t:'Incluir el nuevo estándar en la evaluación y en la contratación de técnicos',c:2},\n   {t:'Resistir el impulso de anunciar que el cambio ya está logrado',c:2},\n   {t:'Definir en una frase cómo se verá el servicio dentro de seis meses',c:0}]},\n {tipo:'comparativo',titulo:'Cambio impuesto y cambio conducido',sub:'Dos formas de introducir el mismo protocolo nuevo',izqT:'Cambio impuesto',izq:['Se anuncia por correo un lunes','La urgencia es la instrucción del jefe','Se comunica una vez y se supervisa','Los obstáculos siguen ahí','Se declara logrado al mes'],derT:'Cambio conducido',der:['Se construye con una coalición visible','La urgencia surge de datos que el equipo reconoce','Se comunica de forma repetida y en varios canales','Se retiran los bloqueos reales primero','Se ancla en medición, evaluación y contratación']},\n {tipo:'cita',frase:'La transformación no es un evento: es un proceso. Y el error más grave es declarar la victoria demasiado pronto.',autor:'John P. Kotter',obra:'Liderando el cambio'},\n {tipo:'leccion',kicker:'Microlección 2 · 6 min',titulo:'Trabajar la resistencia',texto:'La resistencia no es un defecto del equipo: es información. Casi siempre señala un costo real que el diseño del cambio no consideró.',cards:[\n   {n:'01',t:'Escucha la objeción',d:'\"Con este paso extra no alcanzamos la ruta del día\" suele ser un dato, no una excusa.'},\n   {n:'02',t:'Separa el qué del cómo',d:'El estándar no se negocia; la forma de lograrlo, sí.'},\n   {n:'03',t:'Convierte al escéptico',d:'Quien más objeta, si se convence, se vuelve el mejor promotor del cambio.'}]},\n {tipo:'infografia',titulo:'Mapa integrador del programa',sub:'Los catorce autores en un solo esquema de trabajo',bloques:[\n   {n:'01',t:'Fundamento',d:'Drucker y Kotter: separar administrar de liderar; eficacia antes que eficiencia.'},\n   {n:'02',t:'Tú mismo',d:'Covey y Goldsmith: hábitos, prioridades y credibilidad.'},\n   {n:'03',t:'Tus emociones',d:'Goleman: autoconciencia, autogestión y los seis estilos.'},\n   {n:'04',t:'Cada persona',d:'Hersey y Blanchard: nivel de desarrollo y estilo adecuado.'},\n   {n:'05',t:'El equipo elevado',d:'Burns, Bass y Avolio: rango completo y las cuatro I.'},\n   {n:'06',t:'El sentido',d:'Sinek: por qué, confianza y círculo de seguridad.'},\n   {n:'07',t:'El sistema',d:'Schein y Lencioni: cultura en tres niveles y cinco disfunciones.'},\n   {n:'08',t:'El legado',d:'Collins: Nivel 5, primero quién y el volante.'},\n   {n:'09',t:'El movimiento',d:'Kotter: ocho pasos para que el cambio ocurra y se sostenga.'}]},\n {tipo:'vf',titulo:'Verdadero o falso',texto:'Marca cada afirmación como verdadera o falsa.',items:[\n   {t:'La urgencia se crea con datos que el equipo reconoce como propios.',v:true,fb:'Verdadero. La urgencia decretada por el jefe no moviliza; la evidencia sí.'},\n   {t:'Declarar la victoria pronto acelera el cambio.',v:false,fb:'Falso. Es uno de los errores clásicos de Kotter: el impulso se desinfla y se regresa al estado anterior.'},\n   {t:'La coalición guía debe estar formada solo por jefes.',v:false,fb:'Falso. Necesita credibilidad operativa: quienes el equipo escucha, tengan o no puesto.'},\n   {t:'La resistencia suele señalar un costo real no considerado en el diseño.',v:true,fb:'Verdadero. Escucharla mejora el cómo sin negociar el qué.'},\n   {t:'Anclar el cambio implica modificar criterios de medición, evaluación y contratación.',v:true,fb:'Verdadero. Sin eso, el cambio vive mientras el líder lo empuja.'}]},\n {tipo:'flashcards',titulo:'Tarjetas de memoria',texto:'Toca cada tarjeta para revelar la definición.',cards:[\n   {f:'Sentido de urgencia',b:'Convicción compartida, basada en datos, de que no cambiar tiene un costo.'},\n   {f:'Coalición guía',b:'Grupo con credibilidad operativa que impulsa el cambio.'},\n   {f:'Victoria temprana',b:'Resultado visible en semanas que confirma que el cambio funciona.'},\n   {f:'Anclaje cultural',b:'Nuevos criterios de medición, evaluación y contratación.'},\n   {f:'Resistencia',b:'Información sobre costos reales del cambio; se trabaja, no se combate.'},\n   {f:'Declarar victoria pronto',b:'Error clásico: el impulso se pierde antes del anclaje.'}]},\n {tipo:'caso',empresa:'LEGO',etiqueta:'Caso real',titulo:'Reinvención dirigida tras la crisis',contexto:'A inicios de los 2000, LEGO estaba al borde de la quiebra por una expansión desordenada. La recuperación no vino de una idea creativa aislada: se enfrentaron los hechos con crudeza, se redujo la línea de productos, se recuperó el foco en el producto central y se involucró a la comunidad de usuarios. El cambio se sostuvo porque se ancló en decisiones de producto, medición y gobierno, no en una campaña interna.',aprendizaje:'La transformación requiere urgencia real, foco brutal y anclaje en las decisiones cotidianas.',traslado:'En Mirage: elegir un solo frente de cambio por trimestre y anclarlo en la evaluación del equipo.',pregunta:'¿Cuántos cambios simultáneos le estás pidiendo hoy a tu equipo?'},\n {tipo:'escenario',etiqueta:'Simulación final',titulo:'Implementar el nuevo protocolo de servicio',situacion:'La dirección aprueba un nuevo protocolo de verificación que agrega doce minutos por servicio y reduce las reincidencias a la mitad. Tu equipo trabaja al límite en temporada alta y tres jefes de cuadrilla ya dijeron en el pasillo que \"no va a funcionar\". Tienes 90 días para implementarlo.',opciones:[\n   {t:'Lo lanzas completo desde el lunes en todas las cuadrillas: el protocolo está aprobado y el tiempo apremia.',ok:false,fb:'Sin urgencia construida, sin coalición y sin victoria temprana, el protocolo se cumplirá en el papel. En la segunda semana aparecerán los atajos.'},\n   {t:'Presentas los datos de reincidencia, sumas a dos jefes de cuadrilla creíbles, pruebas con una cuadrilla piloto y publicas su resultado a los 30 días.',ok:true,fb:'Correcto. Urgencia con datos, coalición guía, victoria temprana visible y después escalamiento. Es la secuencia de Kotter aplicada a 90 días reales.'},\n   {t:'Esperas a que baje la temporada para implementarlo con calma.',ok:false,fb:'Postergar parece prudente y en realidad disuelve la urgencia. Cuando baje la temporada, el problema dejará de doler y el cambio no ocurrirá.'}]},\n {tipo:'reto',etiqueta:'Entregable final · plan de 90 días',titulo:'Tu plan de 90 días',texto:'Este es el entregable del programa: un cambio concreto en tu área, conducido con lo aprendido en los diez módulos.',pasos:[\n   'Define el cambio en una frase y el dato que crea la urgencia.',\n   'Nombra tu coalición guía: tres personas con credibilidad operativa.',\n   'Define la victoria temprana de los primeros 30 días y cómo la medirás.',\n   'Escribe aquí tu plan: cambio, dato de urgencia, coalición, victoria temprana y anclaje a 90 días.']},\n {tipo:'resumen',titulo:'Resumen visual del programa',puntos:[\n   {t:'Administrar produce orden; liderar produce movimiento. Necesitas ambos y en proporción.'},\n   {t:'Primero tú: hábitos, prioridades y credibilidad. Después la gente.'},\n   {t:'El estilo se adapta a la persona y a la tarea; el estándar no se adapta a nadie.'},\n   {t:'La cultura se transmite por lo que mides, promueves, modelas y toleras.'},\n   {t:'El cambio necesita urgencia real, coalición, victoria temprana y anclaje.'}]},\n {tipo:'quiz',titulo:'Examen final del programa',texto:'25 reactivos integradores · mínimo aprobatorio 80%',preguntas:[\n   {p:'Según Drucker, la eficacia es:',ops:['Hacer las cosas bien','Hacer las cosas correctas','Hacerlas al menor costo','Hacerlas más rápido'],ok:1,fb:'Eficacia es lo correcto; eficiencia es hacerlo bien.'},\n   {p:'Los tres actos del liderazgo según Kotter son:',ops:['Planear, organizar, controlar','Fijar rumbo, alinear, motivar','Medir, corregir, premiar','Delegar, supervisar, evaluar'],ok:1,fb:'En ese orden.'},\n   {p:'El cuadrante II de Covey corresponde a lo:',ops:['Urgente e importante','Importante y no urgente','Urgente y no importante','Ni urgente ni importante'],ok:1,fb:'Es el cuadrante que reduce urgencias futuras.'},\n   {p:'El feedforward se diferencia del feedback porque:',ops:['Lo da el jefe','Se centra en conductas futuras','Es más severo','Se documenta por escrito'],ok:1,fb:'No se discute: se agradece.'},\n   {p:'Los cuatro dominios de la inteligencia emocional son:',ops:['Autoconciencia, autogestión, conciencia social y gestión de relaciones','Visión, misión, valores y cultura','Rasgos, conductas, actitudes y hábitos','Empatía, simpatía, apatía y antipatía'],ok:0,fb:'Se construyen en secuencia, de adentro hacia afuera.'},\n   {p:'El estilo de Goleman con mayor impacto positivo en el clima es:',ops:['Marcapasos','Autoritario','Visionario','Coercitivo'],ok:2,fb:'Da rumbo y sentido al trabajo.'},\n   {p:'El estilo autoritario es adecuado cuando:',ops:['El equipo es experto','Existe una crisis o riesgo inmediato','Se busca desarrollar talento','Hay que reparar la confianza'],ok:1,fb:'En emergencia; el problema es volverlo permanente.'},\n   {p:'El nivel de desarrollo de Blanchard se define respecto a:',ops:['La persona en general','Una tarea específica','La antigüedad','El puesto'],ok:1,fb:'Puede ser D4 en una tarea y D1 en otra.'},\n   {p:'A un colaborador competente pero insegura le corresponde:',ops:['S1 · Dirigir','S2 · Instruir','S3 · Apoyar','S4 · Delegar'],ok:2,fb:'Necesita apoyo, no más instrucciones.'},\n   {p:'Delegar a quien no tiene competencia en la tarea es:',ops:['Buen liderazgo','Abandono disfrazado de confianza','Desarrollo acelerado','Eficiencia operativa'],ok:1,fb:'El costo del error lo paga el cliente.'},\n   {p:'Las cuatro I de Bass son:',ops:['Influencia idealizada, motivación inspiracional, estímulo intelectual y consideración individual','Iniciativa, innovación, integridad e inteligencia','Instrucción, incentivo, inspección e información','Impulso, interés, intención e imagen'],ok:0,fb:'El núcleo del liderazgo transformacional.'},\n   {p:'\"Solo avísenme cuando algo salga mal\" corresponde a:',ops:['Transformacional','Transaccional','Laissez-faire','Consideración individual'],ok:2,fb:'Ausencia de liderazgo.'},\n   {p:'El liderazgo transaccional debe entenderse como:',ops:['Un error a eliminar','La base necesaria sobre la que se construye lo transformacional','Equivalente a laissez-faire','Exclusivo del personal operativo'],ok:1,fb:'Metas, medición y consecuencias sostienen la inspiración.'},\n   {p:'El círculo dorado de Sinek propone comunicar:',ops:['Qué, cómo, por qué','Por qué, cómo, qué','Cómo, por qué, qué','Qué, por qué, cómo'],ok:1,fb:'De adentro hacia afuera.'},\n   {p:'El círculo de seguridad se refiere a:',ops:['La seguridad industrial','El perímetro donde se puede reportar un error sin castigo','El grupo cercano del jefe','La estabilidad laboral'],ok:1,fb:'Lo define la reacción del líder a la mala noticia.'},\n   {p:'Los tres niveles de cultura de Schein son:',ops:['Artefactos, valores declarados y supuestos básicos','Visión, misión y valores','Normas, reglas y sanciones','Clima, conducta y resultado'],ok:0,fb:'Solo el primero es visible.'},\n   {p:'Lo que el líder tolera:',ops:['Se olvida con el tiempo','Se convierte en política no escrita','Depende del área','Solo afecta al implicado'],ok:1,fb:'Es uno de los mecanismos de transmisión cultural.'},\n   {p:'La base de la pirámide de Lencioni es:',ops:['La falta de resultados','La ausencia de confianza','El temor al conflicto','La evasión de responsabilidades'],ok:1,fb:'Todo lo demás se apoya ahí.'},\n   {p:'La armonía artificial en un equipo se reconoce porque:',ops:['Se discute demasiado','El desacuerdo ocurre fuera de la reunión','Las juntas son cortas','No hay rotación'],ok:1,fb:'La discusión real ocurre en el pasillo.'},\n   {p:'El primer paso de una conversación difícil es:',ops:['Describir el hecho observable','Expresar tu molestia','Recordar antecedentes','Anunciar la consecuencia'],ok:0,fb:'Hecho antes que interpretación.'},\n   {p:'El liderazgo Nivel 5 de Collins combina:',ops:['Carisma y visión','Humildad personal y voluntad profesional','Experiencia y autoridad','Control y disciplina'],ok:1,fb:'La combinación más contraintuitiva del hallazgo.'},\n   {p:'\"Primero quién, después qué\" significa:',ops:['Contratar después de definir la estrategia','Subir a la gente correcta antes de fijar el rumbo','Promover por antigüedad','Priorizar candidatos externos'],ok:1,fb:'La gente correcta llega con estándar propio.'},\n   {p:'El error más grave en un proceso de cambio, según Kotter, es:',ops:['Comunicar demasiado','Declarar la victoria demasiado pronto','Formar una coalición amplia','Medir los resultados'],ok:1,fb:'El impulso se pierde antes del anclaje.'},\n   {p:'La urgencia del cambio se construye:',ops:['Con la instrucción del jefe','Con datos que el equipo reconoce como propios','Con incentivos económicos','Con una campaña interna'],ok:1,fb:'La urgencia decretada no moviliza.'},\n   {p:'Anclar el cambio en la cultura implica modificar:',ops:['El organigrama','Los criterios de medición, evaluación y contratación','El espacio físico','La imagen institucional'],ok:1,fb:'Sin eso, el cambio vive solo mientras el líder lo empuja.'}]}\n]};\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
