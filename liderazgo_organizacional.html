  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

idth:1360px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:24px;flex-wrap:wrap\">\n      <div style=\"display:flex;align-items:center;gap:14px;cursor:pointer\" sc-camel-on-click=\"{{ irInicio }}\">\n        <img src=\"0211d8f4-17b7-4782-94f6-14232251419a\" alt=\"Mirage\" style=\"height:20px;width:auto;filter:invert(1) saturate(0) brightness(1.7)\">\n        <div style=\"width:1px;height:20px;background:rgba(255,255,255,.2)\"><\u002Fdiv>\n        <span style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#EE0033\">Academia Mirage<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;gap:4px;margin-left:8px;flex-wrap:wrap\">\n        <div sc-camel-on-click=\"{{ irInicio }}\" style=\"padding:8px 14px;border-radius:8px;font:600 13.5px Barlow,sans-serif;cursor:pointer;color:{{ cInicio }};background:{{ bInicio }}\" style-hover=\"color:#fff\">Inicio<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ irRuta }}\" style=\"padding:8px 14px;border-radius:8px;font:600 13.5px Barlow,sans-serif;cursor:pointer;color:{{ cRuta }};background:{{ bRuta }}\" style-hover=\"color:#fff\">Ruta del curso<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ irProgreso }}\" style=\"padding:8px 14px;border-radius:8px;font:600 13.5px Barlow,sans-serif;cursor:pointer;color:{{ cProgreso }};background:{{ bProgreso }}\" style-hover=\"color:#fff\">Mi progreso<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ irInsignias }}\" style=\"padding:8px 14px;border-radius:8px;font:600 13.5px Barlow,sans-serif;cursor:pointer;color:{{ cInsignias }};background:{{ bInsignias }}\" style-hover=\"color:#fff\">Insignias<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ irCertificado }}\" style=\"padding:8px 14px;border-radius:8px;font:600 13.5px Barlow,sans-serif;cursor:pointer;color:{{ cCertificado }};background:{{ bCertificado }}\" style-hover=\"color:#fff\">Certificado<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:1\"><\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;background:rgba(238,0,51,.12);border:1px solid rgba(238,0,51,.32)\">\n          <span style=\"width:6px;height:6px;border-radius:50%;background:#EE0033\"><\u002Fspan>\n          <span style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:13px;color:#fff\">{{ xp }}<\u002Fspan>\n          <span style=\"font:600 11px Barlow,sans-serif;letter-spacing:.1em;color:#FF8095\">XP<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px\">\n          <div style=\"width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#EE0033,#8A0020);display:flex;align-items:center;justify-content:center;font-family:Archivo,sans-serif;font-weight:800;font-size:13px;color:#fff\">{{ iniciales }}<\u002Fdiv>\n          <div style=\"line-height:1.15\">\n            <div style=\"font:600 13px Barlow,sans-serif;color:#fff\">{{ nombre }}<\u002Fdiv>\n            <div style=\"font:400 11px Barlow,sans-serif;color:rgba(232,233,236,.5)\">Nivel {{ nivelNum }} · {{ nivelNombre }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:2px;background:rgba(255,255,255,.07)\"><div style=\"height:2px;background:linear-gradient(90deg,#8A0020,#EE0033);width:{{ pct }};transition:width .6s cubic-bezier(.4,0,.2,1)\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===================== INICIO ===================== -->\n  <sc-if value=\"{{ esInicio }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"animation:mgIn .45s ease both\">\n    <div style=\"max-width:1360px;margin:0 auto;padding:64px 28px 0\">\n      <div style=\"display:grid;grid-template-columns:1.25fr .75fr;gap:44px;align-items:end\">\n        <div>\n          <div style=\"display:inline-flex;align-items:center;gap:9px;padding:7px 14px;border:1px solid rgba(238,0,51,.4);border-radius:999px;background:rgba(238,0,51,.08);margin-bottom:26px\">\n            <span style=\"width:6px;height:6px;border-radius:50%;background:#EE0033\"><\u002Fspan>\n            <span style=\"font:600 11px Barlow,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#FF5C7A\">Programa de desarrollo directivo · 10 h<\u002Fspan>\n          <\u002Fdiv>\n          <h1 style=\"margin:0 0 22px;font-family:Archivo,sans-serif;font-style:italic;font-weight:900;font-size:clamp(44px,6vw,80px);line-height:.93;letter-spacing:-.035em;color:#fff\">Liderazgo<br>Organizacional<\u002Fh1>\n          <p style=\"margin:0 0 34px;max-width:560px;font:300 19px/1.55 Barlow,sans-serif;color:rgba(232,233,236,.72);text-wrap:pretty\">Diez módulos prácticos con los modelos de Drucker, Kotter, Goleman, Blanchard, Collins, Lencioni, Sinek y Schein, aplicados a la operación de servicio, aire acondicionado y línea blanca.<\u002Fp>\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n            <div sc-camel-on-click=\"{{ continuar }}\" style=\"padding:15px 26px;border-radius:10px;background:#EE0033;font:700 15px Barlow,sans-serif;color:#fff;cursor:pointer;box-shadow:0 8px 24px rgba(238,0,51,.28)\" style-hover=\"background:#FF1A47\">{{ ctaTexto }}<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ irRuta }}\" style=\"padding:15px 26px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);font:600 15px Barlow,sans-serif;color:#fff;cursor:pointer\" style-hover=\"background:rgba(255,255,255,.11)\">Ver la ruta completa<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:28px;background:#16171B;border:1px solid rgba(255,255,255,.09);border-radius:16px\">\n          <div style=\"font:600 11px Barlow,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(232,233,236,.45);margin-bottom:18px\">Tu avance<\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-end;gap:8px;margin-bottom:6px\">\n            <span style=\"font-family:Archivo,sans-serif;font-weight:900;font-size:52px;line-height:1;color:#fff;letter-spacing:-.03em\">{{ aprobados }}<\u002Fspan>\n            <span style=\"font:400 18px Barlow,sans-serif;color:rgba(232,233,236,.45);padding-bottom:8px\">/ 10 módulos<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:16px 0 20px\"><div style=\"height:8px;border-radius:999px;background:linear-gradient(90deg,#8A0020,#EE0033);width:{{ pct }};transition:width .6s cubic-bezier(.4,0,.2,1)\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08)\">\n            <div><div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:22px;color:#fff\">{{ xp }}<\u002Fdiv><div style=\"font:400 11px Barlow,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:rgba(232,233,236,.45)\">XP<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:22px;color:#FFB000\">{{ insigniasGanadas }}<\u002Fdiv><div style=\"font:400 11px Barlow,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:rgba(232,233,236,.45)\">Insignias<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:22px;color:#00B2A9\">{{ nivelNum }}<\u002Fdiv><div style=\"font:400 11px Barlow,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:rgba(232,233,236,.45)\">Nivel<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:56px 0 0\">\n        <div style=\"padding:24px;background:#16171B;border:1px solid rgba(255,255,255,.08);border-radius:14px;border-top:2px solid #EE0033\">\n          <div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:15px;color:#fff;margin-bottom:8px\">Microlearning de 5 a 8 min<\u002Fdiv>\n          <div style=\"font:300 14px/1.6 Barlow,sans-serif;color:rgba(232,233,236,.62)\">62 lecciones cortas. Avanza entre visitas de servicio o al cierre de piso.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:24px;background:#16171B;border:1px solid rgba(255,255,255,.08);border-radius:14px;border-top:2px solid #EE0033\">\n          <div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:15px;color:#fff;margin-bottom:8px\">48 interacciones<\u002Fdiv>\n          <div style=\"font:300 14px/1.6 Barlow,sans-serif;color:rgba(232,233,236,.62)\">Simulaciones, role play, arrastrar y soltar, flashcards y quizzes con feedback inmediato.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:24px;background:#16171B;border:1px solid rgba(255,255,255,.08);border-radius:14px;border-top:2px solid #FFB000\">\n          <div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:15px;color:#fff;margin-bottom:8px\">14 insignias y 5 niveles<\u002Fdiv>\n          <div style=\"font:300 14px/1.6 Barlow,sans-serif;color:rgba(232,233,236,.62)\">De Líder en Formación a Líder Nivel 5. El progreso se guarda automáticamente.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:24px;background:#16171B;border:1px solid rgba(255,255,255,.08);border-radius:14px;border-top:2px solid #00B2A9\">\n          <div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:15px;color:#fff;margin-bottom:8px\">Certificación<\u002Fdiv>\n          <div style=\"font:300 14px/1.6 Barlow,sans-serif;color:rgba(232,233,236,.62)\">80% mínimo por módulo y examen final de 25 reactivos.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"max-width:1360px;margin:0 auto;padding:64px 28px 40px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap\">\n        <h2 style=\"margin:0;font-family:Archivo,sans-serif;font-weight:800;font-size:26px;letter-spacing:-.02em;color:#fff\">Continúa donde te quedaste<\u002Fh2>\n        <div sc-camel-on-click=\"{{ irRuta }}\" style=\"font:600 13px Barlow,sans-serif;color:#EE0033;cursor:pointer\" style-hover=\"color:#FF5C7A\">Ver los 10 módulos →<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px\">\n        <sc-for list=\"{{ destacados }}\" as=\"m\" hint-placeholder-count=\"3\">\n          <div sc-camel-on-click=\"{{ m.abrir }}\" style=\"padding:24px;background:#16171B;border:1px solid {{ m.borde }};border-radius:14px;cursor:pointer;opacity:{{ m.op }}\" style-hover=\"background:#1B1C21\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:16px\">\n              <span style=\"font-family:Archivo,sans-serif;font-style:italic;font-weight:900;font-size:30px;line-height:1;color:{{ m.color }}\">{{ m.nn }}<\u002Fspan>\n              <span style=\"padding:4px 10px;border-radius:999px;background:{{ m.chipBg }};font:600 10.5px Barlow,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:{{ m.color }}\">{{ m.estadoTexto }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font:600 17px/1.3 Barlow,sans-serif;color:#fff;margin-bottom:8px\">{{ m.t }}<\u002Fdiv>\n            <div style=\"font:300 13.5px/1.55 Barlow,sans-serif;color:rgba(232,233,236,.58);margin-bottom:16px\">{{ m.autores }}<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:12px;font:500 12px Barlow,sans-serif;color:rgba(232,233,236,.5)\"><span>{{ m.min }} min<\u002Fspan><span>·<\u002Fspan><span>{{ m.micro }} lecciones<\u002Fspan><span>·<\u002Fspan><span style=\"color:#EE0033\">{{ m.xp }} XP<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!- radius:16px\">\n        <div style=\"font:600 11px Barlow,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(232,233,236,.45);margin-bottom:22px\">Escalera de niveles<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <sc-for list=\"{{ niveles }}\" as=\"n\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:12px;background:{{ n.bg }};border:1px solid {{ n.borde }}\">\n              <div style=\"width:42px;height:42px;flex:none;border-radius:11px;background:{{ n.chipBg }};border:1px solid {{ n.borde }};display:flex;align-items:center;justify-content:center;font-family:Archivo,sans-serif;font-weight:800;font-size:16px;color:{{ n.color }}\">{{ n.i }}<\u002Fdiv>\n              <div style=\"flex:1\">\n                <div style=\"font:600 16px Barlow,sans-serif;color:#fff\">{{ n.nombre }}<\u002Fdiv>\n                <div style=\"font:300 13px Barlow,sans-serif;color:rgba(232,233,236,.5)\">{{ n.rango }} · {{ n.mods }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font:600 11px Barlow,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:{{ n.color }}\">{{ n.estado }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <div style=\"padding:28px;background:#16171B;border:1px solid rgba(255,255,255,.08);border-radius:16px\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:20px\">\n            <div style=\"font:600 11px Barlow,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(232,233,236,.45)\">Ranking de la generación<\u002Fdiv>\n            <span style=\"font:400 11px Barlow,sans-serif;color:rgba(232,233,236,.4)\">opcional<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ mostrarRanking }}\" hint-placehold \u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== INSIGNIAS ===================== -->\n  <sc-if value=\"{{ esInsignias }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:1360px;margin:0 auto;padding:56px 28px 72px;animation:mgIn .45s ease both\">\n    <h1 style=\"margin:0 0 10px;font-family:Archivo,sans-serif;font-weight:800;font-size:38px;letter-spacing:-.025em;color:#fff\">Insignias<\u002Fh1>\n    <p style=\"margin:0 0 40px;max-width:620px;font:300 17px/1.6 Barlow,sans-serif;color:rgba(232,233,236,.62)\">Diez insignias de módulo y cuatro especiales por constancia, precisión y aplicación real en tu área.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px\">\n      <sc-for list=\"{{ insignias }}\" as=\"b\" hint-placeholder-count=\"14\">\n        <div style=\"padding:24px 20px;background:#16171B;border:1px solid {{ b.borde }};border-radius:14px;text-align:center;opacity:{{ b.op }}\">\n          <div style=\"width:64px;height:64px;margin:0 auto 16px;border-radius:16px;background:{{ b.chipBg }};border:1px solid {{ b.borde }};display:flex;align-items:center;justify-content:center;font-family:Archivo,sans-serif;font-style:italic;font-weight:900;font-size:22px;color:{{ b.color }}\">{{ b.sigla }}<\u002Fdiv>\n          <div style=\"font:600 15px/1.3 Barlow,sans-serif;color:#fff;margin-bottom:6px\">{{ b.nombre }}<\u002Fdiv>\n          <div style=\"font:300 12.5px/1.5 Barlow,sans-serif;color:rgba(232,233,236,.52);margin-bottom:12px\">{{ b.criterio }}<\u002Fdiv>\n          <div style=\"font:600 10.5px Barlow,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:{{ b.color }}\">{{ b.estado }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== CERTIFICADO ===================== -->\n  <sc-if value=\"{{ esCertificado }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:13 ;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);font:600 14px Barlow,sans-serif;color:rgba(232,233,236,.75);cursor:pointer\" style-hover=\"background:rgba(255,255,255,.12)\">← Anterior<\u002Fdiv>\n        <div style=\"flex:1;font:500 13px Barlow,sans-serif;color:rgba(232,233,236,.45)\">{{ plModTitulo }}<\u002Fdiv>\n        <sc-if value=\"{{ plMostrarCta }}\" hint-placeholder-val=\"{{ true }}\">\n          <div sc-camel-on-click=\"{{ plSiguiente }}\" style=\"padding:13px 30px;border-radius:9px;background:{{ plBtnBg }};font:700 14.5px Barlow,sans-serif;color:{{ plBtnColor }};cursor:pointer;transition:all .2s\">{{ plCta }} →<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===================== PANEL DE MÓDULO ===================== -->\n  <sc-if value=\"{{ panelAbierto }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:60;background:rgba(6,6,8,.72);backdrop-filter:blur(6px);display:flex;justify-content:flex-end\" sc-camel-on-click=\"{{ cerrarPanel }}\">\n    <div sc-camel-on-click=\"{{ noPropagar }}\" style=\"width:min(560px,100%);height:100%;overflow:auto;background:#101115;border-left:1px solid rgba(255,255,255,.12);animation:mgPop .3s ease both\">\n      <div style=\"padding:36px 40px 40px\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:28px\">\n          <div style=\"font-family:Archivo,sans-serif;font-style:italic;font-weight:900;font-size:48px;line-height:1;color:{{ pColor }}\">{{ pNum }}<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ cerrarPanel }}\" style=\"width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font:400 18px Barlow,sans-serif;color:#fff;cursor:pointer\" style-hover=\"background:rgba(255,255,255,.14)\">×<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:inline-block;padding:5px 12px;border-radius:999px;background:{{ pChipBg }};font:600 10.5px Barlow,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:{{ pColor }};margin-bottom:16px\">{{ pEstado }}<\u002Fdiv>\n        <h2 style=\"margin:0 0 12px;font-family:Archivo,sans-serif;font-weight:800;font-size:28px;line-height:1.15;letter-spacing:-.02em;color:#fff\">{{ pTitulo }}<\u002Fh2>\n        <div style=\"font:300 15px/1.6 Barlow,sans-serif;color:rgba(232,233,236,.65);margin-bottom:26px\">{{ pAutores }}<\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:30px\">\n          <div style=\"padding:14px;background:#191A1F;border:1px solid rgba(255,255,255,.08);border-radius:11px\"><div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:20px;color:#fff\">{{ pMin }}<\u002Fdiv><div style=\"font:400 11px Barlow,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:rgba(232,233,236,.45)\">Minutos<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding:14px;background:#191A1F;border:1px solid rgba(255,255,255,.08);border-radius:11px\"><div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:20px;color:#fff\">{{ pMicro }}<\u002Fdiv><div style=\"font:400 11px Barlow,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:rgba(232,233,236,.45)\">Lecciones<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding:14px;background:#191A1F;border:1px solid rgba(255,255,255,.08);border-radius:11px\"><div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:20px;color:#EE0033\">{{ pXp }}<\u002Fdiv><div style=\"font:400 11px Barlow,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:rgba(232,233,236,.45)\">XP<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font:600 11px Barlow,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#EE0033;margin-bottom:14px\">Objetivos de aprendizaje<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:30px\">\n          <sc-for list=\"{{ pObjetivos }}\" as=\"o\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;gap:12px;align-items:flex-start\">\n              <div style=\"width:5px;height:5px;flex:none;margin-top:9px;border-radius:50%;background:#EE0033\"><\u002Fdiv>\n              <div style=\"font:300 15px/1.55 Barlow,sans-serif;color:rgba(232,233,236,.78)\">{{ o.t }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"font:600 11px Barlow,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#EE0033;margin-bottom:14px\">Contenido del módulo<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:30px\">\n          <sc-for list=\"{{ pPasos }}\" as=\"s\" hint-placeholder-count=\"9\">\n            <div style=\"display:flex;align-items:center;gap:14px;padding:12px 14px;background:#191A1F;border:1px solid rgba(255,255,255,.07);border-radius:10px\">\n              <span style=\"width:22px;font:700 12px Barlow,sans-serif;color:rgba(232,233,236,.4)\">{{ s.n }}<\u002Fspan>\n              <span style=\"flex:1;font:500 14.5px Barlow,sans-serif;color:#fff\">{{ s.t }}<\u002Fspan>\n              <span style=\"font:400 12px Barlow,sans-serif;color:rgba(232,233,236,.45)\">{{ s.d }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"padding:20px;background:rgba(255,176,0,.07);border:1px solid rgba(255,176,0,.25);border-radius:12px;margin-bottom:12px\">\n          <div style=\"font:600 10.5px Barlow,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#FFB000;margin-bottom:10px\">Caso real e insignia<\u002Fdiv>\n          <div style=\"font:300 14.5px/1.6 Barlow,sans-serif;color:rgba(232,233,236,.78)\">{{ pCaso }} · Al aprobar obtienes la insignia <strong style=\"color:#fff;font-weight:600\">{{ pInsignia }}<\u002Fstrong>.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:22px\">\n          <div sc-camel-on-click=\"{{ pAbrirContenido }}\" style=\"padding:15px;border-radius:10px;background:{{ pBtnBg }};text-align:center;font:700 15px Barlow,sans-serif;color:{{ pBtnColor }};cursor:{{ pBtnCursor }}\" style-hover=\"filter:brightness(1.12)\">{{ pBtnTexto }}<\u002Fdiv>\n          <sc-if value=\"{{ pPuedeCompletar }}\" hint-placeholder-val=\"{{ false }}\">\n            <div sc-camel-on-click=\"{{ completarModulo }}\" style=\"padding:13px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);text-align:center;font:600 14px Barlow,sans-serif;color:rgba(232,233,236,.8);cursor:pointer\" style-hover=\"background:rgba(255,255,255,.12)\">Marcar como aprobado (vista previa del avance)<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- PIE -->\n  <div data-print-hide=\"1\" style=\"border-top:1px solid rgba(255,255,255,.08);padding:28px;background:#0B0B0D\">\n    <div style=\"max-width:1360px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap\">\n      <span style=\"font:400 12.5px Barlow,sans-serif;color:rgba(232,233,236,.42)\">Academia Mirage · Universidad Corporativa · Liderazgo Organizacional · 10 módulos · 170 pantallas · examen final y certificación<\u002Fspan>\n      <div sc-camel-on-click=\"{{ reiniciar }}\" style=\"font:500 12.5px Barlow,sans-serif;color:rgba(232,233,236,.42);cursor:pointer\" style-hover=\"color:#EE0033\">Reiniciar mi progreso<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;nombreParticipante&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ana Robles&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Participante&quot;},&quot;mostrarRanking&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Gamificación&quot;}}\">\nconst CLAVE = 'mirage-liderazgo-progreso-v1';\n\nconst MODS = [\n  {n:1,t:'¿Qué es liderar? Dirigir no es lo mismo que administrar',autores:'Peter Drucker · John P. Kotter',min:60,micro:6,xp:120,insignia:'Punto de Partida',caso:'Toyota: liderazgo de piso y respeto por las personas',estrella:'Clasificar tareas: administrar o liderar',bloque:'Bloque I · Fundamentos y autoliderazgo',\n   obj:['Distinguir con precisión las funciones de administración y de liderazgo en tu puesto actual.','Identificar qué porcentaje de tu semana dedicas a cada una.','Aplicar el criterio de eficacia de Drucker a tres decisiones reales de tu área.']},\n  {n:2,t:'Autoliderazgo: hábitos, foco y credibilidad',autores:'Stephen Covey · Marshall Goldsmith',min:60,micro:6,xp:120,insignia:'Espejo Honesto',caso:'Satya Nadella en Microsoft: dejar de tener razón para empezar a aprender',estrella:'Matriz de urgencia e importancia interactiva',\n   obj:['Ubicar tus actividades en la matriz de urgencia e importancia y rebalancearlas.','Reconocer dos de los hábitos que hoy limitan tu credibilidad como líder.','Solicitar feedforward de forma estructurada a tu equipo.']},\n  {n:3,t:'Inteligencia emocional y los 6 estilos de liderazgo',autores:'Daniel Goleman',min:60,micro:7,xp:120,insignia:'Cabeza Fría',caso:'Southwest Airlines: contratar por actitud, entrenar la habilidad',estrella:'Role play: técnico que reacciona mal ante un cliente',\n   obj:['Nombrar tus detonadores emocionales y su efecto en el clima del equipo.','Elegir el estilo de liderazgo adecuado según la situación.','Conducir una conversación difícil sin escalar el conflicto.']},\n  {n:4,t:'Liderazgo situacional: adaptar el estilo a cada persona',autores:'Paul Hersey · Ken Blanchard',min:60,micro:6,xp:120,insignia:'Sastre del Estilo',caso:'The Home Depot: certificación por niveles del asociado de piso',estrella:'Simulador: asignar estilo a 6 colaboradores',bloque:'Bloque II · Liderar personas',\n   obj:['Diagnosticar el nivel de desarrollo de cada colaborador.','Aplicar el estilo S1–S4 correspondiente sin caer en el estilo favorito.','Ajustar tu dirección conforme la persona madura en la tarea.']},\n  {n:5,t:'Liderazgo transformacional: de la transacción a la inspiración',autores:'James MacGregor Burns · Bernard M. Bass · Bruce Avolio',min:60,micro:6,xp:120,insignia:'Multiplicador',caso:'Daikin: de fabricante de equipos a compañía de soluciones de aire',estrella:'Clasificar 10 frases de jefe en el espectro de rango completo',\n   obj:['Ubicar tu estilo actual dentro del modelo de rango completo.','Aplicar las 4 I en tu junta semanal.','Convertir instrucciones transaccionales en mensajes que movilizan.']},\n  {n:6,t:'Propósito, confianza e influencia',autores:'Simon Sinek · Peter Drucker',min:60,micro:6,xp:120,insignia:'Brújula',caso:'Patagonia: el propósito como filtro de decisiones difíciles',estrella:'Constructor de tu \"por qué\" en 3 pasos',\n   obj:['Formular el propósito de tu área en dos frases memorables.','Identificar las conductas que construyen o destruyen confianza.','Comunicar una meta impopular sin perder credibilidad.']},\n  {n:7,t:'Cultura organizacional: lo que nadie escribe pero todos obedecen',autores:'Edgar H. Schein',min:60,micro:6,xp:120,insignia:'Arqueólogo',caso:'Costco: la cultura de trato al empleado como ventaja competitiva',estrella:'Excavar el iceberg: clasificar 12 señales por nivel',bloque:'Bloque III · Cultura y equipos',\n   obj:['Leer la cultura de tu área en sus tres niveles.','Detectar brechas entre el valor declarado y el practicado.','Usar los mecanismos del líder para reforzar la cultura deseada.']},\n  {n:8,t:'Equipos de alto desempeño y conversaciones difíciles',autores:'Patrick Lencioni · Ken Blanchard',min:60,micro:7,xp:120,insignia:'Conversación Valiente',caso:'Pixar: reuniones donde el error se pone sobre la mesa temprano',estrella:'Role play ramificado: incumplimiento reiterado de protocolo',\n   obj:['Diagnosticar cuál de las cinco disfunciones frena a tu equipo.','Instalar confianza y conflicto productivo en tus reuniones.','Sostener una conversación de responsabilidad con guion de 4 pasos.']},\n  {n:9,t:'Liderazgo Nivel 5: de bueno a excelente',autores:'Jim Collins · Peter Drucker',min:60,micro:6,xp:120,insignia:'Nivel 5',caso:'Trane Technologies: disciplina de largo plazo en un mercado cíclico',estrella:'Construir el volante de tu sucursal',bloque:'Bloque IV · Legado y cambio',\n   obj:['Reconocer la combinación de humildad personal y voluntad profesional.','Aplicar \"primero quién, después qué\" en tus decisiones de personal.','Definir el volante de crecimiento de tu área.']},\n  {n:10,t:'Liderar el cambio: tu plan de 90 días',autores:'John P. Kotter · integración de los 14 autores',min:60,micro:6,xp:220,insignia:'Agente de Cambio',caso:'LEGO: reinvención dirigida tras la crisis',estrella:'Simulación final de 8 decisiones + examen final',\n   obj:['Conducir un cambio con los 8 pasos de Kotter.','Anticipar y trabajar la resistencia de tu equipo.','Presentar un plan de 90 días con metas medibles.']}\n];\n\nconst PASOS = [\n  ['01','Bienvenida del módulo','2 min'],['02','Objetivos de aprendizaje','2 min'],['03','Gancho: dato o dilema','3 min'],\n  ['04','Microlecciones con interacción','30 min'],['05','Caso de empresa real','6 min'],['06','Simulación con decisiones','8 min'],\n  ['07','Reto práctico de 7 días','4 min'],['08','Resumen visual e infografía','3 min'],['09','Quiz de evaluación · 80%','5 min']\n];\n\nconst NIVELES = [\n  {i:1,nombre:'Líder en Formación',rango:'0 – 240 XP',mods:'Módulos 1–2',min:0},\n  {i:2,nombre:'Coordinador Consciente',rango:'241 – 480 XP',mods:'Módulos 3–4',min:241},\n  {i:3,nombre:'Gerente Influyente',rango:'481 – 720 XP',mods:'Módulos 5–6',min:481},\n  {i:4,nombre:'Director Transformacional',rango:'721 – 1 000 XP',mods:'Módulos 7–8',min:721},\n  {i:5,nombre:'Líder Nivel 5',rango:'1 001 – 1 300 XP',mods:'Módulos 9–10 + examen',min:1001}\n];\n\nconst ESPECIALES = [\n  {sigla:'R5',nombre:'Racha de 5 días',criterio:'Avanzar cinco días consecutivos'},\n  {sigla:'PF',nombre:'Perfeccionista',criterio:'Tres quizzes al 100%'},\n  {sigla:'ES',nombre:'Estratega',criterio:'Todas las simulaciones resueltas de forma óptima'},\n  {sigla:'MM',nombre:'Mentor Mirage',criterio:'Los 10 retos prácticos documentados'}\n];\n\nconst ROJO='#EE0033', AMBAR='#FFB000', TURQ='#00B2A9', GRIS='rgba(232,233,236,.45)';\n\nfunction sigla(nombre){\n  const p = nombre.split(' ').filter(w=>w.length>2);\n  return (p.length>1 ? p[0][0]+p[1][0] : nombre.slice(0,2)).toUpperCase();\n}\n\nclass Component extends DCLogic {\n  state = { view:'inicio', aprobadosSet:[], abierto:null, pl:null, act:{} };\n\n  setAct(i, patch){\n    const act = Object.assign({}, this.state.act);\n    act[i] = Object.assign({}, act[i]||{}, patch);\n    this.setState({act});\n  }\n  pasosDe(mod){\n    const base = CONTENIDO[mod] || [];\n    const v = VIDEOS[mod];\n    if(!v) return base;\n    const i = base.findIndex(s=>s.tipo==='caso');\n    const paso = Object.assign({tipo:'video'}, v);\n    return i<0 ? base.concat([paso]) : base.slice(0,i).concat([paso], base.slice(i));\n  }\n  avanzar(d){\n    const p = this.state.pl; if(!p) return;\n    const total = this.pasosDe(p.mod).length;\n    const np = Math.max(0, Math.min(total-1, p.paso + d));\n    this.setState({pl: Object.assign({}, p, {paso:np})});\n    if(typeof window!=='undefined') window.scrollTo({top:0,behavior:'smooth'});\n  }\n  abrirPlayer(n){\n    if(!CONTENIDO[n]) return;\n    this.setState({view:'modulo', pl:{mod:n, paso:0, xp:0}, act:{}, abierto:null});\n  }\n\n  componentDidMount(){\n    try{\n      const raw = localStorage.getItem(CLAVE);\n      if(raw){ const d = JSON.parse(raw); if(Array.isArray(d.aprobados)) this.setState({aprobadosSet:d.aprobados}); }\n    }catch(e){}\n  }\n  guardar(lista){\n    try{ localStorage.setItem(CLAVE, JSON.stringify({aprobados:lista, ts:Date.now()})); }catch(e){}\n  }\n  aprobar(n, desdePlayer){\n    const lista = this.state.aprobadosSet.includes(n) ? this.state.aprobadosSet : this.state.aprobadosSet.concat([n]);\n    this.guardar(lista);\n    this.setState(desdePlayer\n      ? {aprobadosSet:lista, abierto:null, pl:null, act:{}, view:'ruta'}\n      : {aprobadosSet:lista, abierto:null});\n  }\n\n  estadoDe(n, ap){\n    if(ap.includes(n)) return 'aprobado';\n    if(n===1 || ap.includes(n-1)) return 'disponible';\n    return 'bloqueado';\n  }\n\n  renderVals(){\n    const ap = this.state.aprobadosSet;\n    const view = this.state.view;\n    const nombre = (this.props.nombreParticipante || 'Ana Robles');\n    const mostrarRanking = this.props.mostrarRanking ?? true;\n\n    const xp = MODS.reduce((s,m)=> s + (ap.includes(m.n) ? m.xp : 0), 0);\n    const nivel = NIVELES.slice().reverse().find(n=> xp >= n.min) || NIVELES[0];\n    const pctNum = Math.round((ap.length/10)*100);\n\n    const paleta = e => e==='aprobado' ? {color:TURQ,borde:'rgba(0,178,169,.35)',chipBg:'rgba(0,178,169,.14)',op:'1',estadoTexto:'Aprobado'}\n      : e==='disponible' ? {color:ROJO,borde:'rgba(238,0,51,.35)',chipBg:'rgba(238,0,51,.14)',op:'1',estadoTexto:'Disponible'}\n      : {color:GRIS,borde:'rgba(255,255,255,.08)',chipBg:'rgba(255,255,255,.06)',op:'.55',estadoTexto:'Bloqueado'};\n\n    const modulos = MODS.map(m=>{\n      const e = this.estadoDe(m.n, ap);\n      return Object.assign({}, m, paleta(e), {\n        nn: String(m.n).padStart(2,'0'),\n        abreBloque: !!m.bloque,\n        bloqueColor: m.n>=9 ? TURQ : (m.n===1 ? ROJO : '#E8E9EC'),\n        abrir: ()=> this.setState({abierto:m.n})\n      });\n    });\n\n    const siguiente = modulos.find(m=> m.estadoTexto!=='Aprobado') || modulos[9];\n\n    const insignias = MODS.map(m=>{\n      const g = ap.includes(m.n);\n      return {sigla:sigla(m.insignia), nombre:m.insignia, criterio:'Módulo '+m.n+' aprobado al 80%',\n        color: g?AMBAR:GRIS, borde: g?'rgba(255,176,0,.35)':'rgba(255,255,255,.08)',\n        chipBg: g?'rgba(255,176,0,.14)':'rgba(255,255,255,.05)', op: g?'1':'.5', estado: g?'Obtenida':'Pendiente'};\n    }).concat(ESPECIALES.map(b=>({sigla:b.sigla,nombre:b.nombre,criterio:b.criterio,color:GRIS,\n      borde:'rgba(255,255,255,.08)',chipBg:'rgba(255,255,255,.05)',op:'.5',estado:'Pendiente'})));\n\n    const niveles = NIVELES.map(n=>{\n      const activo = n.i===nivel.i, logrado = xp >= n.min;\n      return Object.assign({}, n, {\n        bg: activo?'rgba(238,0,51,.09)':'rgba(255,255,255,.02)',\n        borde: activo?'rgba(238,0,51,.35)': logrado?'rgba(0,178,169,.28)':'rgba(255,255,255,.08)',\n        chipBg: activo?'rgba(238,0,51,.14)': logrado?'rgba(0,178,169,.12)':'rgba(255,255,255,.05)',\n        color: activo?ROJO: logrado?TURQ:GRIS,\n        estado: activo?'En curso': logrado?'Superado':'Por alcanzar'\n      });\n    });\n\n    const base = [{nombre:'Luis Cardona',xp:640},{nombre:'María Fuentes',xp:520},{nombre:'Jorge Peña',xp:400},{nombre:'Sofía Márquez',xp:280},{nombre:'Iván Torres',xp:160}];\n    const ranking = base.concat([{nombre:nombre+' (tú)',xp:xp,yo:true}])\n      .sort((a,b)=>b.xp-a.xp).slice(0,6)\n      .map((r,i)=>({pos:i+1,nombre:r.nombre,xp:r.xp,yo:!!r.yo,\n        bg: r.yo?'rgba(238,0,51,.1)':'rgba(255,255,255,.03)',\n        color: i===0?AMBAR:(r.yo?ROJO:'rgba(232,233,236,.5)'),\n        nombreColor: r.yo?'#fff':'rgba(232,233,236,.78)'}));\n\n    const completo = ap.length===10;\n    const req = [\n      {ok: ap.length>=5, texto:'Aprobar los módulos 1 al 5', detalle: Math.min(ap.length,5)+' de 5 completados'},\n      {ok: ap.length>=10, texto:'Aprobar los módulos 6 al 10', detalle: Math.max(0,ap.length-5)+' de 5 completados'},\n      {ok: completo, texto:'Examen final de 25 reactivos', detalle: completo?'Disponible':'Se libera con los 10 módulos'},\n      {ok: completo, texto:'Presentar tu plan de 90 d
